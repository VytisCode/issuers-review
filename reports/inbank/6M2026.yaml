investor:
  - lt: "**Turimos priemonės:** subordinuota 5,5 % obligacija 2031-12-15 (15 mln. EUR) ir AT1 7,5 % neterminuota (4,5 mln. EUR). AT1 kuponus Inbank gali savo nuožiūra atidėti ar atšaukti [I1 p.26]. Savininko sąraše nurodyta 2031-12-28 data AT1 obligacijai ataskaitoje nepatvirtinta: ji neterminuota [I1 p.26]."
    en: "**Instruments held:** a 5.5% subordinated bond due 2031-12-15 (EUR 15m) and a 7.5% perpetual AT1 (EUR 4.5m). Inbank may defer or cancel AT1 coupons at its discretion [I1 p.26]. The 2031-12-28 date in the owner's list for the AT1 is not supported by the report: it is perpetual [I1 p.26]."
  - lt: "**Kapitalo atsarga:** bendras kapitalas 18,38 %, kai reikalaujama 14,66 %; CET1 13,15 % (9,85 %) [I2 p.2-3]. Reitingo nėra."
    en: "**Capital buffer:** total capital 18.38% versus a 14.66% requirement; CET1 13.15% (9.85%) [I2 p.2-3]. No credit rating."
  - lt: "Išvada: pelnas stabilus, kapitalas ir likvidumas su atsarga. Subordinuotoms priemonėms svarbiausia – kapitalo atsarga virš reikalavimų."
    en: "Conclusion: stable profit, capital and liquidity with headroom. For subordinated instruments the key is the capital buffer above requirements."

