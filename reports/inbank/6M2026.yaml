quick_summary:
  - lt: "**Pelnas stabilus:** I pusm. grynasis pelnas 8,3 mln. EUR (8,1 mln.), II ketv. – 4,3 mln. EUR (3,6 mln.); ROE 9,6 % [I1 p.5, p.9]."
    en: "**Stable profit:** 1H net profit EUR 8.3m (8.1m), Q2 EUR 4.3m (3.6m); ROE 9.6% [I1 p.5, p.9]."
  - lt: "**Kapitalas su atsarga:** CET1 13,15 %, bendras kapitalas 18,38 %, sverto rodiklis 10,83 %; birželį išleista nauja 8,34 mln. EUR AT1 emisija (8,25 %) [I2 p.3-4; I1 p.5, p.26]."
    en: "**Capital with headroom:** CET1 13.15%, total capital 18.38%, leverage ratio 10.83%; a new EUR 8.34m AT1 (8.25%) was issued in June [I2 p.3-4; I1 p.5, p.26]."
  - lt: "**Didelis likvidumas:** LCR 1 161 %, NSFR 133 %; indėliai 1 320 mln. EUR [I2 p.4; I1 p.8]."
    en: "**High liquidity:** LCR 1,161%, NSFR 133%; deposits EUR 1,320m [I2 p.4; I1 p.8]."
  - lt: "**Nauja kryptis:** su Eurobank kuriama 50/50 įmonė Graikijoje (licencijavimas vyksta, pradžia – 2027 m. I ketv.) [I1 p.5]."
    en: "**New direction:** a 50/50 embedded-finance joint venture with Eurobank in Greece (licensing under way, launch expected Q1 2027) [I1 p.5]."

business:
  - lt: "Paskolų ir nuomos portfelis 1,32 mlrd. EUR [I1 p.5]. Rizikos kaina 1,54 % – vartojimo finansavimo bankui įprasta ir, pasak vadovybės, tikslo ribose [I1 p.5]."
    en: "Loan and rental portfolio EUR 1.32bn [I1 p.5]. Cost of risk 1.54%, normal for a consumer finance bank and, per management, within the target range [I1 p.5]."
  - lt: "Žaliasis finansavimas II ketv. – 28,4 mln. EUR (−23 %); 2025 m. – 146 mln. EUR (+65 %) [I1 p.5; I3]."
    en: "Green financing in Q2 EUR 28.4m (−23%); EUR 146m in 2025 (+65%) [I1 p.5; I3]."
  - lt: "Vėluojančių >90 d. privačių paskolų dalis – 2,4 % (apskaičiuota įrankio) [I1 p.20]."
    en: "Share of private loans >90 days past due 2.4% (calculated by the tool) [I1 p.20]."

