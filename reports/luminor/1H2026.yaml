        lt: Su JT Pasauliniu susitarimu ar OECD gairėmis susijusių ginčų viešuose šaltiniuose ir naujienose nerasta (2026-10-22). Baudų dėl pinigų plovimo prevencijos neskelbta; vienintelė 2025 m. priežiūros pastaba – Finantsinspektsioon nurodymas dėl bazinių mokėjimo paslaugų tvarkos [L2 p.16].
        en: No UN Global Compact or OECD related controversies found in public sources and the news scan (2026-10-22). No AML fines reported; the only regulatory note in 2025 was a Finantsinspektsioon precept on basic payment service procedures [L2 p.16].
    sanctions:
      status: review
      evidence:
        lt: Automatinė patikra ES, JT, JAV OFAC ir JK konsoliduotuose sankcijų sąrašuose.
        en: Automatic check against the EU, UN, US OFAC and UK consolidated sanctions lists.
    media:
      status: 'yes'
      evidence:
        lt: "Neigiamų naujienų apie pačią Luminor nerasta; dauguma naujienų – apie OTP Bank sandorį. 2026-09-28–29 spauda rašė apie pirkėjo OTP klientų sąsajas su Rusija – tai susiję su pirkėju, ne su Luminor veikla [N3; N2]."
        en: "No adverse news about Luminor itself; most news is about the OTP Bank deal. On 2026-09-28/29 the press wrote about links of the buyer OTP's clients to Russia – this concerns the buyer, not Luminor's business [N3; N2]."
    int_promoting:
      status: 'yes'
      evidence:
        lt: Tvaraus NT ir atsinaujinančios energetikos paskolos 2025 m. – 305,4 mln. EUR (2024 m. – 182,4 mln.), tikslas – 700 mln. EUR iki 2030 m.; žalios ar su tvarumu susietos obligacijos sudaro 7,4 % obligacijų portfelio; Sustainalytics ESG rizikos reitingas 18,4 (maža rizika) [L2 p.19].
        en: Sustainable real estate and renewable energy lending EUR 305.4m in 2025 (EUR 182.4m in 2024), target EUR 700m by 2030; green or sustainability-linked bonds 7.4% of the bond portfolio; Sustainalytics ESG risk rating 18.4 (low risk) [L2 p.19].
    int_taxonomy:
      status: 'yes'
      evidence:
        lt: Tikslas – klimato neutralumas iki 2050 m. [L2 p.19]; finansuojamos emisijos skaičiuojamos PCAF metodu [L2 p.22]; žalios ar su tvarumu susietos obligacijos sudaro 7,4 % obligacijų portfelio, tikslas – 50 % iki 2030 m. [L2 p.19].
        en: Target to become climate neutral by 2050 [L2 p.19]; financed emissions measured with the PCAF method [L2 p.22]; green or sustainability-linked bonds 7.4% of the bond portfolio, target 50% by 2030 [L2 p.19].
    int_yellow_flag:
      status: 'yes'
      evidence:
        lt: Geltonų signalų nerasta. Gavus leidimus savininku taps OTP Bank (Vengrija) [L1 p.4].
        en: No yellow flags found. Ownership will move to OTP Bank (Hungary) once approvals are received [L1 p.4].
    int_seb_policies:
      status: 'yes'
      evidence:
        lt: '**Taikoma:** SEB neturi bankų sektoriaus politikos, todėl taikoma investicijų politika bei aplinkosaugos ir socialinė / žmogaus teisių politikos [SP1 p.5, p.7]. **Atitinka:** valdymo ar tarptautinių normų pažeidimų nerasta (greita paieška 2026-10-22); finansuojamos emisijos atskleidžiamos pagal PCAF (3 apimtis – 3,2 mln. t CO2e 2025 m.) [L2 p.22]; tikslas – klimato neutralumas iki 2050 m. [L2 p.19]; tvaraus NT ir atsinaujinančios energetikos paskolos 305,4 mln. EUR, tikslas – 700 mln. EUR iki 2030 m. [L2 p.19]; Sustainalytics ESG rizikos reitingas 18,4 (maža rizika) [L2 p.19]; įsipareigojimas gerbti žmogaus teises [L2 p.18]; PPTFP ir sankcijų atitiktis [L2 p.18]; antikorupcijos priemonės ir pranešėjų kanalai [L2 p.23, p.28]. **Galėtų būti geriau:** viešo skolinimo išimčių sąrašo (anglis, nafta ir dujos, ginklai) ir narystės JT Pasauliniame susitarime nerasta.'
        en: '**Applicable:** no SEB sector policy for banks, so the Investments policy and the Environmental and Social & Human Rights policies apply [SP1 p.5, p.7]. **Met:** no breach of governance or international norms found (quick search, 2026-10-22); financed emissions disclosed using PCAF (Scope 3 3.2m t CO2e in 2025) [L2 p.22]; climate neutrality target for 2050 [L2 p.19]; sustainable real estate and renewable lending EUR 305.4m, target EUR 700m by 2030 [L2 p.19]; Sustainalytics ESG risk rating 18.4 (low risk) [L2 p.19]; human rights commitment [L2 p.18]; AML and sanctions compliance [L2 p.18]; anti-bribery measures and whistleblowing channels [L2 p.23, p.28]. **Could be improved:** no public lending exclusion list (coal, oil & gas, weapons) or UN Global Compact membership found.'
    engagement:
      status: 'no'
      evidence:
        lt: 'Nereikia: kapitalas, likvidumas ir ESG praktika – tvirti.'
        en: 'No need: capital, liquidity and ESG practices are solid.'
    indicators:
      status: 'yes'
      evidence:
        lt: Finansuojamos emisijos (3 apimtis) 2025 m. – 3,2 mln. t CO2e, PCAF metodas [L2 p.22]; moterų dalis stebėtojų taryboje – 33,3 % (tikslas 40 %) [L2 p.29]; Sustainalytics ESG rizikos reitingas 18,4, maža rizika [L2 p.19].
        en: Financed emissions (Scope 3) 3.2m t CO2e in 2025, PCAF method [L2 p.22]; women on the Supervisory Council 33.3% (target 40%) [L2 p.29]; Sustainalytics ESG risk rating 18.4, low risk [L2 p.19].
