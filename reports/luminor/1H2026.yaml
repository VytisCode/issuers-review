quick_summary:
  - lt: "**Pelnas sumažėjo maždaug penktadaliu:** 2026 m. I pusm. grynasis pelnas 72,0 mln. EUR, prieš metus – 91,6 mln.; vien II ketv. – 37,4 mln. EUR (46,2 mln.). Nuosavo kapitalo grąža 7,7 % [L1 p.5, p.16]."
    en: "**Profit down about a fifth:** 1H 2026 net profit EUR 72.0m versus 91.6m a year ago; Q2 alone EUR 37.4m versus 46.2m. Return on equity 7.7% [L1 p.5, p.16]."
    lv: "1H 2026 tīrā peļņa 72,0 milj. EUR (1H 2025 – 91,6 milj.), 2. cet. – 37,4 milj. EUR (46,2 milj.); ROE 7,7 % [L1 p.5, p.16]."
    et: "1H 2026 puhaskasum 72,0 mln eurot (1H 2025: 91,6 mln), II kv 37,4 mln eurot (46,2 mln); ROE 7,7% [L1 p.5, p.16]."
  - lt: "**Kapitalas ir likvidumas gerokai viršija reikalavimus:** CET1 19,6 %, bendras kapitalas 23,7 %. MREL 36,34 % TREA, kai reikalaujama 23,69 % plius buferiai. Likvidumas: LCR 187,0 %, NSFR 142,3 % [L1]."
    en: "**Capital and liquidity well above requirements:** CET1 19.6% and total capital 23.7%. MREL 36.34% of TREA versus a 23.69% requirement plus buffers. Liquidity: LCR 187.0%, NSFR 142.3% [L1]."
    lv: "Kapitāls un likviditāte augsti: CET1 19,6 %, kopējais kapitāls 23,7 %, MREL 36,34 % no TREA (prasība 23,69 % + rezerves), LCR 187,0 %, NSFR 142,3 % [L1]."
    et: "Kapital ja likviidsus kõrged: CET1 19,6%, kogukapital 23,7%, MREL 36,34% TREA-st (nõue 23,69% + puhvrid), LCR 187,0%, NSFR 142,3% [L1]."
  - lt: "**Keičiasi savininkas:** 2026-07-20 paskelbta, kad OTP Bank įsigis 100 % Luminor iš Blackstone konsorciumo ir DNB. Laukiama priežiūros institucijų leidimų. Moody's reitingą ir perspektyvą paliko [L1 p.4, p.15]."
    en: "**New owner coming:** on 2026-07-20 it was announced that OTP Bank will buy 100% of Luminor from the Blackstone-led consortium and DNB. Regulatory approvals are pending. Moody's kept the rating and outlook [L1 p.4, p.15]."
    lv: "Īpašnieka maiņa: 2026-07-20 paziņots, ka OTP Bank iegādāsies 100 % Luminor Holding akciju no Blackstone konsorcija un DNB; nepieciešamas uzraugu atļaujas. Pēc paziņojuma Moody's apstiprināja reitingu un perspektīvu [L1 p.4, p.15]."
    et: "Omaniku vahetus: 20.07.2026 teatati, et OTP Bank omandab 100% Luminor Holdingust Blackstone'i juhitud konsortsiumilt ja DNB-lt; vaja on järelevalveasutuste lube. Pärast teadet kinnitas Moody's reitingu ja väljavaate [L1 p.4, p.15]."
  - lt: "**Dalis kapitalo bus grąžinta:** 2026-07-17 ECB leido sumažinti CET1 kapitalą 200,0 mln. EUR; tikimasi IV ketv. [L1 p.4, p.8]."
    en: "**Part of capital to be returned:** on 2026-07-17 the ECB approved a EUR 200.0m reduction of CET1 capital, expected in Q4 2026 [L1 p.4, p.8]."
    lv: "Uzraugs (ECB, 2026-07-17) atļāva samazināt CET1 kapitālu par 200,0 milj. EUR; gaidāms 4. cet. [L1 p.4, p.8]."
    et: "Järelevalve (EKP, 17.07.2026) kiitis heaks CET1 kapitali vähendamise 200,0 mln euro võrra, oodatavalt IV kv-s [L1 p.4, p.8]."
  - lt: "**Pigesnis finansavimas:** grąžinta 300 mln. EUR pirmaeilė obligacija (MS+4,471 %) ir išleista pirmoji 500 mln. EUR senior non-preferred obligacija (MS+1,28 %) [L1]."
    en: "**Cheaper funding:** a EUR 300m senior bond at MS+4.471% was repaid and the first EUR 500m senior non-preferred bond was issued at MS+1.28% [L1]."
    lv: "Finansējums: 1H 2026 dzēsta 300 milj. EUR senior obligācija (MS+4,471 %) un emitēta pirmā 500 milj. EUR senior non-preferred obligācija (MS+1,28 %) [L1]."
    et: "Rahastamine: 1H 2026 lunastati 300 mln euro senior võlakiri (MS+4,471%) ja emiteeriti esimene 500 mln euro senior non-preferred võlakiri (MS+1,28%) [L1]."

