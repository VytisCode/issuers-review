  conclusion:
    lt: 'Išimčių ir raudonų signalų nėra. Tvirta ESG praktika: matuojamos finansuojamos emisijos (PCAF), klimato neutralumo tikslas, augančios žaliosios paskolos ir mažos rizikos ESG reitingas. Savininku taps OTP Bank.'
    en: 'No exclusions or red flags. Solid ESG practice: financed emissions measured (PCAF), climate-neutrality target, growing green lending and a low ESG risk rating. Ownership moves to OTP Bank.'
press:
  - lt: "**OTP sandoris:** 2026-10-13 Europos Komisija leido OTP Bank įsigyti Luminor Holding [N1]."
    en: "**OTP deal:** on 2026-10-13 the European Commission cleared OTP Bank's acquisition of Luminor Holding [N1]."
  - lt: "**Dėmesio – pirkėjo ryšiai su Rusija:** 2026-09-28–29 spauda (remdamasi Bloomberg) rašė, kad tarp OTP klientų yra su „Gazprom“ siejamų įmonių ir kad OTP svarsto visiškai pasitraukti iš Rusijos. Tai susiję su pirkėju OTP, ne su Luminor veikla [N3; N2]."
    en: "**Attention – buyer's Russia links:** on 2026-09-28/29 the press (citing Bloomberg) reported that OTP's clients include companies linked to Gazprom and that OTP is considering a full exit from Russia. This concerns the buyer OTP, not Luminor's own business [N3; N2]."
  - lt: "**Obligacijos:** 2026-09-26 Latvijos spauda rašė, kad Luminor Bank anuliuoja 500 mln. EUR vertės obligacijas; kurios emisijos – antraštėje nenurodyta [N4]."
    en: "**Bonds:** on 2026-09-26 Latvian media reported that Luminor Bank is cancelling bonds worth EUR 500m; the headline does not name the issue [N4]."
market:
  - lt: "**Palūkanos ir konkurencija:** grynosios palūkanų pajamos +1,6 % iki 111,2 mln. EUR dėl didesnių indėlių ir indėlių maržų kylant bazinėms palūkanoms, bet paskolų maržas mažino konkurencija; NIM 2,75 % (prieš metus 2,95 %) [L1 p.5]."
    en: "**Rates and competition:** net interest income +1.6% to EUR 111.2m on higher balances and deposit spreads as reference rates rose, offset by lower lending spreads due to competition; NIM 2.75% (2.95%) [L1 p.5]."
  - lt: "**Sąnaudos:** išlaidos +3,2 % iki 90,5 mln. EUR, iš jų IT migracijos 20,3 mln. EUR; personalo išlaidos +16,6 % perimant veiklas ir samdant programuotojus [L1 p.5]. Dauguma sektoriaus mokesčių baigėsi [L1 p.5]."
    en: "**Costs:** expenses +3.2% to EUR 90.5m, of which migration costs EUR 20.3m; personnel costs +16.6% from insourcing and hiring developers [L1 p.5]. Most sector-specific taxes lapsed [L1 p.5]."
  - lt: "**Perspektyva:** vadovybė regiono perspektyvą vertina teigiamai ir IV ketv. planuoja 200 mln. EUR CET1 kapitalo sumažinimą [L1 p.3]."
    en: "**Outlook:** management sees a positive outlook for the Baltics and plans a EUR 200m CET1 capital reduction in Q4 [L1 p.3]."
