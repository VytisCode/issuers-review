quick_summary:
  - lt: "1H 2026 grynasis pelnas 72,0 mln. EUR (1H 2025 – 91,6 mln.), II ketv. – 37,4 mln. EUR (46,2 mln.); ROE 7,7 % [L1 p.5, p.16]."
    en: "1H 2026 net profit EUR 72.0m (1H 2025: 91.6m), 2Q EUR 37.4m (46.2m); ROE 7.7% [L1 p.5, p.16]."
    lv: "1H 2026 tīrā peļņa 72,0 milj. EUR (1H 2025 – 91,6 milj.), 2. cet. – 37,4 milj. EUR (46,2 milj.); ROE 7,7 % [L1 p.5, p.16]."
    et: "1H 2026 puhaskasum 72,0 mln eurot (1H 2025: 91,6 mln), II kv 37,4 mln eurot (46,2 mln); ROE 7,7% [L1 p.5, p.16]."
  - lt: "Kapitalas ir likvidumas aukšti: CET1 19,6 %, bendras kapitalas 23,7 %, MREL 36,34 % TREA (reikalavimas 23,69 % + buferiai), LCR 187,0 %, NSFR 142,3 % [L1]."
    en: "Capital and liquidity high: CET1 19.6%, total capital 23.7%, MREL 36.34% of TREA (requirement 23.69% + buffers), LCR 187.0%, NSFR 142.3% [L1]."
    lv: "Kapitāls un likviditāte augsti: CET1 19,6 %, kopējais kapitāls 23,7 %, MREL 36,34 % no TREA (prasība 23,69 % + rezerves), LCR 187,0 %, NSFR 142,3 % [L1]."
    et: "Kapital ja likviidsus kõrged: CET1 19,6%, kogukapital 23,7%, MREL 36,34% TREA-st (nõue 23,69% + puhvrid), LCR 187,0%, NSFR 142,3% [L1]."
  - lt: "Savininko keitimas: 2026-07-20 paskelbta, kad OTP Bank įsigis 100 % Luminor Holding akcijų iš Blackstone konsorciumo ir DNB; reikia priežiūros institucijų leidimų. Po pranešimo Moody's patvirtino reitingą ir perspektyvą [L1 p.4, p.15]."
    en: "Change of owner: on 2026-07-20 it was announced that OTP Bank will acquire 100% of Luminor Holding from the Blackstone-led consortium and DNB; regulatory approvals pending. Moody's affirmed the rating and outlook after the announcement [L1 p.4, p.15]."
    lv: "Īpašnieka maiņa: 2026-07-20 paziņots, ka OTP Bank iegādāsies 100 % Luminor Holding akciju no Blackstone konsorcija un DNB; nepieciešamas uzraugu atļaujas. Pēc paziņojuma Moody's apstiprināja reitingu un perspektīvu [L1 p.4, p.15]."
    et: "Omaniku vahetus: 20.07.2026 teatati, et OTP Bank omandab 100% Luminor Holdingust Blackstone'i juhitud konsortsiumilt ja DNB-lt; vaja on järelevalveasutuste lube. Pärast teadet kinnitas Moody's reitingu ja väljavaate [L1 p.4, p.15]."
  - lt: "Priežiūros institucija (ECB, 2026-07-17) leido sumažinti CET1 kapitalą 200,0 mln. EUR; tikimasi IV ketv. [L1 p.4, p.8]."
    en: "The regulator (ECB, 2026-07-17) approved a CET1 capital reduction of EUR 200.0m, expected in Q4 2026 [L1 p.4, p.8]."
    lv: "Uzraugs (ECB, 2026-07-17) atļāva samazināt CET1 kapitālu par 200,0 milj. EUR; gaidāms 4. cet. [L1 p.4, p.8]."
    et: "Järelevalve (EKP, 17.07.2026) kiitis heaks CET1 kapitali vähendamise 200,0 mln euro võrra, oodatavalt IV kv-s [L1 p.4, p.8]."
  - lt: "Finansavimas: 1H 2026 išpirkta 300 mln. EUR pirmaeilė obligacija (MS+4,471 %) ir išleista pirmoji 500 mln. EUR senior non-preferred obligacija (MS+1,28 %) [L1]."
    en: "Funding: in 1H 2026 a EUR 300m senior bond (MS+4.471%) was redeemed and an inaugural EUR 500m senior non-preferred bond issued (MS+1.28%) [L1]."
    lv: "Finansējums: 1H 2026 dzēsta 300 milj. EUR senior obligācija (MS+4,471 %) un emitēta pirmā 500 milj. EUR senior non-preferred obligācija (MS+1,28 %) [L1]."
    et: "Rahastamine: 1H 2026 lunastati 300 mln euro senior võlakiri (MS+4,471%) ja emiteeriti esimene 500 mln euro senior non-preferred võlakiri (MS+1,28%) [L1]."

