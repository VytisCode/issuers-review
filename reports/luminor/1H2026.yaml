investor:
  - lt: "Turimos priemonės: trys terminuotos obligacijos (7,75 % 2027, 4,042 % 2028, 3,551 % 2029) ir neterminuota 7,375 % obligacija. Rangas (senior / SNP / AT1), sumos ir pirkimo datos emitento sąraše nenurodyti – patikrinti galutines sąlygas (Final Terms) [L3]."
    en: "Instruments held: three dated bonds (7.75% 2027, 4.042% 2028, 3.551% 2029) and a perpetual 7.375% bond. Ranking (senior / SNP / AT1), amounts and call dates are not on the issuer's list - check the Final Terms [L3]."
    lv: "Turētie instrumenti: trīs termiņa obligācijas (7,75 % 2027, 4,042 % 2028, 3,551 % 2029) un beztermiņa 7,375 % obligācija. Rangs (senior / SNP / AT1), apjomi un atsaukšanas datumi emitenta sarakstā nav norādīti – pārbaudīt galīgos noteikumus (Final Terms) [L3]."
    et: "Hoitavad instrumendid: kolm tähtajalist võlakirja (7,75% 2027, 4,042% 2028, 3,551% 2029) ja tähtajatu 7,375% võlakiri. Järk (senior / SNP / AT1), mahud ja ennetähtaegse lunastuse kuupäevad emitendi nimekirjas puuduvad – kontrollida lõpptingimusi (Final Terms) [L3]."
  - lt: "Obligacijų turėtojams: kapitalo ir MREL atsargos gerokai viršija reikalavimus, likvidumas padidėjo. 200 mln. EUR CET1 sumažinimas atsargą sumažins; bankas poveikio CET1 rodikliui šaltiniuose nenurodo [L1]."
    en: "For bondholders: capital and MREL buffers are well above requirements and liquidity has increased. The EUR 200m CET1 reduction will lower the buffer; the bank does not state the impact on the CET1 ratio in the sources [L1]."
    lv: "Obligāciju turētājiem: kapitāla un MREL rezerves ievērojami pārsniedz prasības, likviditāte pieaugusi. 200 milj. EUR CET1 samazinājums samazinās rezervi; banka avotos ietekmi uz CET1 rādītāju nenorāda [L1]."
    et: "Võlakirjaomanikele: kapitali- ja MREL-puhvrid ületavad nõudeid tunduvalt ning likviidsus on kasvanud. 200 mln euro CET1 vähendamine vähendab puhvrit; pank ei too allikates mõju CET1 suhtarvule [L1]."
  - lt: "OTP sandoris: patikrinti obligacijų sąlygas dėl kontrolės pasikeitimo ir naujo savininko reitingo poveikį. XS3079969104 – emitento sąraše išpirkimas nurodytas 2028-06-12, pavadinime – 2029 (galimai pirkimo opcionas 2028) [L1; L3]."
    en: "OTP deal: check bond terms for change of control and the effect of the new owner's rating. XS3079969104 - the issuer list shows maturity 2028-06-12 but 2029 in the name (possibly a 2028 call) [L1; L3]."
    lv: "OTP darījums: pārbaudīt obligāciju noteikumus par kontroles maiņu un jaunā īpašnieka reitinga ietekmi. XS3079969104 – emitenta sarakstā dzēšana norādīta 2028-06-12, nosaukumā – 2029 (iespējams, atsaukšanas tiesības 2028) [L1; L3]."
    et: "OTP tehing: kontrollida võlakirjade tingimusi kontrolli muutuse osas ja uue omaniku reitingu mõju. XS3079969104 – emitendi nimekirjas on lunastus 12.06.2028, nimes aga 2029 (võimalik ennetähtaegne lunastus 2028) [L1; L3]."
  - lt: "Išvada: pelningumas mažėja (pelnas −21 % per 1H), tačiau kapitalas, MREL ir likvidumas – su didelėmis atsargomis. Pagrindinis įvykis turėtojams – savininko keitimas į OTP. Stebėti: 3Q ataskaitą, OTP sandorio leidimus, kapitalo sumažinimą IV ketv."
    en: "Conclusion: profitability is declining (1H profit −21%), but capital, MREL and liquidity have large buffers. The key event for holders is the change of owner to OTP. Watch: 3Q report, OTP deal approvals, the Q4 capital reduction."
    lv: "Secinājums: rentabilitāte samazinās (1H peļņa −21 %), taču kapitālam, MREL un likviditātei ir lielas rezerves. Galvenais notikums turētājiem – īpašnieka maiņa uz OTP. Sekot: 3. cet. pārskatam, OTP darījuma atļaujām, kapitāla samazinājumam 4. cet."
    et: "Järeldus: kasumlikkus väheneb (1H kasum −21%), kuid kapitali, MREL-i ja likviidsuse puhvrid on suured. Võlakirjaomanike jaoks on põhisündmus omaniku vahetus OTP-ks. Jälgida: III kv aruanne, OTP tehingu load, IV kv kapitali vähendamine."

