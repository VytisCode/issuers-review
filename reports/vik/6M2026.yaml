investor:
  - lt: "**Turimos priemonės:** 2,826 % obligacija, išpirkimas 2027-06-30 (Nasdaq Vilnius nuo 2022-07-04), ir 3,119 % gynybos obligacija – 25 mln. EUR, išleista 2025-09-24, išpirkimas 2029-09-24; jos lėšos visos skirtos Rheinmetall projektui [K2 p.11, p.13; K1 p.17]."
    en: "**Instruments held:** a 2.826% bond maturing 2027-06-30 (Nasdaq Vilnius since 2022-07-04) and a 3.119% defence bond, EUR 25m, issued 2025-09-24, maturing 2029-09-24, with proceeds fully allocated to the Rheinmetall project [K2 p.11, p.13; K1 p.17]."
  - lt: "**Kredito rizika artima valstybės:** obligacijų įsipareigojimams suteikta valstybės garantija, todėl Fitch A+ reitingas susietas su Lietuvos reitingu [K1 p.8, p.17-18]."
    en: "**Credit risk close to the sovereign:** the bonds are backed by a state guarantee, so the Fitch A+ rating is linked to Lithuania's rating [K1 p.8, p.17-18]."
  - lt: "Išvada: rizika maža – valstybės nuosavybė ir garantija, mažėjanti skola, grįžtančios fondo lėšos."
    en: "Conclusion: low risk thanks to state ownership and guarantee, falling debt and returning fund money."

