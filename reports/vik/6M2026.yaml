quick_summary:
  - lt: "**Valstybės gynybos investuotojas:** VIK finansuoja Lietuvos gynybos pramonę ir kitus strateginius sektorius; pagrindinis projektas – Rheinmetall amunicijos gamykla Baisogaloje (VIK investicija iki 71,05 mln. EUR) [K1 p.4, p.11; K2 p.5, p.9]."
    en: "**State defence investor:** VIK finances Lithuania's defence industry and other strategic sectors; its main project is the Rheinmetall ammunition plant in Baisogala (VIK investment up to EUR 71.05m) [K1 p.4, p.11; K2 p.5, p.9]."
  - lt: "**Reitingas pagerėjo:** Fitch obligacijų programai suteikė A+ – aukščiausią iki šiol [K1 p.10]."
    en: "**Rating upgraded:** Fitch rates the bond programme A+, the highest so far [K1 p.10]."
  - lt: "**Pinigai grįžta iš Verslo paramos fondo:** iš 200 mln. EUR grąžinta 120,5 mln. EUR (60 %), likusieji – iki 2028 m. vidurio; 2026-07-02 gauta dar 22 mln. EUR [K1 p.8, p.11; K2 p.7]."
    en: "**Cash returning from the Business Support Fund:** EUR 120.5m (60%) of the EUR 200m returned so far, the rest by mid-2028; another EUR 22m received on 2026-07-02 [K1 p.8, p.11; K2 p.7]."
  - lt: "**Skola mažėja:** iš 125 mln. EUR išleistų obligacijų 75 mln. EUR jau išpirkta [K2 p.5, p.8]."
    en: "**Debt falling:** EUR 75m of the EUR 125m of bonds issued has already been redeemed [K2 p.5, p.8]."

business:
  - lt: "2025 m. VIK įsigijo 49 % EPSO-G Invest (36,3 mln. EUR), kuri valdo 48 % Rheinmetall Defence Lietuva; gamyklos statyba pradėta 2025-11-04 [K2 p.5, p.8-9]."
    en: "In 2025 VIK bought 49% of EPSO-G Invest (EUR 36.3m), which owns 48% of Rheinmetall Defence Lietuva; plant construction started on 2025-11-04 [K2 p.5, p.8-9]."
  - lt: "2026 m. pasirašytas memorandumas su Rheinmetall Landsysteme ir KNDS Deutschland dėl ~50 mln. EUR techninės priežiūros centro Kauno LEZ [K1 p.10]."
    en: "In 2026 a memorandum was signed with Rheinmetall Landsysteme and KNDS Deutschland on a ~EUR 50m maintenance centre in the Kaunas FEZ [K1 p.10]."
  - lt: "2026-02 akcininkas nusprendė perduoti VIK akcijas valstybės valdomai ILTE (reikia Vyriausybės pritarimo) [K2 p.14; K1 p.10]."
    en: "In February 2026 the shareholder decided to transfer VIK's shares to the state-controlled ILTE (Government approval needed) [K2 p.14; K1 p.10]."

financials:
  - lt: "Turtas 169,4 mln. EUR, nuosavas kapitalas 118,9 mln. EUR; I pusm. pelnas 7,1 mln. EUR, daugiausia dėl 8,0 mln. EUR tikrosios vertės padidėjimo [K1 p.20-21]."
    en: "Total assets EUR 169.4m, equity EUR 118.9m; 1H profit EUR 7.1m, mainly from an EUR 8.0m fair value gain [K1 p.20-21]."
  - lt: "2025 m. pelnas 3,8 mln. EUR (2024 m. – 8,1 mln.); išleistų obligacijų likutis 2026-06-30 – apie 50,6 mln. EUR (apskaičiuota įrankio) [K2 p.22; K3 p.5; K1 p.20]."
    en: "FY2025 profit EUR 3.8m (2024: 8.1m); bonds outstanding at 2026-06-30 about EUR 50.6m (calculated by the tool) [K2 p.22; K3 p.5; K1 p.20]."

