quick_summary:
  - lt: "**Laikotarpiai:** finansiniai metai – liepos 1 d.–birželio 30 d.; FY2026 = 2025-07–2026-06, 6M2026 = 2025-07–2025-12 [L1 p.12; L2 p.12]."
    en: "**Periods:** the financial year runs 1 July - 30 June; FY2026 = Jul 2025 - Jun 2026, 6M2026 = Jul-Dec 2025 [L1 p.12; L2 p.12]."
  - lt: "**Pardavimai mažesni, pelnas stabilus:** pajamos 240,2 mln. EUR (254,3 mln.), pelnas 2,77 mln. EUR (2,74 mln.), tai 1,1 % apyvartos; grūdų kainos išliko žemos, dalis derliaus neatitiko maistinių reikalavimų dėl drėgno oro [L1 p.4-5, p.7, p.12]."
    en: "**Sales lower, profit stable:** revenue EUR 240.2m (254.3m), profit EUR 2.77m (2.74m), 1.1% of turnover; grain prices stayed low and part of the harvest missed food-grade standards due to wet weather [L1 p.4-5, p.7, p.12]."
  - lt: "**Sąlygų laikomasi:** koreguota kapitalo dalis 29,4 % (32,8 %), riba ≥20 %; koreguota EBITDA / palūkanos 2,7 karto (2,7), riba ≥2,0 [L1 p.20]."
    en: "**Covenants met:** adjusted equity ratio 29.4% (32.8%), floor 20%; adjusted EBITDA / interest 2.7x (2.7x), floor 2.0x [L1 p.20]."
  - lt: "**Skola auga:** grynoji skola apie 62,4 mln. EUR (prieš metus 45,1 mln.; mūsų skaičiavimas), turtas 142,0 mln. EUR (121,4 mln.) [L1 p.13-14, p.18-19]."
    en: "**Debt rising:** net debt about EUR 62.4m (45.1m a year earlier; own calculation), total assets EUR 142.0m (121.4m) [L1 p.13-14, p.18-19]."

business:
  - lt: "Kooperatyvas superka, sandėliuoja ir eksportuoja narių grūdus ir rapsus (beveik 30 šalių); sandėlių talpa beveik 220 000 t; valdo LATMALT (salyklas, 100 %) [L1 p.1, p.5; L2 p.8]."
    en: "The cooperative buys, stores and exports its members' grain and rapeseed (to nearly 30 countries); storage capacity nearly 220,000 t; owns LATMALT (malt, 100%) [L1 p.1, p.5; L2 p.8]."
  - lt: "Jelgavoje statoma žirnių baltymų gamykla (ASNS Ingredient, 51,42 %): iki 70 000 t žirnių per metus, investicija 132 mln. EUR, pabaiga planuojama 2027 m. I pusm. [L1 p.1, p.7]."
    en: "A pea protein plant is being built in Jelgava (ASNS Ingredient, 51.42%): up to 70,000 t of peas a year, EUR 132m investment, completion planned in 1H 2027 [L1 p.1, p.7]."
  - lt: "2026-09 baigtos 4,2 mln. EUR investicijos į Jaunpagasto, Aizkrauklės ir Jēkabpilio sandėlius (ES lėšos); parduota Alpha Osta dalis [L1 p.2, p.7]."
    en: "EUR 4.2m of investment in the Jaunpagasts, Aizkraukle and Jēkabpils sites (EU co-financed) was completed in September 2026; the Alpha Osta stake was sold [L1 p.2, p.7]."

financials:
  - lt: "Bendrasis pelnas 16,9 mln. EUR (17,6 mln.), palūkanų sąnaudos 2,86 mln. EUR (2,71 mln.) [L1 p.12]. Nuosavas kapitalas 36,7 mln. EUR (34,4 mln.) [L1 p.14]."
    en: "Gross profit EUR 16.9m (17.6m), interest expense EUR 2.86m (2.71m) [L1 p.12]. Equity EUR 36.7m (34.4m) [L1 p.14]."
  - lt: "EBITDA atskirai neskelbiama; skelbiamas tik kovenanto rodiklis EBITDA / palūkanos [L1 p.20]."
    en: "EBITDA is not reported separately; only the covenant ratio EBITDA / interest is given [L1 p.20]."

