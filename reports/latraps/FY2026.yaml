investor:
  - lt: "**Turima priemonė:** 7,5 % obligacija, 8 mln. EUR, išleista 2024-12, išpirkimas 2028-12-12, kuponas kas ketvirtį; Nasdaq Riga First North nuo 2025-03-05 [L5; L1 p.19]."
    en: "**Instrument held:** a 7.5% bond, EUR 8m, issued December 2024, maturing 2028-12-12, quarterly coupon; Nasdaq Riga First North since 2025-03-05 [L5; L1 p.19]."
  - lt: "**Sąlygos:** koreguota kapitalo dalis ≥20 % (yra 29,4 %), koreguota EBITDA ≥2 kartų palūkanų (yra 2,7) – laikomasi [L1 p.20]. Rezervas iki ribų sumažėjo per metus (kapitalo dalis 32,8 % → 29,4 %)."
    en: "**Covenants:** adjusted equity ratio ≥20% (29.4%), adjusted EBITDA ≥2x interest (2.7x) – met [L1 p.20]. Headroom shrank over the year (equity ratio 32.8% → 29.4%)."
  - lt: "**Eilė ir užtikrinimas:** obligacija sudaro mažą skolos dalį (8 iš ~63,5 mln. EUR); rangas ir užtikrinimas ataskaitose nerasti [L1 p.18-19]."
    en: "**Ranking and security:** the bond is a small part of debt (8 of ~EUR 63.5m); ranking and security were not found in the reports [L1 p.18-19]."
  - lt: "Išvada: vidutinė rizika – maža pelno marža ir auganti skola, bet sąlygų laikomasi ir pelnas stabilus."
    en: "Conclusion: moderate risk – thin profit margin and rising debt, but covenants are met and profit is stable."

