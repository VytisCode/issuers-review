market:
  - lt: "**Žemos grūdų kainos:** grūdų kainos išliko žemos, o gamybos kaštai aukšti – pardavimo kainos gerokai žemesnės nei per ankstesnius penkerius metus [L1 p.4]. ES augintojų kaštai didesni nei konkuruojančių eksporto regionų [L1 p.4]."
    en: "**Low grain prices:** grain prices stayed low while production costs remained high – selling prices well below the previous five years [L1 p.4]. EU growers have higher costs than competing export regions [L1 p.4]."
  - lt: "**Oras:** per drėgna vasara ir ruduo apsunkino derliaus nuėmimą; neįprastai didelė dalis grūdų neatitiko maistinių reikalavimų ir parduota pašarams, tačiau bendras derlius buvo geresnis nei prognozuota [L1 p.4, p.5]."
    en: "**Weather:** an overly wet summer and autumn hampered harvesting; an unusually large share of grain missed food-grade standards and was sold as feed, though overall yields beat forecasts [L1 p.4, p.5]."
  - lt: "**Rezultatas:** apyvarta 240 mln. EUR, pelnas 2,7 mln. EUR (1,1 % apyvartos); pelningumą slegia augantys verslo ir darbo kaštai Latvijoje [L1 p.6]."
    en: "**Result:** turnover EUR 240m, profit EUR 2.7m (1.1% of turnover); rising business and labour costs in Latvia weigh on profitability [L1 p.6]."
