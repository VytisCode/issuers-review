quick_summary:
  - lt: "**Refinansavimo rizika:** 2026-12-04 išperkamos 8,5 % obligacijos – 24,7 mln. EUR; trumpalaikiai įsipareigojimai viršija trumpalaikį turtą; ataskaitoje nurodomas reikšmingas neapibrėžtumas dėl veiklos tęstinumo [E1 p.32-34]."
    en: "**Refinancing risk:** 8.5% bonds of EUR 24.7m are due on 2026-12-04; current liabilities exceed current assets; the report discloses a material uncertainty about going concern [E1 p.32-34]."
  - lt: "**Parduodami projektai:** pasamdyti pardavimo patarėjai ir vyksta derybos su pirkėjais; 2026-06-30 Zala Elektriba SIA perleista UAB Sorlena (sandorio vertė 24,0 mln. EUR) [E1 p.24-25, p.33; E2 p.1]."
    en: "**Projects for sale:** sell-side advisers hired and talks with buyers under way; on 2026-06-30 Zala Elektriba SIA was moved to UAB Sorlena (transaction value EUR 24.0m) [E1 p.24-25, p.33; E2 p.1]."
  - lt: "**Nuostolis:** I pusm. grynasis nuostolis 5,1 mln. EUR (prieš metus 4,1 mln.); 2025 m. – 11,7 mln. EUR [E1 p.4; E3 p.4]."
    en: "**Loss:** 1H net loss EUR 5.1m (4.1m a year earlier); FY2025 EUR 11.7m [E1 p.4; E3 p.4]."
  - lt: "**Skola mažėja:** grynoji skola 63,5 mln. EUR (2025 m. pab. 76,1 mln.); 2026-06-17 visiškai išpirkta 2021–2026 m. obligacija (20,7 mln. EUR) [E1 p.19; E3 p.24; E2 p.1]."
    en: "**Debt falling:** net debt EUR 63.5m (76.1m at end-2025); the 2021-2026 bond (EUR 20.7m) was fully redeemed on 2026-06-17 [E1 p.19; E3 p.24; E2 p.1]."

business:
  - lt: "AEI – uždaro tipo investicinė bendrovė informuotiems investuotojams, valdoma UAB LORDS LB Asset Management; veiklos terminas pratęstas iki 2028-02-05 [E1 p.9]."
    en: "AEI is a closed-end investment company for informed investors managed by UAB LORDS LB Asset Management; its term has been extended to 2028-02-05 [E1 p.9]."
  - lt: "Portfelio įrengta galia 317,9 MW: Žaliosios investicijos (25 %, vėjas, LT) 185,5 MW, PL SUN (Lenkija, saulė) 72,0 MW veikia, PV Energy Projects (Lenkija, saulė) 50,8 MW veikia; vystoma 590 MW saulės, 490 MW vėjo ir 57 MW kaupimo [E2 p.1; E1 p.9]."
    en: "Installed portfolio capacity is 317.9 MW: Žaliosios investicijos (25%, wind, LT) 185.5 MW, PL SUN (Poland, solar) 72.0 MW operating, PV Energy Projects (Poland, solar) 50.8 MW operating; 590 MW solar, 490 MW wind and 57 MW storage in development [E2 p.1; E1 p.9]."
  - lt: "Latvijoje statomas 112 MW vėjo parkas (WPR2): pamatai baigti, pradėtas turbinų montavimas [E2 p.1]."
    en: "A 112 MW wind farm (WPR2) is being built in Latvia: foundations done, turbine erection started [E2 p.1]."

financials:
  - lt: "2026-06-30 turtas 153,6 mln. EUR, nuosavas kapitalas 83,7 mln. EUR, įsipareigojimai 69,9 mln. EUR; pinigai 1,7 mln. EUR (be 2,6 mln. EUR apribotų) [E1 p.3, p.19]."
    en: "At 2026-06-30 total assets EUR 153.6m, equity EUR 83.7m, liabilities EUR 69.9m; cash EUR 1.7m (excluding EUR 2.6m restricted) [E1 p.3, p.19]."
  - lt: "Išleistų obligacijų balansinė vertė 59,0 mln. EUR, paskolos 6,2 mln. EUR [E1 p.19]. Įprastinių pajamų eilutės nėra – „visos pajamos“ apima tikrosios vertės pokyčius [E1 p.4]."
    en: "Bonds carrying amount EUR 59.0m, loans EUR 6.2m [E1 p.19]. There is no standard revenue line; 'total income' includes fair value changes [E1 p.4]."
  - lt: "Lenkijos išskaičiuoto mokesčio grąžinimas: 2026-06 palankus antros instancijos sprendimas, likutis su palūkanomis gautas 2026-07 [E1 p.17]."
    en: "Polish withholding tax refund: a favourable second-instance decision in June 2026, the rest with interest received in July 2026 [E1 p.17]."

