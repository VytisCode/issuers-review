quick_summary:
  - lt: "**Stiprus III ketvirtis:** grynasis pelnas 37,5 mln. EUR (prieš metus 26,3 mln.), ROE 19,3 %. Per 9 mėn. pelnas 81,9 mln. EUR, šiek tiek mažiau nei prieš metus (86,2 mln.) [H1 p.6]."
    en: "**Strong third quarter:** net profit EUR 37.5m (EUR 26.3m a year ago), ROE 19.3%. Nine-month profit EUR 81.9m, slightly below last year (EUR 86.2m) [H1 p.6]."
  - lt: "**Planas bus įvykdytas:** vadovybė teigia, kad III ketv. rezultatai „aiškiai lenkia finansinį planą“ ir metų tikslai bus pasiekti. 2026 m. plane – 117,9 mln. EUR pelno [H1 p.4; H6]."
    en: "**On track for the plan:** management says Q3 results were \"firmly ahead of our financial plans\" and the year's targets will be met. The 2026 plan is EUR 117.9m net profit [H1 p.4; H6]."
  - lt: "**Kapitalo atsarga mažesnė:** bendras kapitalas 20,25 % (2025 m. pab. 22,39 %), CET1 15,28 % (17,04 %). Vidinis tikslas – 20,0 % [H1 p.10-11]."
    en: "**Smaller capital buffer:** total capital 20.25% (YE2025 22.39%), CET1 15.28% (17.04%). The internal target is 20.0% [H1 p.10-11]."
  - lt: "**Likvidumas ir MREL – su atsarga:** LCR 173,9 %, MREL 35,04 % TREA, kai reikalaujama 24,59 % [H1 p.10]."
    en: "**Liquidity and MREL with headroom:** LCR 173.9%, MREL 35.04% of TREA versus a 24.59% requirement [H1 p.10]."
  - lt: "**Auga paskolos:** paskolos klientams 5 951 mln. EUR (+8,9 % nuo 2025 m. pab.; mūsų skaičiavimas), indėliai 7 735 mln. EUR [H1 p.6, p.19]."
    en: "**Loans growing:** loans to customers EUR 5,951m (+8.9% since YE2025; own calculation), deposits EUR 7,735m [H1 p.6, p.19]."

business:
  - lt: "Grynosios palūkanų pajamos per 9 mėn. 190,6 mln. EUR (+8,8 %), visos pajamos 232,7 mln. EUR (+3,0 %; pokyčiai – mūsų skaičiavimas). Palūkanų marža III ketv. 2,80 % (prieš metus 2,36 %) [H1 p.6]."
    en: "Nine-month net interest income EUR 190.6m (+8.8%), total income EUR 232.7m (+3.0%; changes are own calculation). Q3 net interest margin 2.80% (2.36% a year ago) [H1 p.6]."
  - lt: "Sąnaudų / pajamų santykis per 9 mėn. 57,0 % (prieš metus 51,7 %). III ketv. atleista 8,9 mln. EUR atidėjinių, todėl paskolų nuostoliai neigiamo poveikio neturėjo [H1 p.6, p.18]."
    en: "Nine-month cost/income 57.0% (51.7% a year ago). EUR 8.9m of provisions were released in Q3, so loan losses had no negative impact [H1 p.6, p.18]."
  - lt: "LHV Bank (JK) atsilieka nuo plano: pelnas iki mokesčių 4,7 mln. GBP, planuota 7,2 mln.; rugsėjį įneštas 10 mln. GBP CET1 kapitalas [H1 p.15]."
    en: "LHV Bank (UK) is behind plan: profit before tax GBP 4.7m versus GBP 7.2m planned; GBP 10m of CET1 capital injected in September [H1 p.15]."
  - lt: "Trečios stadijos (neveiksnios) paskolos – 72,4 mln. EUR, apie 1,2 % paskolų (mūsų skaičiavimas) [H1 p.12]."
    en: "Stage 3 (non-performing) loans EUR 72.4m, about 1.2% of loans (own calculation) [H1 p.12]."

financials:
  - lt: "2025 m. grynasis pelnas 117,0 mln. EUR (2024 m. – 150,3 mln.), ROE 16,0 % (24,5 %): krito palūkanų normos, todėl sumažėjo palūkanų pajamos. 2025 m. tikslų bankas nepasiekė, pelningumas buvo 6,5 % mažesnis [H2 p.8, p.14-15]."
    en: "FY2025 net profit EUR 117.0m (2024: 150.3m), ROE 16.0% (24.5%): lower interest rates reduced interest income. The bank missed its 2025 targets, with profitability 6.5% short [H2 p.8, p.14-15]."
  - lt: "2025 m. pabaigos kapitalo rodikliai perskaičiuoti po ECB patikrinimo: CET1 17,04 % (metinėje ataskaitoje – 17,42 %), bendras kapitalas 22,39 % (22,85 %). ECB skyrė 0,4 mln. EUR baudą dėl neteisingai apskaičiuoto rizikos svertinio turto, susijusio su investicija į JK įmonę [H1 p.10; H2 p.13]."
    en: "Year-end 2025 capital ratios were restated after an ECB inspection: CET1 17.04% (annual report: 17.42%), total capital 22.39% (22.85%). The ECB imposed a EUR 0.4m penalty for wrongly calculated risk-weighted assets related to the investment in the UK entity [H1 p.10; H2 p.13]."
  - lt: "Dividendai: per 9 mėn. 2026 m. išmokėta 57,9 mln. EUR; dividendas akcijai už 2025 m. – 0,09 EUR (už 2024 m. – 0,13 EUR) [H1 p.20; H2 p.15]."
    en: "Dividends: EUR 57.9m paid in 9M 2026; dividend per share for 2025 EUR 0.09 (2024: EUR 0.13) [H1 p.20; H2 p.15]."

