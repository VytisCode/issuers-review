investor:
  - lt: "**Turimos priemonės (visos – LHV Group, kontroliuojančiosios bendrovės):** trys pirmaeilės (senior unsecured) obligacijos – 5,375 % 2028 (pirkimo teisė 2027-05-24, 300 mln. EUR), 4,125 % 2029 (pirkimo teisė 2028-06-18, 60 mln. EUR) ir kintamos palūkanų normos 2027-10-03 (100 mln. EUR); dvi Tier 2 – 6,0 % 2034 (20 mln. EUR) ir 5,5 % 2035 (80 mln. EUR); AT1 9,5 % neterminuota (50 mln. EUR) [H2 p.17; H3; H4]."
    en: "**Instruments held (all issued by LHV Group, the holding company):** three senior unsecured bonds, 5.375% 2028 (call 2027-05-24, EUR 300m), 4.125% 2029 (call 2028-06-18, EUR 60m) and an FRN due 2027-10-03 (EUR 100m); two Tier 2, 6.0% 2034 (EUR 20m) and 5.5% 2035 (EUR 80m); and a 9.5% perpetual AT1 (EUR 50m) [H2 p.17; H3; H4]."
  - lt: "**Reitingas:** Moody's LHV Group pirmaeilėms obligacijoms – Baa2 su teigiama perspektyva [H5]."
    en: "**Rating:** Moody's rates LHV Group senior unsecured debt Baa2 with a positive outlook [H5]."
  - lt: "**Subordinuotoms obligacijoms:** bendras kapitalas 20,25 % viršija vidinį 20,0 % tikslą tik nedaug, o MREL 35,04 % yra virš 30,59 % ribos, nuo kurios priklauso dividendų mokėjimas [H1 p.10-11]. AT1 kuponų mokėjimui tai reiškia didesnį jautrumą kapitalui nei senior obligacijoms."
    en: "**For subordinated bonds:** total capital of 20.25% is only slightly above the internal 20.0% target, while MREL of 35.04% is above the 30.59% level that gates dividends [H1 p.10-11]. AT1 coupons are therefore more sensitive to capital than the senior bonds."
  - lt: "**2026 m. finansavimas:** išleista nauja 200 mln. EUR 4,50 % senior obligacija (2030) ir 15 mln. EUR 8,0 % AT1; anksčiau laiko išpirkta 20 mln. EUR 7,0 % obligacija EE3300003250 [H3; H4]."
    en: "**2026 funding:** a new EUR 200m 4.50% senior bond (2030) and a EUR 15m 8.0% AT1 were issued; the EUR 20m 7.0% bond EE3300003250 was redeemed early [H3; H4]."
  - lt: "Išvada: pelningumas atsigauna ir planas vykdomas, likvidumas bei MREL – su atsarga. Kapitalo atsarga sumažėjo, tačiau bankas laikosi vidinio tikslo."
    en: "Conclusion: profitability is recovering and the plan is on track; liquidity and MREL have headroom. The capital buffer is smaller, but the bank stays within its internal target."

esg:
  policies: [investments, financial_general, climate_nature, human_rights, anti_corruption]
  items:
    excl_sectors:
      status: 'yes'
      evidence:
        lt: "Bankas nevykdo veiklos išskirtuose sektoriuose. Viešai skelbiamas veiklų, kurios prieštarauja kredito politikai, sąrašas [H8]. Kredito politika draudžia finansuoti klientus, kurių veikla aiškiai pažeidžia žmogaus teises ar daro rimtą žalą aplinkai [H7 p.80]."
        en: "The bank is not active in excluded sectors. It publishes a list of activities that go against its credit policy [H8]. The credit policy rules out lending to customers with clear evidence of human rights violations or serious environmental harm [H7 p.80]."
    excl_red_flag:
      status: 'yes'
      evidence:
        lt: "Su JT Pasauliniu susitarimu ar EBPO gairėmis susijusių ginčų nerasta (greita paieška 2026-10-22). Vienintelė priežiūros sankcija – 0,4 mln. EUR ECB bauda dėl rizikos svertinio turto skaičiavimo [H2 p.13]."
        en: "No UN Global Compact or OECD related controversies found (quick search, 2026-10-22). The only supervisory penalty is a EUR 0.4m ECB fine over risk-weighted asset calculation [H2 p.13]."
    sanctions:
      status: review
      evidence:
        lt: "Automatinė patikra ES, JT, JAV OFAC ir JK konsoliduotuose sankcijų sąrašuose."
        en: "Automatic check against the EU, UN, US OFAC and UK consolidated sanctions lists."
    media:
      status: 'yes'
      evidence:
        lt: "Neigiamų naujienų apie LHV nerasta (paieška estų ir anglų k., 2026-10-22). Svarbiausia byla, kurioje LHV yra reikalaujanti šalis: 2025-07 bankas pranešė Pinigų plovimo duomenų biurui ketinantis reikalauti 247,5 mln. EUR baudos, nes biuras be teisinio pagrindo 1 289 kartus gavo LHV klientų sąskaitų išrašus [H9]."
        en: "No adverse news about LHV found (search in Estonian and English, 2026-10-22). The main case has LHV as the claimant: in July 2025 the bank notified the Financial Intelligence Unit of its intent to claim a EUR 247.5m contractual penalty, because the unit accessed LHV client account statements 1,289 times without legal basis [H9]."
    int_promoting:
      status: 'yes'
      evidence:
        lt: "**Tvarūs produktai:** energiją taupančių būstų paskolos, elektromobilių lizingas, daugiabučių renovacijos ir energetikos projektų paskolos, EIF tvarių paskolų programa [H7 p.80]. **Tikslai:** bent 50 % naujų būsto paskolų – A ir B energinės klasės, 100 % elektros iš atsinaujinančių šaltinių iki 2030 m. [H7 p.97]. Nuo 2030 m. nebus finansuojami nauji dyzeliniai lengvieji automobiliai [H7 p.81]."
        en: "**Sustainable products:** energy-efficient home loans, EV leasing, apartment renovation and energy project loans, the EIF sustainable loan programme [H7 p.80]. **Targets:** at least 50% of new mortgages for A and B energy class housing, 100% renewable electricity by 2030 [H7 p.97]. No financing of new diesel passenger cars from 2030 [H7 p.81]."
    int_taxonomy:
      status: 'yes'
      evidence:
        lt: "Siekia prisidėti prie Paryžiaus susitarimo tikslų ir perėjimo prie klimatui neutralios ekonomikos iki 2050 m. [H7 p.80, p.86]. Žaliojo turto santykis – 4,86 % [H7 p.95]."
        en: "Aims to contribute to the Paris Agreement goals and the transition to a climate-neutral economy by 2050 [H7 p.80, p.86]. Green asset ratio 4.86% [H7 p.95]."
    int_yellow_flag:
      status: 'yes'
      evidence:
        lt: "Geltonų signalų nerasta."
        en: "No yellow flags found."
    int_seb_policies:
      status: 'yes'
      evidence:
        lt: "**Taikoma:** SEB neturi bankų sektoriaus politikos, todėl taikoma investicijų politika bei aplinkosaugos ir socialinė / žmogaus teisių politikos [SP1 p.5, p.7]. **Atitinka:** veiklų išimčių sąrašas [H8]; žmogaus teisių ir aplinkos kriterijai kredito politikoje [H7 p.80]; žmogaus teisių rizikų vertinimas [H7 p.90]; klimato tikslai [H7 p.97]; ESG politika [H8]. **Galėtų būti geriau:** finansuojamos emisijos (PCAF) skaičiais neskelbiamos [H7 p.88]."
        en: "**Applicable:** no SEB sector policy for banks, so the Investments policy and the Environmental and Social & Human Rights policies apply [SP1 p.5, p.7]. **Met:** activity exclusion list [H8]; human rights and environmental criteria in the credit policy [H7 p.80]; human rights risk assessment [H7 p.90]; climate targets [H7 p.97]; ESG policy [H8]. **Could be improved:** financed emissions (PCAF) are not disclosed as figures [H7 p.88]."
    engagement:
      status: 'no'
      evidence:
        lt: "Nereikia: bankas pelningas, likvidumas ir MREL – su atsarga, ESG praktika tvarkinga."
        en: "No need: the bank is profitable, liquidity and MREL have headroom and ESG practice is in order."
    indicators:
      status: 'yes'
      evidence:
        lt: "Nuosavos 1 apimties emisijos – 0 t CO2e, 3 apimties – 573 454 t CO2e 2025 m. [H7 p.98]; žaliojo turto santykis 4,86 % [H7 p.95]; moterų dalis grupės valdyboje ir taryboje – 30 % [H7 p.85]."
        en: "Own Scope 1 emissions 0 t CO2e, Scope 3 573,454 t CO2e in 2025 [H7 p.98]; green asset ratio 4.86% [H7 p.95]; women on the Group management and supervisory boards 30% [H7 p.85]."
