    engagement: {lt: '', en: ''}
    indicators: {lt: '', en: ''}
  conclusion:
    lt: "Išimčių ir raudonų signalų nėra. Tvarūs produktai ir aiškūs klimato tikslai; finansuojamos emisijos kol kas neskelbiamos skaičiais."
    en: "No exclusions or red flags. Sustainable products and clear climate targets; financed emissions are not yet disclosed as figures."
market:
  - lt: "**Didesnės palūkanos – didesnės pajamos:** III ketv. grynosios palūkanų pajamos 68,8 mln. EUR (+24 % per metus); vadovybės teigimu, pajamos viršija planą dėl aukštesnių nei tikėtasi rinkos palūkanų ir stiprios paskolų paklausos [H1 p.4]."
    en: "**Higher rates, higher income:** Q3 net interest income EUR 68.8m (+24% y/y); management says income exceeds the budget thanks to higher-than-expected market rates and strong loan demand [H1 p.4]."
  - lt: "**Palūkanų aplinka:** ECB padidino indėlių normą iki 2,50 %, 6 mėn. Euribor rugsėjo pabaigoje pakilo iki 3,0 %, 12 mėn. – apie 3,3 % [H1 p.7]. Estijoje infliacija rugsėjį paspartėjo iki 3,5 % [H1 p.8]."
    en: "**Rate environment:** the ECB raised the deposit rate to 2.50%, 6-month Euribor rose to 3.0% by end-September and 12-month to about 3.3% [H1 p.7]. Estonian inflation accelerated to 3.5% in September [H1 p.8]."
  - lt: "**Perspektyva:** vadovybė tikina, kad finansinio plano tikslai bus pasiekti – rodikliai geresni nei planuota [H1 p.4]."
    en: "**Outlook:** management is confident of meeting its financial plan, with key indicators ahead of plan [H1 p.4]."
