market:
  - lt: "**Augimas ir Euribor:** III ketv. pelnas 9,1 mln. EUR (+30 % per metus) dėl didesnių paskolų apimčių, geros portfelio kokybės ir kylančio Euribor [C1 p.3]; grynųjų palūkanų marža 3,2 % (prieš metus 3,0 %) [C1 p.5]."
    en: "**Growth and Euribor:** Q3 profit EUR 9.1m (+30% y/y) on higher lending volumes, good portfolio quality and rising Euribor [C1 p.3]; NIM 3.2% (3.0% a year earlier) [C1 p.5]."
  - lt: "**Finansavimas ir rizika:** finansavimo kaina 2,1 % (2,3 %), indėliai +131 mln. EUR per ketvirtį; vertės sumažėjimas 0,4 mln. EUR, pradelstos paskolos 2 % (2,3 %) [C1 p.3]."
    en: "**Funding and risk:** cost of funding 2.1% (2.3%), deposits +EUR 131m in the quarter; impairments EUR 0.4m, overdue loans 2% (2.3%) [C1 p.3]."
  - lt: "**Tikslai:** iki 2030 m. – daugiau nei 60 mln. EUR metinio pelno ir augti sparčiau nei Estijos bankų rinka [C1 p.3]."
    en: "**Targets:** more than EUR 60m annual profit by 2030 and faster growth than the Estonian banking market [C1 p.3]."
