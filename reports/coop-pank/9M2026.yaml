quick_summary:
  - lt: "**Pelnas auga:** 9 mėn. grynosios palūkanų pajamos 63,1 mln. EUR (54,2 mln.), pelnas 25,6 mln. EUR (21,5 mln.); III ketv. ROE 14,6 %, sąnaudų ir pajamų santykis 52,5 % [C1 p.5, p.9]."
    en: "**Profit up:** 9M net interest income EUR 63.1m (54.2m), profit EUR 25.6m (21.5m); Q3 ROE 14.6%, cost/income 52.5% [C1 p.5, p.9]."
  - lt: "**Augimas:** paskolos 2,30 mlrd. EUR (+14 % per metus, mūsų skaičiavimas), indėliai 2,37 mlrd. EUR [C1 p.6, p.10]."
    en: "**Growth:** loans EUR 2.30bn (+14% year on year, own calculation), deposits EUR 2.37bn [C1 p.6, p.10]."
  - lt: "**Kapitalas ir likvidumas:** CET1 14,75 %, T1 16,72 %, bendras 19,86 %; sverto rodiklis 7,88 %; LCR 213 %, NSFR 125 % [C1 p.6-7]."
    en: "**Capital and liquidity:** CET1 14.75%, T1 16.72%, total 19.86%; leverage 7.88%; LCR 213%, NSFR 125% [C1 p.6-7]."
  - lt: "**Priežiūros nurodymas:** po patikrinimo Finansų inspekcija 2026-10-21 nurodė pagerinti valdyseną, vidaus kontrolę, rizikos valdymą, ataskaitas ir skolinimo procedūras; bankas sutinka, terminai 2026–2027 m., įtakos finansiniams rezultatams nėra [X1]."
    en: "**Supervisory precept:** after an inspection, on 2026-10-21 the Estonian FSA ordered improvements to governance, internal control, risk management, reporting and lending procedures; the bank agrees, deadlines in 2026-2027, no impact on reported results [X1]."

business:
  - lt: "Estijos bankas, kurio strateginis akcininkas – Coop Eesti; Coop Investeeringud 22 %, Coop kooperatyvai 19 %, Andres Sonn 8 % [C3; C1 p.23]."
    en: "An Estonian bank whose strategic shareholder is Coop Eesti; Coop Investeeringud 22%, Coop cooperatives 19%, Andres Sonn 8% [C3; C1 p.23]."
  - lt: "2026-09 EMTN programa padidinta iki 1,5 mlrd. EUR (įtraukti nepadengti ir Tier 2 vertybiniai popieriai); 2026-06 baigta sintetinė pakeitimo vertybiniais popieriais operacija su EIF [C1 p.4, p.7]."
    en: "In September 2026 the EMTN programme was raised to EUR 1.5bn (adding senior unsecured and Tier 2 notes); a synthetic securitisation with the EIF was finalised in June 2026 [C1 p.4, p.7]."

financials:
