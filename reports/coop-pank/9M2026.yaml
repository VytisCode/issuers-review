    en: "FY2025 profit EUR 28.7m (32.2m), ROE 12.9% (16.2%), cost/income 52.3% (49.6%) [C2]."
  - lt: "Dividendai: 2026-04 išmokėta 6,5 ct akcijai; politika – 25 % pelno prieš mokesčius [C2; C8]."
    en: "Dividends: 6.5 cents a share paid in April 2026; policy is 25% of pre-tax profit [C2; C8]."

