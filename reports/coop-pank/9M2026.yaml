investor:
  - lt: "**Turima priemonė:** 12 % neterminuota AT1 obligacija EE3300003649, išleista 2023-09-18, 12 mln. EUR, kuponas kas ketvirtį; pirmoji išpirkimo data 2028-09-18; nekotiruojama [C6]."
    en: "**Instrument held:** 12% perpetual AT1 note EE3300003649, issued 2023-09-18, EUR 12m, quarterly coupon; first call date 2028-09-18; unlisted [C6]."
  - lt: "**Sąlygos:** subordinuota, žemiau indėlių ir Tier 2; kuponą bankas gali atšaukti savo nuožiūra, atšaukti kuponai nekaupiami; nominali vertė laikinai nurašoma, jei grupės CET1 nukristų žemiau ribos, nurodytos galutinėse sąlygose (šios serijos riba nerasta) [C7 4, 5(2), 7]."
    en: "**Terms:** subordinated, below deposits and Tier 2; the bank may cancel coupons at its discretion and cancelled coupons do not accumulate; principal is temporarily written down if group CET1 falls below the trigger in the Final Terms (this series' trigger level was not found) [C7 4, 5(2), 7]."
  - lt: "**Atsarga:** CET1 14,75 %, gerokai virš reikalavimų; bankas atitinka visus kapitalo reikalavimus [C1 p.7-8]."
    en: "**Headroom:** CET1 14.75%, well above requirements; the bank meets all capital requirements [C1 p.7-8]."
  - lt: "Išvada: vidutinė rizika – pelningas bankas su gera kapitalo atsarga; AT1 rizika ir priežiūros nurodymas."
    en: "Conclusion: moderate risk – a profitable bank with good capital headroom; AT1 risk and a supervisory precept."

