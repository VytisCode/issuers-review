investor:
  - lt: "**Turima priemonė:** 12 % neterminuota AT1 obligacija EE3300003581 (2023 m. rugpjūčio serija), išleista 2023-08-31, 5,08 mln. EUR, kuponas kas ketvirtį; nekotiruojama (privatus platinimas) [B6]."
    en: "**Instrument held:** 12% perpetual AT1 note EE3300003581 (August 2023 series), issued 2023-08-31, EUR 5.08m, quarterly coupon; unlisted (private placement) [B6]."
  - lt: "**Sąlygos:** išpirkti galima ne anksčiau kaip po 5 metų (pirmoji palūkanų data po to – 2028-09-15, apskaičiuota įrankio), su priežiūros institucijos leidimu [B7 6(e)]. Jei grupės ar banko CET1 nukristų žemiau 7 %, nominali vertė laikinai nurašoma; kuponą bankas gali atšaukti savo nuožiūra, atšaukti kuponai nekaupiami [B6; B7 5(2), 7]."
    en: "**Terms:** callable no earlier than 5 years after issue (first interest date after that is 2028-09-15, calculated by the tool), with supervisory approval [B7 6(e)]. If group or bank CET1 falls below 7%, the principal is temporarily written down; the bank may cancel coupons at its discretion and cancelled coupons do not accumulate [B6; B7 5(2), 7]."
  - lt: "**Atsarga:** CET1 13,2 % – apie 6 p. p. virš nurašymo ribos [B1 p.10]. AT1 yra žemiausio rango skola (žemiau indėlių ir Tier 2) [B7 4]."
    en: "**Headroom:** CET1 13.2% – about 6 pp above the trigger [B1 p.10]. AT1 is the lowest-ranking debt (below deposits and Tier 2) [B7 4]."
  - lt: "Išvada: vidutinė rizika – pelningas ir augantis bankas su pakankamu kapitalu, bet AT1 ir neigiama Moody's perspektyva."
    en: "Conclusion: moderate risk – a profitable, growing bank with adequate capital, but an AT1 instrument and a negative Moody's outlook."

