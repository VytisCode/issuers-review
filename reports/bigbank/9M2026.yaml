quick_summary:
  - lt: "**Pelnas stabilus, sąnaudos auga:** 9 mėn. grynosios palūkanų pajamos 94,0 mln. EUR (78,7 mln.), pelnas 30,1 mln. EUR (30,2 mln.); sąnaudų ir pajamų santykis 51,2 % (46,7 %), ROE 12,9 % (14,3 %) [B1 p.7]."
    en: "**Profit stable, costs rising:** 9M net interest income EUR 94.0m (78.7m), profit EUR 30.1m (30.2m); cost/income 51.2% (46.7%), ROE 12.9% (14.3%) [B1 p.7]."
  - lt: "**Spartus augimas:** paskolos 3,27 mlrd. EUR (+688 mln. EUR per metus), indėliai 3,52 mlrd. EUR; turtas viršijo 4 mlrd. EUR [B1 p.7, p.11; B5]."
    en: "**Fast growth:** loans EUR 3.27bn (+EUR 688m year on year), deposits EUR 3.52bn; total assets passed EUR 4bn [B1 p.7, p.11; B5]."
  - lt: "**Kapitalas:** CET1 13,2 %, bendras kapitalas 19,2 %, sverto rodiklis 8,5 %; LCR 225,8 % [B1 p.7, p.10]."
    en: "**Capital:** CET1 13.2%, total capital 19.2%, leverage 8.5%; LCR 225.8% [B1 p.7, p.10]."
  - lt: "**Kokybė gerėja:** 3 etapo paskolos 100 mln. EUR – 3,0 % (2025 m. pab. 4,3 %) [B1 p.5; B2 p.15]."
    en: "**Quality improving:** Stage 3 loans EUR 100m – 3.0% (4.3% at end-2025) [B1 p.5; B2 p.15]."

