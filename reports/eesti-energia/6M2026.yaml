investor:
  - lt: "**Turima priemonė:** 7,875 % neterminuota subordinuota hibridinė obligacija, 400 mln. EUR, išleista 2024-07-15, pirmasis išpirkimo pasirinkimas 2029-07-15, kuponas kasmet; London Stock Exchange [E3]."
    en: "**Instrument held:** a 7.875% perpetual subordinated hybrid, EUR 400m, issued 2024-07-15, first call 2029-07-15, annual coupon; London Stock Exchange [E3]."
  - lt: "**Rangas:** hibridas – žemiau visų kitų skolų; Fitch jį laiko 50 % nuosavybe [E5 p.4]. Moody's skalėje subordinuota skola įvertinta B1 (ar tai šis hibridas – dokumente nenurodyta) [E4 p.11]. Kupono atidėjimo ir palūkanų perskaičiavimo sąlygos nerastos."
    en: "**Ranking:** the hybrid ranks below all other debt; Fitch treats it as 50% equity [E5 p.4]. Moody's lists junior subordinated debt at B1 (the document does not say whether this is this hybrid) [E4 p.11]. Coupon deferral and reset terms were not found."
  - lt: "**Svertas:** 4,1 karto EBITDA – aukštas; Moody's tikisi 400–450 mln. EUR EBITDA 2026–2027 m. (agentūros prognozė) [E1 p.5; E4 p.8]. Valstybė anksčiau įnešė kapitalo (2020 m. 125 mln., 2025 m. 100 mln. EUR) [E4 p.3]."
    en: "**Leverage:** 4.1x EBITDA – high; Moody's expects EUR 400-450m of EBITDA in 2026-2027 (agency forecast) [E1 p.5; E4 p.8]. The state has injected equity before (EUR 125m in 2020, EUR 100m in 2025) [E4 p.3]."
  - lt: "Išvada: padidinta rizika – didelis svertas ir subordinuota priemonė, bet stipri valstybės parama."
    en: "Conclusion: elevated risk – high leverage and a subordinated instrument, but strong state support."

