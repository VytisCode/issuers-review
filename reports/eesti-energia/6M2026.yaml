press:
  - lt: "**Vandenilis:** 2026-10-20 spauda rašė, kad Eesti Energia atsisako 24,7 mln. EUR (paramos) ir vandenilio infrastruktūra nebus statoma [N1]."
    en: "**Hydrogen:** on 2026-10-20 the press reported that Eesti Energia gives up EUR 24.7m (of support) and the hydrogen infrastructure will not be built [N1]."
  - lt: "**Narvos šildymas:** 2026-10-06 bendrovė gavo sąlyginį leidimą šildyti Narvą skalūnų alyva [N2]."
    en: "**Narva heating:** on 2026-10-06 the company received a conditional permit to heat Narva with shale oil [N2]."
market:
  - lt: "**II ketvirtis silpnesnis:** EBITDA –28 % iki 55,7 mln. EUR, grynasis rezultatas –8,6 mln. EUR; vadovybės teigimu, 2025 m. II ketv. dažnio palaikymo paslaugų rezultatą laikinai pakėlė rinkos atidarymas, dabar segmentas normalizavosi [E1 p.12]."
    en: "**Weaker Q2:** EBITDA -28% to EUR 55.7m and a net loss of EUR 8.6m; management says the Q2 2025 frequency-service result was temporarily boosted by the market opening and has since normalised [E1 p.12]."
  - lt: "**Konkurencija ir skalūnai:** Estijos mažmeninės rinkos dalis –4 p. p. iki 38 % dėl aršios konkurencijos [E1 p.14]; skalūnų elektrinių gamyba –49 % dėl žemesnių rinkos kainų ir importo [E1 p.15]."
    en: "**Competition and oil shale:** Estonian retail market share fell 4 pp to 38% on intense competition [E1 p.14]; oil-shale power output fell 49% on lower market prices and imports [E1 p.15]."
  - lt: "**Rinkos kainos II ketv.:** elektra Estijoje 59,7 EUR/MWh (–1,9 %), Lietuvoje 78,2 (+26,5 %) – Estijos kainą ribojo jungties su Latvija pralaidumas [E1 p.6]; dujos TTF 45,6 EUR/MWh (+28 %), CO2 76,5 EUR/t, Brent 96,9 USD/bbl (+45,3 %) [E1 p.8, p.9]."
    en: "**Q2 market prices:** power in Estonia EUR 59.7/MWh (-1.9%), Lithuania 78.2 (+26.5%) – the Estonia-Latvia link capped Estonian prices [E1 p.6]; TTF gas EUR 45.6/MWh (+28%), CO2 EUR 76.5/t, Brent USD 96.9/bbl (+45.3%) [E1 p.8, p.9]."
  - lt: "**Strategija 2030+:** bendrovė tikisi didesnio elektros kainų svyravimo ir siekia padengti apie du trečdalius Estijos elektros paklausos prieaugio iki 2030 m., pridėdama iki 350 MW valdomų galių [E6]."
    en: "**Strategy 2030+:** the company expects higher power-price volatility and aims to cover about two-thirds of Estonia's extra power demand by 2030, adding up to 350 MW of dispatchable capacity [E6]."
