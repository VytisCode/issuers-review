  - lt: "Sąnaudų / pajamų santykis 50,3 % (47,1 %), rizikos kaina 0,3 %, trečios stadijos paskolos 1,9 % (2,1 %) [C1 p.2, p.4]."
    en: "Cost/income 50.3% (47.1%), cost of risk 0.3%, stage 3 loans 1.9% (2.1%) [C1 p.2, p.4]."
