press:
  - lt: "**Obligacijos:** 2026-09-29 Citadele išplatino 50 mln. EUR obligacijų emisiją; paklausa viršijo pasiūlą 1,35 karto [N1; N2]."
    en: "**Bonds:** on 2026-09-29 Citadele placed a EUR 50m bond issue, oversubscribed 1.35 times [N1; N2]."
  - lt: "**Klientų saugumas:** spalį bankas įspėjo apie naujas sukčių veiklas (apsimetama banko darbuotojais) – tai įspėjimai klientams, ne pažeidimai [N3]."
    en: "**Customer safety:** in October the bank warned of new fraud schemes (impersonating bank staff) – customer warnings, not breaches [N3]."
