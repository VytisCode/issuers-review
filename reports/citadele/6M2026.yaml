investor:
  - lt: "**Turimos priemonės:** 3,875 % pirmaeilė privilegijuota (MREL) obligacija – 300 mln. EUR, fiksuota iki 2028-12-23, po to 3M EURIBOR + 1,70 %, išpirkimas 2029-12-23, reitingas Baa2; ir AT1 7,125 % neterminuota – 50 mln. EUR, pirmoji perskaičiavimo (pirkimo) data 2031-01-09, reitingas Ba3 [C3]."
    en: "**Instruments held:** a 3.875% senior preferred (MREL) bond, EUR 300m, fixed until 2028-12-23 then 3M EURIBOR + 1.70%, maturing 2029-12-23, rated Baa2; and a 7.125% perpetual AT1, EUR 50m, first reset (call) date 2031-01-09, rated Ba3 [C3]."
  - lt: "**AT1 turėtojams:** CET1 17,8 % gerokai viršija reikalavimus, o atsargi dividendų politika stiprina kapitalą [C1 p.2, p.5]."
    en: "**For AT1 holders:** CET1 of 17.8% is well above requirements, and the cautious dividend policy supports capital [C1 p.2, p.5]."
  - lt: "**Savininkai:** Ripplewood konsorciumas 69,8 %, ERPB 27,8 % [C1 p.11]. 2026-10-12 vyko neeilinis akcininkų susirinkimas [C3]."
    en: "**Owners:** Ripplewood consortium 69.8%, EBRD 27.8% [C1 p.11]. An extraordinary shareholders' meeting was held on 2026-10-12 [C3]."
  - lt: "Išvada: pelningumas geras, kapitalas stiprus, finansavimas pigus. 9M rezultatai – 2026-11-04."
    en: "Conclusion: good profitability, strong capital and cheap funding. 9M results due on 2026-11-04."

