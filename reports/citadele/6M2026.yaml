quick_summary:
  - lt: "**Pelnas šiek tiek mažesnis:** I pusm. grynasis pelnas (tęsiama veikla) 39,8 mln. EUR, prieš metus 43,3 mln.; ROE 13,7 % (15,4 %). Palūkanų pajamos stabilios – 89,5 mln. EUR [C1 p.2]."
    en: "**Profit slightly lower:** 1H net profit (continuing operations) EUR 39.8m versus 43.3m; ROE 13.7% (15.4%). Net interest income stable at EUR 89.5m [C1 p.2]."
  - lt: "**Kapitalas ir likvidumas – su atsarga:** CET1 17,8 %, bendras kapitalas 21,6 %, LCR 163 %, NSFR 138 % [C1 p.2, p.7]."
    en: "**Capital and liquidity with headroom:** CET1 17.8%, total capital 21.6%, LCR 163%, NSFR 138% [C1 p.2, p.7]."
  - lt: "**Atsargūs dividendai:** už 2025 m. išmokėta 25,7 mln. EUR (31,5 % pelno, planuota 50 %) dėl geopolitinio neapibrėžtumo; 2026 m. sausį baigtas 50 mln. EUR akcijų supirkimas [C1 p.5]."
    en: "**Cautious dividends:** EUR 25.7m paid for 2025 (31.5% payout versus a 50% policy) due to geopolitical uncertainty; a EUR 50m share buyback was completed in January 2026 [C1 p.5]."
  - lt: "**Vadovų pokyčiai:** iš valdybos išėjo S. Mizak (2026-03) ir rizikos vadovė J. Lebedinska-Ļitvinova (2026-05); naujuoju rizikos vadovu siūlomas E. Näsäkkälä [C1 p.5, p.11]."
    en: "**Management changes:** S. Mizak left the board (March 2026) and CRO J. Lebedinska-Ļitvinova stepped down (May 2026); E. Näsäkkälä is nominated as the new CRO [C1 p.5, p.11]."

