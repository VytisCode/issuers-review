    en: "FY2025 profit (continuing operations) EUR 84.7m (2024: 94.5m), ROE 14.6% (17.5%); the Swiss Kaleido Privatbank was sold in 2025 [C2 p.2, p.5-7]."
  - lt: "2026-09-28 išleista 50 mln. EUR pirmaeilių obligacijų (5,15 %); dalis lėšų skirta 40 mln. EUR subordinuotoms obligacijoms supirkti [C5]."
    en: "On 2026-09-28 EUR 50m of senior preferred bonds (5.15%) were issued; part of the proceeds will buy back EUR 40m of subordinated bonds [C5]."

