        lt: Uosto operatorius, keltų paslaugos, ledlaužis, nekilnojamasis turtas – ginklų, tabako, lošimų, anglies ar naftos žvalgybos veiklos nėra [P1]. Krauna skystus krovinius (naftos produktus), jų kiekis mažėja (−33,8 % per 6 mėn.) [P1].
        en: Port operator, ferry services, icebreaker, real estate - no weapons, tobacco, gambling, coal or oil exploration [P1]. Handles liquid bulk (oil products), volumes declining (−33.8% in 6M) [P1].
