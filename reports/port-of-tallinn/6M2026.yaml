      status: 'yes'
      evidence:
        lt: Su JT Pasauliniu susitarimu ar OECD gairėmis susijusių ginčų nėra. 2015 m. kyšininkavimo byla susijusi su buvusiais vadovais; bendrovė joje – nukentėjusioji, ne kaltinamoji [E1; E2].
