investor:
  - lt: "Turima priemonė: akcijos (TSM1T, Nasdaq Tallinn). Obligacijų nėra; skolinimasis – paskolos (173,4 mln. EUR, iš jų 93,1 mln. trumpalaikės) [P1]."
    en: "Instrument held: shares (TSM1T, Nasdaq Tallinn). No bonds; borrowing is via loans (EUR 173.4m, of which 93.1m current) [P1]."
    lv: "Turētais instruments: akcijas (TSM1T, Nasdaq Tallinn). Obligāciju nav; aizņēmumi – kredīti (173,4 milj. EUR, no tiem 93,1 milj. īstermiņa) [P1]."
    et: "Hoitav instrument: aktsiad (TSM1T, Nasdaq Tallinn). Võlakirju ei ole; laenukohustused 173,4 mln eurot, sh lühiajalised 93,1 mln [P1]."
  - lt: "Dividendų bazė: dividendai skaičiuojami nuo praėjusių metų pelno; 6 mėn. pelnas 6,0 mln. EUR (10,3 mln.) – jei tendencija tęsis, 2027 m. dividendų bazė bus mažesnė [P1; P2]."
    en: "Dividend base: dividends are based on prior-year profit; 6M profit EUR 6.0m (10.3m) - if the trend continues, the base for the 2027 dividend will be lower [P1; P2]."
    lv: "Dividenžu bāze: dividendes rēķina no iepriekšējā gada peļņas; 6 mēn. peļņa 6,0 milj. EUR (10,3 milj.) – ja tendence turpināsies, 2027. g. dividenžu bāze būs mazāka [P1; P2]."
    et: "Dividendibaas: dividend arvutatakse eelmise aasta kasumist; 6 kuu kasum 6,0 mln eurot (10,3 mln) – trendi jätkudes on 2027. aasta dividendi baas väiksem [P1; P2]."
  - lt: "93,1 mln. EUR paskolų – trumpalaikės: stebėti refinansavimą [P1]."
    en: "EUR 93.1m of loans are current: watch refinancing [P1]."
    lv: "93,1 milj. EUR kredītu – īstermiņa: sekot refinansēšanai [P1]."
    et: "93,1 mln eurot laene on lühiajalised: jälgida refinantseerimist [P1]."
  - lt: "Išvada: balansas tvirtas, skola stabili, tačiau 2026 m. pelningumas mažėja dėl kuro ir remonto sąnaudų bei mažesnių skystų krovinių. Stebėti: 9 mėn. ataskaitą, keltų paslaugų sutartį, teismo bylos baigtį."
    en: "Conclusion: strong balance sheet and stable debt, but 2026 profitability is declining due to fuel and repair costs and lower liquid bulk. Watch: 9M report, the ferry service contract, the outcome of the court case."
    lv: "Secinājums: bilance stabila, parāds stabils, taču 2026. g. rentabilitāte samazinās degvielas un remonta izmaksu un mazāku šķidro kravu dēļ. Sekot: 9 mēn. pārskatam, prāmju pakalpojumu līgumam, tiesas lietas iznākumam."
    et: "Järeldus: bilanss on tugev ja võlg stabiilne, kuid 2026. aasta kasumlikkus väheneb kütuse- ja remondikulude ning väiksema vedellasti tõttu. Jälgida: 9 kuu aruanne, parvlaevateenuse leping, kohtuasja tulemus."

