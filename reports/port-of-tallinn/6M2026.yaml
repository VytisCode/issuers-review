      status: review
      evidence:
        lt: "**Taikoma:** SEB investicijų politika [SP1 p.5] ir laivybos politika, nes keltų segmentas sudaro 31,4 % 6 mėn. 2026 m. pajamų, daugiau nei 15 % riba (apskaičiuota įrankio) [P1 p.9; SP2 p.5]. Transporto politika netaikoma (tik kelių, geležinkelių ir oro transportas) [SP7 p.4]. **Atitinka:** bendrovės valdymo ar tarptautinių normų pažeidimų nerasta (buvusių vadovų byloje ji – nukentėjusioji) [E1]; kasmetinė tvarumo ataskaita su klimato duomenimis [P6]; klimato neutralumas iki 2050 m. ir planas keltus perkelti prie alternatyvių kuro rūšių ar elektros – atitinka dekarbonizacijos plano lūkestį [P6 p.18-19; SP2 p.7]. **Viešose ataskaitose nerasta:** laivybos reikalavimų – SEEMP, EEXI/CII atitikties, laivų emisijų intensyvumo atskleidimo, atsakingo laivų perdirbimo, klasifikacijos [SP2 p.5-6]; žmogaus teisių patikros, pranešėjų kanalo ir antikorupcijos politikos [SP2 p.7; SP4 p.8]. **Neaišku:** skystų krovinių (naftos produktų) aptarnavimas – jei su iškastiniu kuru susijusios pajamos viršija 5 %, taikoma ir iškastinio kuro politika [P1 p.6; SP5 p.6]. Analitikas tikrina TS Laevad laivų dokumentus."
        en: "**Applicable:** the SEB Investments policy [SP1 p.5] and the Shipping policy, because the ferry segment is 31.4% of 6M 2026 revenue, above the 15% threshold (calculated by the tool) [P1 p.9; SP2 p.5]. The Transportation policy does not apply (road, rail and air only) [SP7 p.4]. **Met:** no governance or international-norm breach by the company found (it is the injured party in the former executives' case) [E1]; annual sustainability report with climate data [P6]; climate neutrality by 2050 and a plan to move ferries to alternative fuels or electrification, in line with the decarbonisation-plan expectation [P6 p.18-19; SP2 p.7]. **Not found in public reports:** Shipping requirements such as SEEMP, EEXI/CII compliance, vessel emission-intensity disclosure, responsible ship recycling and classification [SP2 p.5-6]; human rights due diligence, whistleblowing channel and anti-corruption policy expected by SEB [SP2 p.7; SP4 p.8]. **Open:** liquid bulk (oil products) handling; if fossil-related revenue is above 5%, the Fossil Fuels policy also applies [P1 p.6; SP5 p.6]. Analyst to check TS Laevad vessel documents."
    engagement:
      status: review
      evidence:
        lt: "Siūlomi klausimai: keltų kuro emisijos ir sąnaudos, kelias iki −55 % 2030 m., antikorupcijos priemonės po bylos."
        en: "Suggested topics: ferry fuel emissions and costs, pathway to −55% by 2030, anti-corruption controls after the case."
    indicators:
      status: review
      evidence:
        lt: "Turimi PAI duomenys: 1+2 apimties emisijos 19 261 t CO2e (2025) [P6 p.22]. Palyginti su fondo tikslais – analitikas."
        en: "Available PAI data: Scope 1+2 emissions 19,261 t CO2e (2025) [P6 p.22]. Comparison with the Fund's targets - analyst."
