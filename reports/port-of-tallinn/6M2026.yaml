quick_summary:
  - lt: "6 mėn. pajamos 59,3 mln. EUR (+2,4 %), koreguota EBITDA 25,8 mln. EUR (−13,5 %), marža 43,5 % (51,5 %), grynasis pelnas 6,0 mln. EUR (−41,7 %) [P1 p.4; P2]."
    en: "6M revenue EUR 59.3m (+2.4%), adjusted EBITDA EUR 25.8m (−13.5%), margin 43.5% (51.5%), net profit EUR 6.0m (−41.7%) [P1 p.4; P2]."
    lv: "6 mēn. ieņēmumi 59,3 milj. EUR (+2,4 %), koriģētā EBITDA 25,8 milj. EUR (−13,5 %), marža 43,5 % (51,5 %), tīrā peļņa 6,0 milj. EUR (−41,7 %) [P1 p.4; P2]."
    et: "6 kuu müügitulu 59,3 mln eurot (+2,4%), korrigeeritud EBITDA 25,8 mln eurot (−13,5%), marginaal 43,5% (51,5%), puhaskasum 6,0 mln eurot (−41,7%) [P1 p.4; P2]."
  - lt: "Vadovo teigimu, pelningumą II ketv. sumažino kylančios kuro kainos ir neplanuoti laivų remontai po ledo sąlygų [P2]."
    en: "According to the CEO, rising fuel prices and extraordinary ship repairs caused by ice conditions reduced Q2 profitability [P2]."
    lv: "Pēc valdes priekšsēdētāja teiktā, 2. cet. rentabilitāti samazināja augošas degvielas cenas un ledus apstākļu izraisīti ārkārtas kuģu remonti [P2]."
    et: "Juhatuse esimehe sõnul vähendasid II kv kasumlikkust kütusehindade tõus ja jääoludest tingitud erakorralised laevaremondid [P2]."
  - lt: "Skola stabili: grynoji skola 145,8 mln. EUR, grynoji skola / 12 mėn. koreguota EBITDA 2,78x, nuosavo kapitalo dalis 59,8 % (abu rodikliai apskaičiuoti įrankio) [P1]."
    en: "Debt stable: net debt EUR 145.8m, net debt / LTM adjusted EBITDA 2.78x, equity ratio 59.8% (both ratios calculated by the tool) [P1]."
    lv: "Parāds stabils: neto parāds 145,8 milj. EUR, neto parāds / 12 mēn. koriģētā EBITDA 2,78x, pašu kapitāla īpatsvars 59,8 % (abus rādītājus aprēķinājis rīks) [P1]."
    et: "Võlg stabiilne: netovõlg 145,8 mln eurot, netovõlg / 12 kuu korrigeeritud EBITDA 2,78x, omakapitali määr 59,8% (mõlemad suhtarvud arvutas tööriist) [P1]."
  - lt: "Dividendai 0,073 EUR akcijai, iš viso 19,2 mln. EUR – 85 % 2025 m. pelno (politika – ne mažiau 70 %); išmokėta 2026-05-20 [P1 p.14-15]."
    en: "Dividend EUR 0.073 per share, EUR 19.2m in total - 85% of 2025 profit (policy: at least 70%); paid 2026-05-20 [P1 p.14-15]."
    lv: "Dividende 0,073 EUR uz akciju, kopā 19,2 milj. EUR – 85 % no 2025. g. peļņas (politika – vismaz 70 %); izmaksāta 2026-05-20 [P1 p.14-15]."
    et: "Dividend 0,073 eurot aktsia kohta, kokku 19,2 mln eurot – 85% 2025. aasta kasumist (poliitika: vähemalt 70%); makstud 20.05.2026 [P1 p.14-15]."
  - lt: "Estijos valstybė valdo 67,03 % [P1 p.13]. Buvusių vadovų kyšininkavimo byla: 2024-06-27 teismas išteisino dėl senaties; prokuratūra ir gynyba apskundė, vėlesnis sprendimas nerastas – reikia peržiūrėti [E1; E2]."
    en: "The Republic of Estonia holds 67.03% [P1 p.13]. Former executives' bribery case: on 2024-06-27 the court acquitted on limitation grounds; prosecution and defence appealed, later ruling not found - needs review [E1; E2]."
    lv: "Igaunijas valstij pieder 67,03 % [P1 p.13]. Bijušo vadītāju kukuļošanas lieta: 2024-06-27 tiesa attaisnoja noilguma dēļ; prokuratūra un aizstāvība pārsūdzēja, vēlāks lēmums nav atrasts – jāpārskata [E1; E2]."
    et: "Eesti Vabariigile kuulub 67,03% [P1 p.13]. Endiste juhtide altkäemaksukaasus: 27.06.2024 mõistis kohus aegumise tõttu õigeks; prokuratuur ja kaitse kaebasid edasi, hilisemat otsust ei leitud – vajab ülevaatust [E1; E2]."

business:
  - lt: "Kroviniai 6,48 mln. t (−5,0 %), daugiausia dėl skystų krovinių (−33,8 %); keleiviai 3,59 mln. (−2,0 %); laivų įplaukimai −4,8 % [P1 p.4]."
    en: "Cargo 6.48m t (−5.0%), mainly liquid bulk (−33.8%); passengers 3.59m (−2.0%); vessel calls −4.8% [P1 p.4]."
    lv: "Kravas 6,48 milj. t (−5,0 %), galvenokārt šķidrās beramkravas (−33,8 %); pasažieri 3,59 milj. (−2,0 %); kuģu ienākšanas −4,8 % [P1 p.4]."
    et: "Kaubamaht 6,48 mln t (−5,0%), peamiselt vedellasti tõttu (−33,8%); reisijaid 3,59 mln (−2,0%); laevakülastused −4,8% [P1 p.4]."
  - lt: "Kruizų keleiviai +47,8 %, kruizinių laivų įplaukimai +29,3 % (6 mėn.) [P1]."
    en: "Cruise passengers +47.8%, cruise ship calls +29.3% (6M) [P1]."
    lv: "Kruīzu pasažieri +47,8 %, kruīza kuģu ienākšanas +29,3 % (6 mēn.) [P1]."
    et: "Kruiisireisijad +47,8%, kruiisilaevade külastused +29,3% (6 kuud) [P1]."
  - lt: "Keltai (Saaremaa, Hiiumaa): II ketv. reisai +1,2 %, keleiviai +1,8 %; vasarai sutarta dėl papildomų kelto „Regula“ reisų [P1 – patikrinti]. Ledlaužio „Botnica“ frachtas 130 d. (110 d.) [P1]."
    en: "Ferries (Saaremaa, Hiiumaa): Q2 trips +1.2%, passengers +1.8%; additional trips of ferry Regula agreed for summer [P1 - verify]. Icebreaker Botnica charter 130 days (110) [P1]."
    lv: "Prāmji (Sāremā, Hījumā): 2. cet. reisi +1,2 %, pasažieri +1,8 %; vasarai saskaņoti papildu prāmja „Regula“ reisi [P1 – pārbaudīt]. Ledlauža „Botnica“ frakts 130 d. (110 d.) [P1]."
    et: "Parvlaevad (Saaremaa, Hiiumaa): II kv reisid +1,2%, reisijad +1,8%; suveks lepiti kokku parvlaeva Regula lisareisid [P1 – kontrollida]. Jäämurdja Botnica prahtimine 130 päeva (110) [P1]."
  - lt: "Segmentai (6 mėn., pajamos / koreg. EBITDA, mln. EUR): keleivių uostai 18,9 / 9,6; krovinių uostai 15,8 / 7,3; keltai 18,6 / 5,9; kita 5,9 / 3,1 [P1 p.9]."
    en: "Segments (6M, revenue / adj. EBITDA, EURm): passenger harbours 18.9 / 9.6; cargo harbours 15.8 / 7.3; ferry 18.6 / 5.9; other 5.9 / 3.1 [P1 p.9]."
    lv: "Segmenti (6 mēn., ieņēmumi / koriģ. EBITDA, milj. EUR): pasažieru ostas 18,9 / 9,6; kravu ostas 15,8 / 7,3; prāmji 18,6 / 5,9; citi 5,9 / 3,1 [P1 p.9]."
    et: "Segmendid (6 kuud, müügitulu / korr. EBITDA, mln eurot): reisisadamad 18,9 / 9,6; kaubasadamad 15,8 / 7,3; parvlaevad 18,6 / 5,9; muu 5,9 / 3,1 [P1 p.9]."
  - lt: "Rizikos pagal ataskaitą: karas Ukrainoje mažina skystų krovinių srautus; JAV–Irano konfliktas ir Hormūzo sąsiaurio blokada didina kuro kainas [P1]."
    en: "Risks per the report: the war in Ukraine reduces liquid bulk volumes; the US-Iran conflict and Strait of Hormuz blockade raise fuel costs [P1]."
    lv: "Riski pēc pārskata: karš Ukrainā samazina šķidro kravu apjomus; ASV–Irānas konflikts un Hormuza šauruma blokāde palielina degvielas izmaksas [P1]."
    et: "Riskid aruande järgi: sõda Ukrainas vähendab vedellasti mahtu; USA–Iraani konflikt ja Hormuzi väina blokaad tõstavad kütusekulusid [P1]."

financials:
  - lt: "2025 m.: pajamos 118,7 mln. EUR (−0,8 %), koreguota EBITDA 56,5 mln. EUR (+6,4 %), grynasis pelnas 22,5 mln. EUR (+17,3 %), investicijos 33,2 mln. EUR, laisvieji pinigų srautai 50,9 mln. EUR [P3]."
    en: "FY2025: revenue EUR 118.7m (−0.8%), adjusted EBITDA EUR 56.5m (+6.4%), net profit EUR 22.5m (+17.3%), investments EUR 33.2m, free cash flow EUR 50.9m [P3]."
    lv: "2025. g.: ieņēmumi 118,7 milj. EUR (−0,8 %), koriģētā EBITDA 56,5 milj. EUR (+6,4 %), tīrā peļņa 22,5 milj. EUR (+17,3 %), investīcijas 33,2 milj. EUR, brīvā naudas plūsma 50,9 milj. EUR [P3]."
    et: "2025: müügitulu 118,7 mln eurot (−0,8%), korrigeeritud EBITDA 56,5 mln eurot (+6,4%), puhaskasum 22,5 mln eurot (+17,3%), investeeringud 33,2 mln eurot, vaba rahavoog 50,9 mln eurot [P3]."
  - lt: "6 mėn. investicijos 3,5 mln. EUR (12,0 mln.). 2025 m. palyginimui įtakos turėjo vienkartinis 0,9 mln. EUR pelnas iš žemės pardavimo Rail Baltica stočiai [P1]."
    en: "6M investments EUR 3.5m (12.0m). The 2025 comparison includes a one-off EUR 0.9m gain on the land sale for the Rail Baltica station [P1]."
    lv: "6 mēn. investīcijas 3,5 milj. EUR (12,0 milj.). 2025. g. salīdzinājumu ietekmē vienreizēja 0,9 milj. EUR peļņa no zemes pārdošanas Rail Baltica stacijai [P1]."
    et: "6 kuu investeeringud 3,5 mln eurot (12,0 mln). 2025. aasta võrdlust mõjutab ühekordne 0,9 mln euro kasum maa müügist Rail Balticu jaamale [P1]."

