investor:
  - lt: "**Turima priemonė:** 4,750 % neužtikrintos obligacijos, 350 mln. EUR, išleistos 2026-05-19, išpirkimas 2031-05-19, kuponas kasmet; Nasdaq Vilnius ir Euronext Dublin; S&P BB+ [M5; M4; M1 p.8]."
    en: "**Instrument held:** 4.750% unsecured notes, EUR 350m, issued 2026-05-19, maturing 2031-05-19, annual coupon; Nasdaq Vilnius and Euronext Dublin; S&P BB+ [M5; M4; M1 p.8]."
  - lt: "**Svertas:** grynoji skola / EBITDA 2,0 karto – vidutinis lygis; pinigų atsargos 256 mln. EUR [M3; M1 p.3]. Kitų obligacijų nėra – 2022 m. 6,25 % obligacijos išpirktos anksčiau laiko 2025-10-27 [M2 p.4-5]."
    en: "**Leverage:** net debt / EBITDA 2.0x – moderate; cash of EUR 256m [M3; M1 p.3]. No other bonds – the 2022 6.25% bonds were redeemed early on 2025-10-27 [M2 p.4-5]."
  - lt: "**Rizika:** didelės išmokos akcininkui mažina kapitalo atsargą; dividendų politika nerasta. Išankstinio išpirkimo sąlygos ir kovenantai ataskaitose nerasti."
    en: "**Risk:** large payouts to the shareholder reduce the capital buffer; no dividend policy found. Call terms and covenants were not found in the reports."
  - lt: "Išvada: vidutinė rizika – stabilus verslas ir BB+ reitingas, bet akcininkas ima daug lėšų."
    en: "Conclusion: moderate risk – stable business and a BB+ rating, but the shareholder takes out a lot of cash."

