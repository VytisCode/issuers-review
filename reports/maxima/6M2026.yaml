quick_summary:
  - lt: "**Pajamos auga, pelningumas stabilus:** I pusm. pajamos 2 026 mln. EUR (+2,8 %, apskaičiuota įrankio), EBITDA 169,9 mln. EUR (169,2 mln.), grynasis pelnas 85,7 mln. EUR [M1 p.3, p.7]."
    en: "**Revenue up, profitability stable:** 1H revenue EUR 2,026m (+2.8%, calculated by the tool), EBITDA EUR 169.9m (169.2m), net profit EUR 85.7m [M1 p.3, p.7]."
  - lt: "**Tik Baltijos šalys:** Lenkijos ir Bulgarijos verslai parduoti 2025-12; liko 498 parduotuvės Lietuvoje, Latvijoje ir Estijoje bei Barbora [M2 p.5-6]."
    en: "**Baltics only:** the Polish and Bulgarian businesses were sold in December 2025; 498 stores in Lithuania, Latvia and Estonia plus Barbora remain [M2 p.5-6]."
  - lt: "**Daug išmokų akcininkui:** 2025 m. dividendai 423,9 mln. EUR, 2026 m. I pusm. – 101,0 mln. EUR dividendų ir 100 mln. EUR kapitalo mažinimas; nuosavas kapitalas sumažėjo nuo 572,9 iki 147,4 mln. EUR [M1 p.3-4, p.9]."
    en: "**Large payouts to the shareholder:** EUR 423.9m of dividends in 2025, and in 1H 2026 EUR 101.0m of dividends plus a EUR 100m capital reduction; equity fell from EUR 572.9m to EUR 147.4m [M1 p.3-4, p.9]."
  - lt: "**Skola didesnė:** grynoji skola (su nuoma) 764,5 mln. EUR, 2,0 karto EBITDA (2025 m. pab. – 557,1 mln., 1,5 karto) [M3; M2 p.8]."
    en: "**Higher debt:** net debt (incl. leases) EUR 764.5m, 2.0x EBITDA (end-2025: EUR 557.1m, 1.5x) [M3; M2 p.8]."

business:
  - lt: "Strategija – kainų lyderystė Baltijos šalyse: I pusm. sumažintos 9 000 prekių kainos Lietuvoje ir 4 000 Latvijoje; iki 2030 m. planuojama atidaryti ar išplėsti daugiau nei 80 parduotuvių [M2 p.10; M3]."
    en: "Strategy is price leadership in the Baltics: 1H price cuts on 9,000 products in Lithuania and 4,000 in Latvia; more than 80 stores to be opened or expanded by 2030 [M2 p.10; M3]."
  - lt: "2026-05-31 įsigyta Latvijos nekilnojamojo turto bendrovė Irbis A (16,9 mln. EUR); 2026-08-31 parduota SOLLO [M1 p.9-10]."
    en: "Latvian property company Irbis A was bought on 2026-05-31 (EUR 16.9m); SOLLO was sold on 2026-08-31 [M1 p.9-10]."

financials:
  - lt: "2025 m. (tęsiama veikla) pajamos 4 070 mln. EUR, EBITDA 375 mln. EUR, marža 9,2 % [M2 p.7]."
    en: "FY2025 (continuing operations) revenue EUR 4,070m, EBITDA EUR 375m, margin 9.2% [M2 p.7]."
  - lt: "Pinigai 2026-06-30 – 256,3 mln. EUR; banko paskolos 259,3 mln. EUR (SEB ir ING tiltinė paskola 260 mln. EUR, dar 40 mln. EUR Swedbank ir 40 mln. EUR SEB) [M1 p.3, p.8; M2 p.5-6]."
    en: "Cash EUR 256.3m at 2026-06-30; bank loans EUR 259.3m (EUR 260m SEB/ING bridge loan, plus EUR 40m Swedbank and EUR 40m SEB) [M1 p.3, p.8; M2 p.5-6]."

