quick_summary:
  - lt: "**Pelnas auga:** I pusm. pajamos 941,8 mln. EUR (+11 %), EBITDA 284,6 mln. EUR (+5 %), grynasis pelnas 144,6 mln. EUR (135,3 mln.) [V1 p.12, p.15]."
    en: "**Profit up:** 1H revenue EUR 941.8m (+11%), EBITDA EUR 284.6m (+5%), net profit EUR 144.6m (135.3m) [V1 p.12, p.15]."
  - lt: "**Daugiau gamybos:** pagaminta 3 336 GWh elektros, prieš metus 2 603 GWh. 2025 m. 66 % elektros pagaminta iš atsinaujinančių šaltinių [V1 p.12; V2 p.9]."
    en: "**More generation:** 3,336 GWh of electricity produced versus 2,603 GWh a year ago. In 2025, 66% of electricity came from renewable sources [V1 p.12; V2 p.9]."
  - lt: "**Skola auga dėl investicijų:** grynoji skola 1 372,1 mln. EUR (843,1 mln.), grynoji skola / EBITDA 2,4x (1,5x). Investicijos per pusmetį 255,5 mln. EUR, 2025 m. – rekordinės 792,1 mln. EUR [V1 p.12; V2 p.8]."
    en: "**Debt rising with investment:** net debt EUR 1,372.1m (843.1m), net debt / EBITDA 2.4x (1.5x). Investments EUR 255.5m in the half year and a record EUR 792.1m in 2025 [V1 p.12; V2 p.8]."
  - lt: "**Finansavimas pigus:** 2026 m. birželį išleista 300 mln. EUR 7 metų žaliųjų obligacijų, pajamingumas 1,3 % [V1 p.5]."
    en: "**Cheap funding:** in June 2026 EUR 300m of 7-year green bonds were issued at a 1.3% yield [V1 p.5]."

business:
  - lt: "Atsinaujinančios energetikos plėtra: birželio pabaigoje įrengta 937 MW vėjo ir saulės jėgainių, patvirtintas 1 144 MW projektų portfelis; strategijos tikslas – 600 MW iki 2026 m., 2 300 MW iki 2030 m. [V1 p.3, p.8-9]."
    en: "Renewables build-out: 937 MW of wind and solar installed at end-June, with an approved 1,144 MW project portfolio; strategy target 600 MW by 2026 and 2,300 MW by 2030 [V1 p.3, p.8-9]."
  - lt: "Gamybos struktūra 2025 m.: hidroelektrinės 2 882 GWh (61 %), dujomis kūrenamos Rygos termofikacinės elektrinės 1 587 GWh (34 %), vėjo ir saulės jėgainės 209 GWh (dalys apskaičiuotos įrankio) [V2 p.12-13]."
    en: "2025 generation mix: hydro 2,882 GWh (61%), gas-fired Riga CHPs 1,587 GWh (34%), wind and solar 209 GWh (shares calculated by the tool) [V2 p.12-13]."
  - lt: "2026-08-22 stipri audra sukėlė plačius elektros tiekimo sutrikimus [V1 p.5]."
    en: "A severe storm on 2026-08-22 caused widespread power outages [V1 p.5]."

financials:
  - lt: "2025 m. pajamos 1 566,1 mln. EUR (2024 m. – 1 703,6 mln.), pelnas 198,8 mln. EUR (273,7 mln., −74,8 mln.); FFO / grynoji skola 39 % [V2 p.8, p.24]."
    en: "FY2025 revenue EUR 1,566.1m (2024: 1,703.6m), profit EUR 198.8m (273.7m, −74.8m); FFO / net debt 39% [V2 p.8, p.24]."
  - lt: "Nuosavas kapitalas 3 035,9 mln. EUR, turtas 5 259,6 mln. EUR – nuosavo kapitalo dalis 57,7 % (apskaičiuota įrankio); ROE 6,9 % (5,2 %) [V1 p.12]."
    en: "Equity EUR 3,035.9m, total assets EUR 5,259.6m, an equity ratio of 57.7% (calculated by the tool); ROE 6.9% (5.2%) [V1 p.12]."
  - lt: "Dividendai valstybei: 2026-05-27 patvirtinta 141,0 mln. EUR iš 2025 m. pelno, dviem dalimis po 70,5 mln. EUR (birželį ir iki lapkričio 30 d.) [V1 p.14]."
    en: "Dividends to the state: EUR 141.0m from 2025 profit approved on 2026-05-27, paid in two EUR 70.5m instalments (June and by 30 November) [V1 p.14]."

