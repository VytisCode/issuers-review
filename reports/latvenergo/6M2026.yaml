investor:
  - lt: "**Turimos priemonės:** keturios žaliosios obligacijos – 2,42 % 2027 (100 mln. EUR), 0,5 % 2028 (50 mln. EUR), 4,952 % 2029 (50 mln. EUR) ir 3,612 % 2030 (400 mln. EUR) [V3; V4; V5; V6]. Moody's žaliosioms obligacijoms suteikė Baa2 reitingą [V2]."
    en: "**Instruments held:** four green bonds, 2.42% 2027 (EUR 100m), 0.5% 2028 (EUR 50m), 4.952% 2029 (EUR 50m) and 3.612% 2030 (EUR 400m) [V3; V4; V5; V6]. Moody's rates the green bonds Baa2 [V2]."
  - lt: "**Artimiausias išpirkimas:** 2,42 % obligacija – 2027-05-05. Bendrovė pinigų turi: 2026 m. birželį pasiskolinta 300 mln. EUR už 1,3 % [V4; V1 p.5]."
    en: "**Next maturity:** the 2.42% bond on 2027-05-05. The company has funding: it borrowed EUR 300m at 1.3% in June 2026 [V4; V1 p.5]."
  - lt: "**Valstybės nuosavybė (100 %)** ir dividendų politika (>64 % pelno) reiškia, kad dalis pinigų išeina valstybei, tačiau reitingo tikslas (≥ Baa3) apriboja skolinimąsi [V1 p.7-8]."
    en: "**State ownership (100%)** and the dividend policy (>64% payout) mean part of the cash goes to the state, but the rating target (≥ Baa3) caps borrowing [V1 p.7-8]."
  - lt: "Išvada: verslas pelningas, skolinimasis didėja pagal planą, kredito rodikliai – virš strategijos ribų."
    en: "Conclusion: the business is profitable, borrowing is growing as planned and credit metrics are above the strategy limits."

