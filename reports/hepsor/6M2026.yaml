quick_summary:
  - lt: "**Nuostolis dėl ciklo:** I pusm. pajamos 6,2 mln. EUR (22,1 mln.), EBITDA −0,9 mln. EUR, grynasis nuostolis 2,2 mln. EUR (pelnas 0,3 mln.); pajamos pripažįstamos tik perdavus butus [H1 p.4, p.20]."
    en: "**Loss due to the cycle:** 1H revenue EUR 6.2m (22.1m), EBITDA EUR -0.9m, net loss EUR 2.2m (profit 0.3m); revenue is recognised only on handover [H1 p.4, p.20]."
  - lt: "**Pardavimai auga:** sudaryta 129 butų pirminių sutarčių už 25,7 mln. EUR (95 ir 18,5 mln. prieš metus); statoma 513 būstų [H1 p.6; H5]."
    en: "**Sales rising:** 129 first-time home sales contracts for EUR 25.7m (95 and 18.5m a year earlier); 513 homes under construction [H1 p.6; H5]."
  - lt: "**Skola auga:** palūkanų skola 58,7 mln. EUR (2025 m. pab. 47,7 mln.); grynoji skola apie 56,2 mln. EUR (apskaičiuota įrankio); pinigai 2,5 mln. EUR [H1 p.20, p.23]."
    en: "**Debt rising:** interest-bearing loans EUR 58.7m (47.7m at end-2025); net debt about EUR 56.2m (calculated by the tool); cash EUR 2.5m [H1 p.20, p.23]."
  - lt: "**Naujos obligacijos:** 2026-09 išleista 5 mln. EUR 9,5 % obligacijų (2029), paklausa 2,4 karto didesnė [H4]."
    en: "**New bonds:** EUR 5m of 9.5% bonds (2029) issued in September 2026, 2.4x oversubscribed [H4]."

business:
