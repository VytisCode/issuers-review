    en: "Residential and commercial developer in Estonia and Latvia: 29 projects, about 195,000 sq m of sellable area, sales potential EUR 542m [H1 p.8, p.13]."
  - lt: "Artimiausi užbaigimai: Manufaktuuri 12 Taline (49 butai, perdavimai nuo III ketv., 27 parduoti), Dzelzavas 74C Rygoje (103 butai, IV ketv., 42 parduoti) [H1 p.7]."
    en: "Next completions: Manufaktuuri 12 in Tallinn (49 homes, handovers from Q3, 27 sold), Dzelzavas 74C in Riga (103 homes, Q4, 42 sold) [H1 p.7]."

