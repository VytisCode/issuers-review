market:
  - lt: "**Mažai parduotų butų:** I pusm. pajamos 6,2 mln. EUR (prieš metus 22,1 mln.) dėl mažo baigtų neparduotų butų likučio – perduoti 23 butai (102) [H1 p.6]; bendroji marža 6,7 % (13,0 %), grynasis nuostolis 2,2 mln. EUR [H1 p.21, p.22]."
    en: "**Few completed units to sell:** H1 revenue EUR 6.2m (22.1m) due to a small carry-over of completed unsold apartments – 23 homes handed over (102) [H1 p.6]; gross margin 6.7% (13.0%), net loss EUR 2.2m [H1 p.21, p.22]."
  - lt: "**Rinka:** komercinių projektų atsiperkamumą blogina augantys statybos kaštai ir brangesnis skolinimasis, o nuomos kainos nekyla; būsto paklausa stipriai auga, todėl Rygos Veidemos kvartalas perorientuojamas į būstą [H1 p.7]."
    en: "**Market:** rising construction costs and dearer borrowing with flat rents hurt commercial projects; housing demand is growing strongly, so the Veidema quarter in Riga is being switched to residential [H1 p.7]."
  - lt: "**Perspektyva:** statoma 513 butų (prieš metus 255) – pagrindas pajamų augimui ateityje; pirminiai pardavimai 129 butai už 25,7 mln. EUR [H1 p.6]."
    en: "**Outlook:** 513 homes under construction (255 a year earlier), a basis for future revenue; first-time sales of 129 homes for EUR 25.7m [H1 p.6]."
