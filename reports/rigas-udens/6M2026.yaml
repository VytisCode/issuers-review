investor:
  - lt: "**Turima priemonė:** 4 % žalioji obligacija (ES žaliųjų obligacijų standartas), 20 mln. EUR, kuponai kas ketvirtį, išpirkimas 2030-06-04 [R2 p.20-21]. Visos lėšos panaudotos ES taksonomiją atitinkantiems projektams (Sustainable Fitch patikra) [R1 p.5]."
    en: "**Instrument held:** a 4% green bond (EU Green Bond Standard), EUR 20m, quarterly coupons, maturing 2030-06-04 [R2 p.20-21]. All proceeds allocated to EU taxonomy-aligned projects (Sustainable Fitch review) [R1 p.5]."
  - lt: "**Kredito kokybė:** Moody's A3, savivaldybės nuosavybė, reguliuojami tarifai ir didelė nuosavo kapitalo dalis [R1 p.5, p.17]."
    en: "**Credit quality:** Moody's A3, municipal ownership, regulated tariffs and a high equity ratio [R1 p.5, p.17]."
  - lt: "Išvada: maža rizika; skola auga dėl investicijų, bet rodikliai gerokai viršija sutartines ribas."
    en: "Conclusion: low risk; debt is rising with investment, but metrics are well above covenant limits."

