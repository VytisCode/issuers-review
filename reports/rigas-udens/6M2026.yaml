        en: "**Applicable:** the Investments policy [SP1] and the Environmental policy on climate, nature and water [SP3]. **Met:** EU Green Bond Standard with external review [R1 p.5]; wastewater treatment within limits [R1 p.15]; material impacts disclosed [R2 p.48]."
