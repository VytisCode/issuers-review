quick_summary:
  - lt: "**Rezultatai gerėja:** I pusm. pajamos 45,4 mln. EUR (+15 %), EBITDA 19,7 mln. EUR (15,7 mln.), grynasis pelnas 4,3 mln. EUR (0,5 mln.); tarifai pakelti nuo 2025-12-01 [R1 p.18-19, p.22]."
    en: "**Results improving:** 1H revenue EUR 45.4m (+15%), EBITDA EUR 19.7m (15.7m), net profit EUR 4.3m (0.5m); tariffs raised from 2025-12-01 [R1 p.18-19, p.22]."
  - lt: "**Investicijos ir skola auga:** investicijos 24,1 mln. EUR per pusmetį, grynoji skola 89,9 mln. EUR, grynoji skola / EBITDA 2,6x (2,1x); 2025–2028 m. investicijų programa – 235 mln. EUR [R1 p.12, p.18]."
    en: "**Investment and debt rising:** EUR 24.1m invested in the half year, net debt EUR 89.9m, net debt / EBITDA 2.6x (2.1x); the 2025-2028 investment programme is EUR 235m [R1 p.12, p.18]."
  - lt: "**Skolos sąlygos vykdomos:** DSCR 3,9 (tikslas 2,0), palūkanų padengimas 14,2 [R1 p.17-18, p.34]."
    en: "**Covenants met:** DSCR 3.9 (target 2.0), interest coverage 14.2 [R1 p.17-18, p.34]."
  - lt: "**Daugiau finansavimo:** patvirtintas naujas prospektas iki 40 mln. EUR kitai obligacijų daliai (planuojama IV ketv.), pasirašyta 50 mln. EUR NIB kredito linija; reguliuotojas nuo 2027 m. padidino kapitalo grąžos normą iki 6,28 % [R1 p.5, p.43; R2 p.28]."
    en: "**More funding:** a new prospectus approved for up to EUR 40m in the next bond tranche (planned for Q4), a EUR 50m NIB facility signed; the regulator raised the allowed return on capital to 6.28% from 2027 [R1 p.5, p.43; R2 p.28]."

business:
  - lt: "Paslaugų sutartis su Rygos miestu galioja iki 2029-07-23; tarifus tvirtina Viešųjų paslaugų reguliavimo komisija (vanduo 1,41 EUR/m³, nuotekos 1,26 EUR/m³, valymas 0,40 EUR/m³ be PVM) [R1 p.10, p.22]."
    en: "The service contract with Riga City runs to 2029-07-23; tariffs are set by the Public Utilities Commission (water EUR 1.41/m³, sewerage EUR 1.26/m³, treatment EUR 0.40/m³ excl. VAT) [R1 p.10, p.22]."
  - lt: "2026-03-25 Rygos taryba nusprendė išlaikyti tiesioginę įmonės nuosavybę [R1 p.10]."
    en: "On 2026-03-25 the Riga City Council decided to keep its direct shareholding [R1 p.10]."

financials:
  - lt: "2025 m. pajamos 80,3 mln. EUR, EBITDA 31,0 mln. EUR, pelnas 0,6 mln. EUR; 2024 m. nuostolis 18,3 mln. EUR dėl turto perkainojimo [R2 p.17]."
    en: "FY2025 revenue EUR 80.3m, EBITDA EUR 31.0m, profit EUR 0.6m; the 2024 loss of EUR 18.3m was due to asset revaluation [R2 p.17]."
  - lt: "Nuosavas kapitalas 536,3 mln. EUR, turtas 755,3 mln. EUR [R1 p.18]."
    en: "Equity EUR 536.3m, total assets EUR 755.3m [R1 p.18]."

