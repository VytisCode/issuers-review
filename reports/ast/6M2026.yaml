quick_summary:
  - lt: "**Rezultatai gerėja:** I pusm. EBITDA 61,4 mln. EUR (50,2 mln.), marža 33 % (28 %); pelnas 22,5 mln. EUR (19,1 mln.) [A1 p.4]."
    en: "**Results improving:** 1H EBITDA EUR 61.4m (50.2m), margin 33% (28%); profit EUR 22.5m (19.1m) [A1 p.4]."
  - lt: "**Skola nedidelė:** grynoji skola apie 94 mln. EUR, apie 0,9 karto metinės EBITDA (apskaičiuota įrankio); nuosavo kapitalo dalis 40 % [A1 p.4]."
    en: "**Low debt:** net debt about EUR 94m, about 0.9 times annual EBITDA (calculated by the tool); equity ratio 40% [A1 p.4]."
  - lt: "**Obligacijos išpirkimas padengtas:** 2027-01 išperkamai 100 mln. EUR žaliajai obligacijai – SEB overdraftas iki 90 mln. EUR (iki 2027-03-10), 2026-06-30 nepanaudotas [A1 p.11; A2 p.14]."
    en: "**Bond redemption covered:** for the EUR 100m green bond due January 2027 there is an SEB overdraft of up to EUR 90m (to 2027-03-10), undrawn at 2026-06-30 [A1 p.11; A2 p.14]."
  - lt: "**Didelės investicijos:** 2025 m. investuota 209 mln. EUR; Plėtros planas 2027–2036 – 1 066 mln. EUR, iš jų iki 289 mln. EUR ES lėšų [A2 p.13; A1 p.11]."
    en: "**Large investments:** EUR 209m invested in 2025; the Development Plan 2027-2036 is EUR 1,066m, of which up to EUR 289m is EU co-financing [A2 p.13; A1 p.11]."

business:
  - lt: "AST valdo Latvijos 330 kV ir 110 kV perdavimo tinklą (330 kV: 17 pastočių, 1 727 km; 110 kV: 130 pastočių, 3 786 km) ir 68,46 % Conexus Baltic Grid (dujų perdavimas ir Inčukalnio saugykla) [A4 p.8, p.11]."
    en: "AST runs Latvia's 330 kV and 110 kV transmission grid (330 kV: 17 substations, 1,727 km; 110 kV: 130 substations, 3,786 km) and owns 68.46% of Conexus Baltic Grid (gas transmission and the Inčukalns storage) [A4 p.8, p.11]."
  - lt: "Baltijos šalys sinchronizuotos su kontinentine Europa 2025-02-09; balansavimo pajėgumų rinka veikia nuo 2025-02-04 [A4 p.15-16]."
    en: "The Baltics synchronised with Continental Europe on 2025-02-09; the balancing capacity market has run since 2025-02-04 [A4 p.15-16]."
  - lt: "Nuo 2026-01-01 patvirtinti nauji trejų metų tarifai, vidutinis AST tarifas mažėja 10 % [A2 p.8]."
    en: "New three-year tariffs apply from 2026-01-01, with the average AST tariff falling by 10% [A2 p.8]."

financials:
  - lt: "2025 m. pajamos 354,1 mln. EUR (258,6 mln.), EBITDA 90,8 mln. EUR (108,3 mln.), pelnas 27,5 mln. EUR (22,7 mln.) [A2 p.5]."
    en: "FY2025 revenue EUR 354.1m (258.6m), EBITDA EUR 90.8m (108.3m), profit EUR 27.5m (22.7m) [A2 p.5]."
  - lt: "2026-06-30 skolinimasis 189,0 mln. EUR, pinigai 94,7 mln. EUR; obligacijos (100,2 mln. EUR) jau trumpalaikės [A1 p.4]."
    en: "Borrowings EUR 189.0m and cash EUR 94.7m at 2026-06-30; the bonds (EUR 100.2m) are now short-term [A1 p.4]."
  - lt: "Dividendai: per I pusm. patronuojanti įmonė išmokėjo 13,6 mln. EUR [A1 p.22]."
    en: "Dividends: the parent company paid EUR 13.6m in 1H [A1 p.22]."

