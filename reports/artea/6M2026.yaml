investor:
  - lt: "**Turimos priemonės:** trys pirmaeilės privilegijuotos (senior preferred) obligacijos po 300 mln. EUR – 4,85 % 2028-12-05, 3,74 % 2029-07-10 ir 4,60 % 2030-06-25; subordinuota 10,75 % 2033 (50 mln. EUR); AT1 8,75 % (50 mln. EUR, emitento lentelėje data 2029-10-17) [A3]."
    en: "**Instruments held:** three EUR 300m senior preferred bonds, 4.85% due 2028-12-05, 3.74% due 2029-07-10 and 4.60% due 2030-06-25; a 10.75% subordinated bond due 2033 (EUR 50m); and an 8.75% AT1 (EUR 50m, date in the issuer table 2029-10-17) [A3]."
  - lt: "**Reitingas:** pirmaeilei skolai Baa1, perspektyva teigiama – tai teigiama žinia visoms turimoms obligacijoms [A1 p.7]."
    en: "**Rating:** senior debt Baa1 with a positive outlook, which is good news for all bonds held [A1 p.7]."
  - lt: "**Subordinuotoms obligacijoms ir AT1:** bendras kapitalas 21,5 % ir MREL 23,59 % – su atsarga; 2026 m. I pusm. naujų obligacijų neišleista [A1 p.6-7, p.22]."
    en: "**For subordinated bonds and AT1:** total capital of 21.5% and MREL of 23.59% have headroom; no new bonds were issued in 1H 2026 [A1 p.6-7, p.22]."
  - lt: "**Kontrolės pasikeitimas:** jei Tesonet įgis kontrolę (reikia ECB leidimo), keisis strateginis savininkas; obligacijų sąlygos dėl kontrolės pasikeitimo viešai skelbtuose šaltiniuose nerastos [A1 p.7-8]."
    en: "**Change of control:** if Tesonet gains control (ECB approval needed), the strategic owner changes; change-of-control terms of the bonds were not found in public sources [A1 p.7-8]."
  - lt: "Išvada: pelningumas mažėja, tačiau kapitalas, likvidumas ir paskolų kokybė – geri, o reitingas pagerėjo. 9M rezultatai bus paskelbti 2026-10-28."
    en: "Conclusion: profitability is declining, but capital, liquidity and loan quality are good and the rating has improved. 9M results are due on 2026-10-28."

