market:
  - lt: "**Pensijų reforma:** grynasis pelnas 23,2 mln. EUR (–27 %) dėl vienkartinio prestižo nuvertėjimo, kilusio iš pensijų reformos; dalis atsiimtų pensijų lėšų panaudota vartojimo paskoloms grąžinti [A1 p.6]."
    en: "**Pension reform:** net profit EUR 23.2m (-27%) due to a one-off goodwill impairment caused by the pension reform; part of the withdrawn pension money was used to repay consumer loans [A1 p.6]."
  - lt: "**Pagrindinė veikla auga:** grynosios palūkanų pajamos +6 % iki 72,5 mln. EUR, paskolos +8 % (>3,9 mlrd. EUR), indėliai +15 %; atidėjiniai tik 0,3 mln. EUR (rizikos kaina 0,01 %) [A1 p.6]."
    en: "**Core business growing:** net interest income +6% to EUR 72.5m, loans +8% (>EUR 3.9bn), deposits +15%; impairments only EUR 0.3m (cost of risk 0.01%) [A1 p.6]."
  - lt: "**Rizika:** didžiausią neapibrėžtumą bankas mato geopolitikos poveikyje platesnei ekonomikai [A1 p.7]."
    en: "**Risk:** the bank sees the greatest uncertainty in the impact of geopolitics on the wider economy [A1 p.7]."
