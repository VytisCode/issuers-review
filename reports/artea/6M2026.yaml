quick_summary:
  - lt: "**Pelnas mažesnis:** I pusm. grynasis pelnas 23,2 mln. EUR (prieš metus 31,9 mln.), ROE 7,8 % (11,1 %). Palūkanų pajamos išaugo 6 % iki 72,5 mln. EUR, bet sąnaudos augo greičiau: sąnaudų / pajamų santykis 56,8 % [A1 p.6-7]."
    en: "**Lower profit:** 1H net profit EUR 23.2m (31.9m a year ago), ROE 7.8% (11.1%). Net interest income rose 6% to EUR 72.5m, but costs grew faster: cost/income 56.8% [A1 p.6-7]."
  - lt: "**Paskolų kokybė gera:** rizikos kaina 0,01 % (0,24 %), trečios stadijos paskolos 2,4 % (mūsų skaičiavimas) [A1 p.6, p.24]."
    en: "**Good loan quality:** cost of risk 0.01% (0.24%), stage 3 loans 2.4% (own calculation) [A1 p.6, p.24]."
  - lt: "**Reitingas pagerėjo:** 2026-04-21 Moody's indėlių reitingą pakėlė iki A3, pirmaeilės skolos reitingas Baa1, perspektyva – teigiama [A1 p.7]."
    en: "**Rating upgraded:** on 2026-04-21 Moody's raised the deposit rating to A3; senior unsecured debt Baa1, outlook positive [A1 p.7]."
  - lt: "**Keičiasi akcininkai ir vadovybė:** Tesonet Global ketina padidinti dalį iki 31,68 % ir siekti kontrolės (ECB leidimas, iki 2027 m. I ketv.); laikinai einančiu vadovo pareigas paskirtas Tomas Varenbergas [A1 p.6-8]."
    en: "**Shareholders and management changing:** Tesonet Global plans to raise its stake to 31.68% and seek control (ECB approval, by Q1 2027); Tomas Varenbergas appointed acting CEO [A1 p.6-8]."

business:
  - lt: "Paskolos augo 8 % per metus ir viršijo 3,9 mlrd. EUR; indėliai – 4 061 mln. EUR (+15 %) [A1 p.6, p.17]."
    en: "Loans grew 8% year on year to over EUR 3.9bn; deposits EUR 4,061m (+15%) [A1 p.6, p.17]."
  - lt: "Grynoji palūkanų marža 2,4 % (prieš metus 2,9 %) – mažėja dėl žemesnių palūkanų normų [A1 p.7]."
    en: "Net interest margin 2.4% (2.9% a year ago), falling with lower interest rates [A1 p.7]."
  - lt: "Vyksta pagrindinės bankinės sistemos keitimas; 2025 m. bankas pakeitė pavadinimą į „Artea“ [A2 p.4-5]."
    en: "The core banking system replacement is under way; in 2025 the bank rebranded as Artea [A2 p.4-5]."

financials:
  - lt: "2025 m. grynasis pelnas 60,7 mln. EUR (2024 m. – 78,8 mln.), ROE 10,4 % (14,0 %); grynosios palūkanų pajamos 138,3 mln. EUR (−14 %) [A2 p.4, p.7, p.17]."
    en: "FY2025 net profit EUR 60.7m (2024: 78.8m), ROE 10.4% (14.0%); net interest income EUR 138.3m (−14%) [A2 p.4, p.7, p.17]."
  - lt: "Bendras kapitalo rodiklis 21,5 % (2025 m. pab. 21,15 %), MREL 23,59 % TREA, LCR 179 % [A1 p.6-7]."
    en: "Total capital ratio 21.5% (YE2025 21.15%), MREL 23.59% of TREA, LCR 179% [A1 p.6-7]."
  - lt: "Dividendai už 2025 m. – 0,047 EUR akcijai (30,4 mln. EUR), už 2024 m. – 0,061 EUR; 2026 m. sausį baigtas akcijų supirkimas (2,6 mln. EUR) [A1 p.9, p.29]."
    en: "Dividend for 2025 EUR 0.047 per share (EUR 30.4m), for 2024 EUR 0.061; a share buyback (EUR 2.6m) was completed in January 2026 [A1 p.9, p.29]."

