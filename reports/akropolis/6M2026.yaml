investor:
  - lt: "**Turima priemonė:** 6,000 % žaliosios obligacijos, 350 mln. EUR, išleistos 2025-05-15, išpirkimas 2030-05-15; neužtikrintos, nesubordinuotos, su įkeitimo draudimu; Euronext Dublin ir Nasdaq Vilnius [P4 p.1-4]."
    en: "**Instrument held:** 6.000% green notes, EUR 350m, issued 2025-05-15, maturing 2030-05-15; senior unsecured with a negative pledge; Euronext Dublin and Nasdaq Vilnius [P4 p.1-4]."
  - lt: "**Išpirkimas anksčiau:** iki 2030-02-15 – tik su visa kompensacija (make-whole), nuo 2030-02-15 – už nominalią vertę; kontrolės pasikeitimo atveju – teisė parduoti už 101 % [P4 p.2]."
    en: "**Early redemption:** make-whole before 2030-02-15, at par from 2030-02-15; 101% put on change of control [P4 p.2]."
  - lt: "**Kovenantai (2026-06-30):** konsoliduotas svertas 46 % (<60 %), užtikrintas svertas 21 % (<40 %), padengimas 3,3 karto (>2), neįkeistas turtas / neužtikrinta skola 194 % (>125 %) – laikomasi [P2 p.12]. Bankams įkeista 770,9 mln. EUR turto, todėl obligacijos faktiškai žemiau užtikrintų paskolų [P1 p.13]."
    en: "**Covenants (2026-06-30):** consolidated leverage 46% (<60%), secured leverage 21% (<40%), coverage 3.3x (>2x), unencumbered assets / unsecured debt 194% (>125%) – all met [P2 p.12]. EUR 770.9m of property is pledged to banks, so the notes rank effectively below secured loans [P1 p.13]."
  - lt: "Išvada: vidutinė rizika – stiprus turtas ir veikla, svertas kiek padidėjo, kovenantų atsarga didelė."
    en: "Conclusion: moderate risk – strong assets and operations, leverage slightly higher, ample covenant headroom."

