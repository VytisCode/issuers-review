quick_summary:
  - lt: "**Augimas dėl Galio Group:** I pusm. pajamos 81,6 mln. EUR (63,3 mln.), EBITDA 56,6 mln. EUR (44,3 mln.), pelnas 37,0 mln. EUR (30,5 mln.); Galio konsoliduojama nuo 2025-10-01, todėl palyginimas su 2025 m. ne visai tiesioginis [P1 p.6, p.9, p.11]."
    en: "**Growth from Galio Group:** 1H revenue EUR 81.6m (63.3m), EBITDA EUR 56.6m (44.3m), profit EUR 37.0m (30.5m); Galio is consolidated from 2025-10-01, so the year-on-year comparison is not like-for-like [P1 p.6, p.9, p.11]."
  - lt: "**Stipri veikla:** užimtumas 99,2 %, nuomininkų apyvarta 604 mln. EUR (+8,1 %), lankytojų 117 tūkst. per dieną [P2 p.7]."
    en: "**Strong operations:** occupancy 99.2%, tenant sales EUR 604m (+8.1%), 117k visitors a day [P2 p.7]."
  - lt: "**Svertas paaugo:** grynasis LTV 41,7 % (2025 m. pab. 37,0 %), grynoji skola 584,6 mln. EUR; pusmetį išmokėta 90 mln. EUR dividendų [P2 p.11; P1 p.7-8]."
    en: "**Leverage up:** net LTV 41.7% (37.0% at end-2025), net debt EUR 584.6m; EUR 90m of dividends paid in the half [P2 p.11; P1 p.7-8]."
  - lt: "**Reitingai stabilūs:** Fitch BB+ patvirtintas 2026-07-13, S&P BB+ – 2025-12-15 [P2 p.5; P5]."
    en: "**Ratings stable:** Fitch BB+ affirmed on 2026-07-13, S&P BB+ on 2025-12-15 [P2 p.5; P5]."

business:
  - lt: "5 prekybos centrai (Vilnius, Klaipėda, Šiauliai, Akropole Ryga, Akropole Alfa) ir Galio Group – iš viso 55 pajamas duodantys objektai; turto vertė 61 % Lietuvoje, 36 % Latvijoje, 3 % Estijoje [P1 p.9-10; P2 p.14]."
    en: "Five shopping centres (Vilnius, Klaipėda, Šiauliai, Akropole Riga, Akropole Alfa) and Galio Group – 55 income-producing assets; asset value 61% Lithuania, 36% Latvia, 3% Estonia [P1 p.9-10; P2 p.14]."
  - lt: "Plėtra: Klaipėdoje baigtas naujas 3 500 kv. m pastatas (6 mln. EUR), Galio projektai Cityzen (48 mln. EUR) ir Remarco (>40 mln. EUR); Akropolis Vingis – gautas leidimas, finansavimo sprendimas svarstomas [P2 p.6; P3 p.6]."
    en: "Development: a new 3,500 sq m building in Klaipėda (EUR 6m) completed, Galio projects Cityzen (EUR 48m) and Remarco (>EUR 40m); Akropolis Vingis has its permit, the financing decision is under review [P2 p.6; P3 p.6]."

financials:
  - lt: "2025 m. pajamos 140,0 mln. EUR (124,9 mln.), EBITDA 98,3 mln. EUR (87,8 mln.), pelnas 88,1 mln. EUR (61,6 mln.); portfelio vertė 1 424 mln. EUR [P3 p.10-11]."
    en: "FY2025 revenue EUR 140.0m (124.9m), EBITDA EUR 98.3m (87.8m), profit EUR 88.1m (61.6m); portfolio value EUR 1,424m [P3 p.10-11]."
  - lt: "2026-06-30 skolos 691,7 mln. EUR, pinigai 107,1 mln. EUR; vidutinė skolos kaina 4,8 %, vidutinė trukmė 3,3 m. [P1 p.4; P2 p.11-13]."
    en: "Borrowings EUR 691.7m and cash EUR 107.1m at 2026-06-30; average cost of debt 4.8%, average maturity 3.3 years [P1 p.4; P2 p.11-13]."

