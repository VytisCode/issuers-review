quick_summary:
  - lt: "**Rezultatai pagal planą:** 6 mėn. koreguota EBITDA – 306,6 mln. EUR, 1,9 % daugiau. Augo tinklai ir klientų segmentas; žalioji gamyba sumažėjo iki 149,2 mln. EUR nuo 166,6 mln. [S1 p.24]. 2026 m. prognozė 550–600 mln. EUR palikta, maždaug pusė jos jau pasiekta (51–56 %) [S2]."
    en: "**Earnings on track:** 6M Adjusted EBITDA was EUR 306.6m, up 1.9%. Networks and Customers & Solutions grew; Green Capacities fell to EUR 149.2m from 166.6m [S1 p.24]. The 2026 guidance of EUR 550-600m was kept, and about half of it is already reached (51-56%) [S2]."
    lv: "6 mēn. koriģētā EBITDA – 306,6 milj. EUR (+1,9 %). Pieauga Tīkli un Klienti un risinājumi, samazinājās Zaļā ražošana (149,2 milj. EUR pret 166,6 milj.) [S1 p.24]. 2026. gada prognoze 550–600 milj. EUR apstiprināta; pusgadā sasniegti 51–56 % [S2]."
    et: "6 kuu korrigeeritud EBITDA 306,6 mln eurot (+1,9%). Kasvasid Võrgud ning Kliendid ja lahendused, Roheline tootmine vähenes (149,2 mln vs 166,6 mln eurot) [S1 p.24]. 2026. aasta prognoos 550–600 mln eurot kinnitati; poolaastaga on täidetud 51–56% [S2]."
  - lt: "**Skola kontroliuojama:** grynoji skola 1 925,3 mln. EUR, nuo metų pradžios beveik nepakito (+0,7 %). Svertas – 3,49x grynoji skola / EBITDA. Atsilieka vienas rodiklis: FFO / grynoji skola 22,2 %, tikslas – ne mažiau 23 % [S1 p.10; S6]."
    en: "**Debt under control:** net debt EUR 1,925.3m, almost unchanged since year-end (+0.7%). Leverage is 3.49x net debt / EBITDA. One metric lags: FFO / net debt 22.2% against a target of at least 23% [S1 p.10; S6]."
    lv: "Parāds stabils: neto parāds 1 925,3 milj. EUR (+0,7 % kopš 2025. gada beigām), neto parāds / koriģētā EBITDA 3,49x, FFO / neto parāds 22,2 % (stratēģiskais mērķis ≥23 %) [S1 p.10; S6]."
    et: "Võlg stabiilne: netovõlg 1 925,3 mln eurot (+0,7% alates 2025. aasta lõpust), netovõlg / korrigeeritud EBITDA 3,49x, FFO / netovõlg 22,2% (strateegiline eesmärk ≥23%) [S1 p.10; S6]."
  - lt: "**Reitingai stabilūs:** S&P BBB+ (stabili, patvirtinta 2026-07-28) ir Moody's Baa1 (stabili, pirmas reitingas 2026 m.) [S7]."
    en: "**Ratings stable:** S&P BBB+ (stable, confirmed 2026-07-28) and Moody's Baa1 (stable, first rating in 2026) [S7]."
    lv: "Reitingi nemainīgi: S&P BBB+ (stabils, 2026-07-28), Moody's Baa1 (stabils, pirmais reitings 2026. gadā) [S7]."
    et: "Reitingud muutumatud: S&P BBB+ (stabiilne, 28.07.2026), Moody's Baa1 (stabiilne, esmane reiting 2026) [S7]."
  - lt: "**Reikia sprendimo dėl turimos obligacijos:** 2026-10-19 „Ignitis“ pasiūlė supirkti XS1646530565 (2,000 %, išpirkimas 2027-07-14). Supirkimas finansuojamas nauja 300 mln. EUR žaliąja obligacija, 4,500 %, iki 2031 m. [S8; S9]."
    en: "**Decision needed on a held bond:** on 2026-10-19 Ignitis offered to buy back XS1646530565 (2.000%, matures 2027-07-14). The buy-back is financed by a new EUR 300m green bond at 4.500% due 2031 [S8; S9]."
    lv: "Būtiski turētajai obligācijai XS1646530565 (2,000 %, 2027-07-14): 2026-10-19 izsludināts atpirkšanas piedāvājums (tender offer), ko finansē jauna 300 milj. EUR 4,500 % EuGB obligācija ar dzēšanu 2031-10-27 [S8; S9]."
    et: "Oluline hoitava võlakirja XS1646530565 (2,000%, 14.07.2027) jaoks: 19.10.2026 teatati tagasiostupakkumisest (tender offer), mida rahastatakse uue 300 mln euro 4,500% EuGB võlakirjaga tähtajaga 27.10.2031 [S8; S9]."
  - lt: "**Silpnoji vieta – pelnas:** koreguotas grynasis pelnas sumažėjo 20,8 % iki 115,8 mln. EUR. Kapitalo grąža (koreguota ROCE, 12 mėn.) nukrito iki 6,7 % nuo 8,6 % [S1 p.11]."
    en: "**Profit is the weak spot:** adjusted net profit fell 20.8% to EUR 115.8m. Return on capital (Adjusted ROCE, LTM) dropped to 6.7% from 8.6% [S1 p.11]."
    lv: "Koriģētā tīrā peļņa samazinājās par 20,8 % līdz 115,8 milj. EUR; koriģētā ROCE (12 mēn.) – 6,7 % (iepriekš 8,6 %) [S1 p.11]."
    et: "Korrigeeritud puhaskasum vähenes 20,8% 115,8 mln euroni; korrigeeritud ROCE (12 kuud) 6,7% (aasta varem 8,6%) [S1 p.11]."

business:
  - lt: "Tinklai: investicijos 208,3 mln. EUR (+26,1 %), 68 % visų investicijų; segmento koreguota EBITDA 147,3 mln. EUR (132,6 mln.) [S1 p.5, p.24]."
    en: "Networks: investments EUR 208.3m (+26.1%), 68% of total; segment Adjusted EBITDA EUR 147.3m (132.6m) [S1 p.5, p.24]."
    lv: "Tīkli: investīcijas 208,3 milj. EUR (+26,1 %), 68 % no kopējām; segmenta koriģētā EBITDA 147,3 milj. EUR (132,6 milj.) [S1 p.5, p.24]."
    et: "Võrgud: investeeringud 208,3 mln eurot (+26,1%), 68% kogumahust; segmendi korrigeeritud EBITDA 147,3 mln eurot (132,6 mln) [S1 p.5, p.24]."
  - lt: "Žalioji generacija: įrengta 2,1 GW, statoma 0,6 GW (0,7 GW po Tume BESS investicinio sprendimo), užtikrinta 3,4 GW [S1 p.11, p.17]. EBITDA mažėjo dėl silpnesnio vėjo I–II ketv. ir mažesnės apsidraudimo kainos (130 → 82 EUR/MWh) [S3]."
    en: "Green Capacities: 2.1 GW installed, 0.6 GW under construction (0.7 GW after the Tume BESS FID), 3.4 GW secured [S1 p.11, p.17]. EBITDA declined due to weaker wind in Q1-Q2 and a lower hedge price (EUR 130 → 82/MWh) [S3]."
    lv: "Zaļā ražošana: uzstādīti 2,1 GW, būvniecībā 0,6 GW (0,7 GW pēc Tume BESS investīciju lēmuma), nodrošināti 3,4 GW [S1 p.11, p.17]. EBITDA samazinājās vājāka vēja (1.–2. cet.) un zemākas nodrošinājuma cenas dēļ (130 → 82 EUR/MWh) [S3]."
    et: "Roheline tootmine: paigaldatud 2,1 GW, ehitusel 0,6 GW (0,7 GW pärast Tume BESS investeerimisotsust), tagatud 3,4 GW [S1 p.11, p.17]. EBITDA vähenes nõrgema tuule (I–II kv) ja madalama riskimaandamise hinna tõttu (130 → 82 eurot/MWh) [S3]."
  - lt: "Rezervinė galia: koreguota EBITDA 17,9 mln. EUR (29,1 mln., −38 %); balansavimo rinka tampa konkurencingesnė [S1 p.24; S3]."
    en: "Reserve Capacities: Adjusted EBITDA EUR 17.9m (29.1m, −38%); the balancing market is becoming more competitive [S1 p.24; S3]."
    lv: "Rezerves jaudas: koriģētā EBITDA 17,9 milj. EUR (29,1 milj., −38 %); balansēšanas tirgus kļūst konkurētspējīgāks [S1 p.24; S3]."
    et: "Reservvõimsused: korrigeeritud EBITDA 17,9 mln eurot (29,1 mln, −38%); tasakaalustusturg muutub konkurentsitihedamaks [S1 p.24; S3]."
  - lt: "Klientai ir sprendimai: EBITDA 0,2 mln. EUR (−27,7 mln.); padėjo didesni kiekiai šaltą žiemą ir vienkartiniai didmeninės dujų prekybos sandoriai I ketv. [S2]. Gaminančių vartotojų poveikis 2025 m. – apie −30 mln. EUR EBITDA, 2026 m. tikimasi kiek didesnio, 60–70 % kompensuos naujas reguliavimas [S3]."
    en: "Customers & Solutions: EBITDA EUR 0.2m (−27.7m); supported by higher volumes in a cold winter and one-off gas wholesale deals in Q1 [S2]. Prosumer impact c. EUR −30m EBITDA in 2025, expected somewhat higher in 2026, 60-70% to be covered by new legislation [S3]."
    lv: "Klienti un risinājumi: EBITDA 0,2 milj. EUR (−27,7 milj.); palīdzēja lielāki apjomi aukstajā ziemā un vienreizēji gāzes vairumtirdzniecības darījumi 1. cet. [S2]. Ražojošo patērētāju ietekme 2025. gadā – ap −30 milj. EUR EBITDA, 2026. gadā gaidāma nedaudz lielāka, 60–70 % segs jaunais regulējums [S3]."
    et: "Kliendid ja lahendused: EBITDA 0,2 mln eurot (−27,7 mln); toetasid suuremad mahud külmal talvel ja ühekordsed gaasi hulgimüügitehingud I kv-s [S2]. Tootvate tarbijate mõju 2025. aastal umbes −30 mln eurot EBITDA-le, 2026. aastal oodatakse veidi suuremat, 60–70% katab uus seadusandlus [S3]."
  - lt: "Projektai ir sandoriai: parduota 49 % Vilniaus KJ (Quaero Capital, 2026 m. kovas); statomos 399 MW / 798 MWh baterijų sistemos; Kruonio HAE 5-asis blokas ~80 % baigtas; 2026-08-11 pradėta duomenų centrų partnerio paieška [S1 p.6, p.9; S2]."
    en: "Projects and deals: 49% of Vilnius CHP sold (Quaero Capital, March 2026); 399 MW / 798 MWh of BESS under construction; Kruonis PSHP unit 5 ~80% complete; data-centre partner search launched 2026-08-11 [S1 p.6, p.9; S2]."
    lv: "Projekti un darījumi: pārdoti 49 % Viļņas TEC (Quaero Capital, 2026. gada marts); būvniecībā 399 MW / 798 MWh bateriju sistēmas; Kruonis HAES 5. bloks ~80 % pabeigts; 2026-08-11 sākta datu centru partnera meklēšana [S1 p.6, p.9; S2]."
    et: "Projektid ja tehingud: müüdi 49% Vilniuse koostootmisjaamast (Quaero Capital, märts 2026); ehitusel 399 MW / 798 MWh akusalvesteid; Kruonise pumphüdrojaama 5. plokk ~80% valmis; 11.08.2026 alustati andmekeskuste partneri otsingut [S1 p.6, p.9; S2]."
  - lt: "Sauga: 2026 m. vasarį žuvo rangovo darbuotojas [S10]."
    en: "Safety: a contractor employee was fatally injured in February 2026 [S10]."
    lv: "Drošība: 2026. gada februārī gāja bojā darbuzņēmēja darbinieks [S10]."
    et: "Ohutus: 2026. aasta veebruaris hukkus töövõtja töötaja [S10]."

