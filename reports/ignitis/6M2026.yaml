investor:
  - lt: "Turimos priemonės: akcijos (IGN1L) ir trys obligacijos (2027, 2028, 2030). Obligacijos neužtikrintos, joms taikomas emitento reitingas BBB+ (S&P) [S8]."
    en: "Instruments held: shares (IGN1L) and three bonds (2027, 2028, 2030). The bonds are senior unsecured and carry the issuer rating of BBB+ (S&P) [S8]."
    lv: "Turētie instrumenti: akcijas (IGN1L) un trīs obligācijas (2027, 2028, 2030). Obligācijas ir nenodrošinātas, tām piemēro emitenta reitingu BBB+ (S&P) [S8]."
    et: "Hoitavad instrumendid: aktsiad (IGN1L) ja kolm võlakirja (2027, 2028, 2030). Võlakirjad on tagamata, neile kehtib emitendi reiting BBB+ (S&P) [S8]."
  - lt: "Obligacijų turėtojams: sverto rodiklis (3,49x) – strateginiame 3–4x intervale, reitingai stabilūs; FFO / grynoji skola (22,2 %) dar žemiau ≥23 % tikslo. Investicijos daugiausia į reguliuojamus tinklus [S1 p.5, p.10; S6; S7]."
    en: "For bondholders: leverage (3.49x) is within the strategic 3-4x range and ratings are stable; FFO / net debt (22.2%) is still below the ≥23% target. Investment is mostly in regulated networks [S1 p.5, p.10; S6; S7]."
    lv: "Obligāciju turētājiem: sviras rādītājs (3,49x) ir stratēģiskajā 3–4x intervālā, reitingi stabili; FFO / neto parāds (22,2 %) vēl zem ≥23 % mērķa. Investīcijas galvenokārt regulētajos tīklos [S1 p.5, p.10; S6; S7]."
    et: "Võlakirjaomanikele: finantsvõimendus (3,49x) on strateegilises vahemikus 3–4x, reitingud stabiilsed; FFO / netovõlg (22,2%) on veel alla ≥23% eesmärgi. Investeeringud on peamiselt reguleeritud võrkudesse [S1 p.5, p.10; S6; S7]."
  - lt: "XS1646530565: dėl 2026-10-19 supirkimo pasiūlymo reikia sprendimo (dalyvauti ar laikyti iki 2027-07-14). Pasiūlymo sąlygos ir terminas – emitento „Tender Offer Launch Announcement“ [S8]."
    en: "XS1646530565: the 2026-10-19 tender offer requires a decision (tender or hold to 2027-07-14). Terms and deadline are in the issuer's Tender Offer Launch Announcement [S8]."
    lv: "XS1646530565: 2026-10-19 atpirkšanas piedāvājums prasa lēmumu (piedalīties vai turēt līdz 2027-07-14). Nosacījumi un termiņš – emitenta „Tender Offer Launch Announcement“ [S8]."
    et: "XS1646530565: 19.10.2026 tagasiostupakkumine nõuab otsust (osaleda või hoida kuni 14.07.2027). Tingimused ja tähtaeg on emitendi teates „Tender Offer Launch Announcement“ [S8]."
  - lt: "Akcininkams: I pusm. dividendai 0,704 EUR (+3,1 %), koreguotas pelnas mažėja (−20,8 %). Laisvieji pinigų srautai 5,3 mln. EUR – investicijos ir dividendai finansuojami ir skola [S1 p.29; S2]."
    en: "For shareholders: H1 dividend EUR 0.704 (+3.1%), while adjusted profit is declining (−20.8%). Free cash flow EUR 5.3m - investment and dividends are partly debt-funded [S1 p.29; S2]."
    lv: "Akcionāriem: 1. pusg. dividende 0,704 EUR (+3,1 %), koriģētā peļņa samazinās (−20,8 %). Brīvā naudas plūsma 5,3 milj. EUR – investīcijas un dividendes daļēji finansē ar parādu [S1 p.29; S2]."
    et: "Aktsionäridele: I poolaasta dividend 0,704 eurot (+3,1%), korrigeeritud kasum väheneb (−20,8%). Vaba rahavoog 5,3 mln eurot – investeeringuid ja dividende rahastatakse osaliselt võlaga [S1 p.29; S2]."
  - lt: "Išvada: finansinė būklė, palyginti su 2025 m. pabaiga, iš esmės nepakito; kredito rodikliai atitinka strategijos ribas, reitingai stabilūs. Stebėti: 9 mėn. ataskaitą (2026-11-11), vėjo ir kainų poveikį Žaliajai generacijai, FFO / skolos rodiklio grįžimą į ≥23 %."
    en: "Conclusion: financial position broadly unchanged versus year-end 2025; credit metrics within strategic limits, ratings stable. Watch: 9M report (2026-11-11), wind and price effects on Green Capacities, FFO / net debt returning to ≥23%."
    lv: "Secinājums: finanšu stāvoklis salīdzinājumā ar 2025. gada beigām būtībā nav mainījies; kredītrādītāji atbilst stratēģijas robežām, reitingi stabili. Sekot: 9 mēn. pārskatam (2026-11-11), vēja un cenu ietekmei uz Zaļo ražošanu, FFO / parāda rādītāja atgriešanās līdz ≥23 %."
    et: "Järeldus: finantsseisund on võrreldes 2025. aasta lõpuga sisuliselt muutumatu; krediidinäitajad on strateegia piirides, reitingud stabiilsed. Jälgida: 9 kuu aruanne (11.11.2026), tuule ja hindade mõju Rohelisele tootmisele, FFO / netovõla tagasipöördumine ≥23%-ni."

esg:
  policies:
  - investments
  - electricity_renewables
  - fossil_fuels
  - climate_nature
  - human_rights
  - anti_corruption
  items:
    excl_sectors:
      status: 'yes'
      evidence:
        lt: Ginklų, tabako ir lošimų veiklos nėra. Anglies generacijos nėra, naftos ir dujų žvalgybos nėra [S4]. Turi dujomis kūrenamą Elektrėnų kompleksą (rezervinė galia) ir tiekia dujas klientams – SEB iškastinio kuro politika tokios veiklos nedraudžia (ribojama anglis >5 % pajamų ir nauja žvalgyba).
        en: No weapons, tobacco or gambling. No coal generation and no oil & gas exploration [S4]. Owns the gas-fired Elektrėnai complex (reserve capacity) and supplies gas - not restricted by the SEB fossil fuel policy (restricts coal >5% of revenue and new exploration).
    excl_red_flag:
      status: 'yes'
      evidence:
        lt: Raudonų signalų (UNGC, OECD pažeidimų) viešuose šaltiniuose ir naujienų paieškoje nerasta (2026-10-22). Ignitis skelbia, kad laikosi UN Global Compact principų [S4].
        en: No red flags (UNGC / OECD breaches) found in public sources and the news scan (2026-10-22). Ignitis states it upholds the UN Global Compact principles [S4].
    sanctions:
      status: review
      evidence:
        lt: Automatinė patikra ES, JT, JAV OFAC ir JK konsoliduotuose sankcijų sąrašuose.
        en: Automatic check against the EU, UN, US OFAC and UK consolidated sanctions lists.
    media:
      status: 'yes'
      evidence:
        lt: Automatinė naujienų paieška (lietuvių, latvių, estų ir anglų žiniasklaida, paskutinės 30 d., 2026-10-22) neigiamų naujienų nerado.
        en: No adverse news found in the automatic news scan (Lithuanian, Latvian, Estonian and English media, last 30 days, 2026-10-22).
    int_promoting:
      status: 'yes'
      evidence:
        lt: Pagrindinė veikla – žalioji generacija (įrengta 2,1 GW, statoma 0,6 GW) ir elektros tinklai [S1 p.11]; žaliosios obligacijos ir nauja ES žaliųjų obligacijų standarto (EuGB) obligacija [S9].
        en: Core activities are green generation (2.1 GW installed, 0.6 GW under construction) and power networks [S1 p.11]; green bonds and a new EU Green Bond Standard (EuGB) bond [S9].
    int_taxonomy:
      status: 'yes'
      evidence:
        lt: ES taksonomiją atitinkančios investicijos 2025 m. – 84,7 % [S4]. SBTi patvirtino tikslus pagal 1,5 °C trajektoriją; nulinė emisija iki 2050 m. ar anksčiau [S4 p.10].
        en: EU Taxonomy-aligned capex 84.7% in 2025 [S4]. SBTi-validated targets in line with 1.5°C; net zero by 2050 or sooner [S4 p.10].
    int_yellow_flag:
      status: 'yes'
      evidence:
        lt: '**Reikšmingų geltonų signalų nėra:** su JT Pasauliniu susitarimu susijusių ginčų nerasta. **Verta žinoti:** 2026 m. vasarį žuvo rangovo darbuotojas [S10]; 1 apimties emisijos 2025 m. išaugo 54,7 % dėl didesnės dujų generacijos [S4]. Sauga valdoma pagal ISO 45001 [W1].'
        en: '**No material yellow flag:** no UN Global Compact related controversies found. **To note:** a contractor employee was fatally injured in February 2026 [S10]; Scope 1 emissions rose 54.7% in 2025 due to higher gas generation [S4]. Safety is managed under ISO 45001 [W1].'
    int_seb_policies:
      status: 'yes'
      evidence:
        lt: '**Taikoma:** SEB investicijų politika [SP1 p.5], elektros ir atsinaujinančios energetikos politika, nes žalioji gamyba ir tinklai sudaro daugiau nei 15 % pajamų [SP6 p.6], ir iškastinio kuro politika dėl dujų skirstymo, dujų tiekimo ir Elektrėnų rezervinių elektrinių. Dujų pajamų dalis nerasta [S4 p.24, p.39; SP5 p.4, p.6]. **Reikalavimai įvykdyti:** atskleistos 1–3 apimties emisijos (4,49 mln. t CO2e 2025 m.) ir SBTi patvirtinti 1,5 °C tikslai [S4 p.8-9, p.15]; ISO 14001 aplinkosaugos vadyba ESO, „Ignitis gamyboje“, „Ignitis“ bei Vilniaus ir Kauno kogeneracinėse jėgainėse [W1]. Anglies, durpių ar naftos ir dujų gavybos nėra [S4]. **Lūkesčiai įvykdyti:** ISO 45001 saugos vadyba, 2025 m. mirtinų nelaimingų atsitikimų nebuvo [S4 p.16; W1]; pasitikėjimo linija anoniminiams pranešimams [W2]; antikorupcijos politika ir ISO 37001 sertifikatas [W1; W2]; JT Pasaulinis susitarimas [S4 p.8]; integruota metinė ataskaita su klimato duomenimis [S4]; biologinės įvairovės stebėsena ir poveikio mažinimo priemonės [W3]. **Galėtų būti geriau:** neskelbiamas įvardytas žmogaus teisių patikros procesas ir kiekybiniai biologinės įvairovės tikslai [SP6 p.8].'
        en: '**Applicable:** the SEB Investments policy [SP1 p.5], the Electricity & Renewable Energy policy, since green generation and networks make up more than 15% of revenue [SP6 p.6], and the Fossil Fuels policy for gas distribution, gas supply and the Elektrėnai reserve plants. The gas revenue share was not found [S4 p.24, p.39; SP5 p.4, p.6]. **Requirements met:** Scope 1-3 emissions disclosed (4.49m t CO2e in 2025) and SBTi-validated 1.5°C targets [S4 p.8-9, p.15]; ISO 14001 environmental management at ESO, Ignitis gamyba, Ignitis and the Vilnius and Kaunas CHPs [W1]. No coal, peat or oil & gas extraction [S4]. **Expectations met:** ISO 45001 safety management, no fatal accidents in 2025 [S4 p.16; W1]; trust line for anonymous reports [W2]; anti-corruption policy and ISO 37001 certification [W1; W2]; UN Global Compact [S4 p.8]; integrated annual report with climate data [S4]; biodiversity monitoring and mitigation measures [W3]. **Could be improved:** no named human rights due diligence process or quantified biodiversity targets are published [SP6 p.8].'
    engagement:
      status: 'no'
      evidence:
        lt: 'Nereikia: bendrovė atitinka SEB politikų lūkesčius, raudonų signalų nėra.'
        en: 'No need: the company meets SEB policy expectations and has no red flags.'
    indicators:
      status: 'yes'
      evidence:
        lt: Bendros ŠESD emisijos 2025 m. – 4,49 mln. t CO2e (+10,1 %) [S4]; anglies intensyvumas (1+2 apimtis) 2026 m. I ketv. – 214 g CO2e/kWh (−12,8 %) [S10]; taksonomiją atitinkančios investicijos – 84,7 % [S4]; SBTi patvirtinti 1,5 °C tikslai [S4 p.9].
        en: Total GHG emissions 4.49m t CO2e in 2025 (+10.1%) [S4]; carbon intensity (Scope 1+2) 214 g CO2e/kWh in Q1 2026 (−12.8%) [S10]; Taxonomy-aligned capex 84.7% [S4]; SBTi-validated 1.5°C targets [S4 p.9].
