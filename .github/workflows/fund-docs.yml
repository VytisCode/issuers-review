# Fondų peržiūra: oficialūs valdytojų dokumentai (faktų lapai, KID) -> šaka „fund-docs“ (datuota PDF kopija + tekstas).
# Paleidžiama rankiniu būdu; įvestis – JSON {"items": [{isin, kind, url}], "isins": [..]}. Nemokama, be AI.
name: Fund documents
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'JSON: {"items": [{"isin","kind","url"}], "isins": [...]}'
        required: true
permissions:
  contents: write
concurrency:
  group: fund-docs
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Previous documents (fund-docs branch)
        run: |
          git fetch origin fund-docs:fund-docs 2>/dev/null && git worktree add out fund-docs || (git worktree add --detach out && cd out && git checkout --orphan fund-docs && git rm -rfq . || true)
      - name: Download
        env:
          SPEC: ${{ inputs.spec }}
        run: printf '%s' "$SPEC" > /tmp/spec.json && python tools/fetch_fund_docs.py out /tmp/spec.json
      - name: Commit
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Fondų dokumentai $(date -u +%F)" || echo "nėra pakeitimų"
          git push origin fund-docs
