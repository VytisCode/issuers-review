name: Update issuers data

# Kas pirmadienį ~08:17 Vilniaus laiku: naujienos ir naujų ataskaitų paieška (be AI, nemokamai), tada failai ir svetainė.
# Ranka: Actions → "Update issuers data" → Run workflow (arba dashboard mygtukas „Ieškoti naujų ataskaitų ir naujienų dabar“).
# Pakeitus ataskaitą ar sąrašus (reports/, config/, data/history/, site/, tools/) - tik persigeneruoja failai ir svetainė.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["reports/**", "config/**", "data/history/**", "site/**", "tools/**", "assets/**"]

permissions:
  contents: write

concurrency:
  group: update-issuers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: ISIN list from the dashboard (new / sold securities)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python -u tools/sync_isins.py
          python -u tools/lookup_isins.py

      - name: Market rates (ECB) and bond quotes (Nasdaq Baltic), free public data
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python -u tools/fetch_market.py
          python -u tools/fetch_prices.py

      - name: News (Google News RSS)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -u tools/fetch_news.py

      - name: New reports on issuer pages
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -u tools/check_filings.py

      - name: Sanctions lists (EU, UN, US OFAC, UK)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -u tools/check_sanctions.py

      - name: Build Word / PDF
        run: python -u tools/build_reports.py

      - name: Source packages (ZIP of documents used in each report -> GitHub Release "sources")
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u tools/archive_sources.py

      - name: Build dashboard
        run: python -u tools/build_site.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data config
          if git diff --cached --quiet; then echo "Nėra pakeitimų"; exit 0; fi
          git commit -m "Automatinis atnaujinimas $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push origin main
