  good:
    - {lt: "Valstybės įmonė, finansuojanti gynybos pramonę (pvz., artilerijos sviedinių gamyklą Baisogaloje), obligacijas garantuoja valstybė [E1 p.4; E1 p.5].", en: "A state company financing the defence industry (e.g. an artillery shell plant in Baisogala); its bonds are state-guaranteed [E1 p.4; E1 p.5]."}
    - {lt: "Nauda visuomenei – šalies saugumas: veikla stiprina Lietuvos gynybą ir saugumą [E1 p.4].", en: "Benefit to society – national security: its work strengthens Lithuania's defence and security [E1 p.4]."}
    - {lt: "2025 m. patvirtino korupcijos prevencijos politiką [E1 p.36].", en: "Adopted an anti-corruption policy in 2025 [E1 p.36]."}
  bad:
    - {lt: "Pati įmonė sako, kad tvarumas nėra jos pagrindinis tikslas – tvarumo skaičių ir tikslų nėra [E1 p.16].", en: "The company itself says sustainability is not its main goal – no sustainability figures or targets [E1 p.16]."}
  means: {lt: "Rašyti nereikia: tai maža valstybės įmonė su valstybės garantija, gamina įprastinę amuniciją Lietuvoje [E1 p.5].", en: "No need to write: a small state company with a state guarantee, producing conventional ammunition in Lithuania [E1 p.5]."}
  seb: {status: ok, lt: "Gynybos gairės draudžia tik uždraustus ginklus; ši įmonė finansuoja įprastinę amuniciją.", en: "The defence guidelines ban only prohibited weapons; this company finances conventional ammunition."}
