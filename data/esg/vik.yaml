engagement:
  level: none
  policies: [investments, arms_defence, climate_nature]
  reason:
    lt: "SEB ginklų ir gynybos politikos apribojimai nepažeisti: finansuojama konvencinės amunicijos (155 mm) gamyba NATO šalyje, ne kontroversiniai ginklai [E1 p.5]. Tai maža valstybės specialiosios paskirties bendrovė su valstybės garantija, todėl ESG ataskaitų trūkumas nėra pagrindas kreiptis."
    en: "SEB Arms & Defence policy restrictions are not breached: it finances conventional ammunition (155 mm) production in a NATO country, not controversial weapons [E1 p.5]. It is a small state special-purpose company with a state guarantee, so the lack of ESG reporting is not a reason to engage."
