# ESG Engagement: Nortal. Grupės ataskaitos už slaptažodžio (manual_reports) - viešai rasti tik JK padalinio anglies mažinimo planas ir grupės šiuolaikinės vergovės pareiškimas. Puslapiai - PDF puslapiai.
issuer: nortal
analysis_date: 2026-10-23
sources:
  E1: {title: "Nortal UK Carbon Reduction Plan 2025", url: "https://nortal.com/hubfs/Carbon_Reduction_Plan_Nortal_UK_2025.pdf", date: 2025-05}
  E2: {title: "Nortal Group Modern Slavery Statement 2026", url: "https://nortal.com/hubfs/Modern_Slavery_Statement_Nortal_Group_2026.pdf", date: 2026}
trend: limited
summary:
  lt: "IT paslaugų bendrovė su mažu aplinkos pėdsaku. Grupės tvarumo ataskaitos viešai nerasta (investuotojų ataskaitos – už slaptažodžio). Vieši dokumentai: JK padalinio (45 darbuotojai) anglies mažinimo planas – grynasis nulis iki 2050 m., 2025 m. išmetimai 75,9 t, tikslas 50 t iki 2030 m. [E1 p.2; E1 p.3]; grupės šiuolaikinės vergovės pareiškimas su tiekėjų elgesio kodeksu [E2 p.4]."
  en: "An IT services company with a small environmental footprint. No group sustainability report was found publicly (investor reports are password-protected). Public documents: the UK unit's (45 staff) carbon reduction plan with net zero by 2050, 2025 emissions of 75.9 t and a 50 t target for 2030 [E1 p.2; E1 p.3]; and the group modern slavery statement with a supplier code of conduct [E2 p.4]."
years:
  FY2025:
    trend: limited
    framework:
      lt: "Grupės tvarumo ataskaitos nerasta. JK padalinio anglies mažinimo planas (JK viešųjų pirkimų forma) ir grupės šiuolaikinės vergovės pareiškimas, patvirtintas kiekvienos įmonės valdybos [E1 p.2; E2 p.6]."
      en: "No group sustainability report found. The UK unit's carbon reduction plan (UK public procurement template) and the group modern slavery statement approved by each company's board [E1 p.2; E2 p.6]."
    assurance: none
    summary:
      lt: "JK padalinys: Scope 1 – 0, Scope 2 – 0,51 t, Scope 3 – 75,4 t (2025 m. – bazė) [E1 p.3]. Grupė: nulinė tolerancija šiuolaikinei vergovei, tiekėjų elgesio kodeksas, gerinamas „pažink savo tiekėją“ procesas [E2 p.3; E2 p.4]."
      en: "UK unit: Scope 1 zero, Scope 2 0.51 t, Scope 3 75.4 t (2025 is the base year) [E1 p.3]. Group: zero tolerance for modern slavery, a supplier code of conduct, and an improved Know Your Supplier process [E2 p.3; E2 p.4]."
    evidence:
      - {p: E, lt: "JK padalinys: grynasis nulis iki 2050 m.; tikslas 50 t CO2e iki 2030 m. (−30 %) [E1 p.2; E1 p.3].", en: "UK unit: net zero by 2050; target 50 t CO2e by 2030 (−30%) [E1 p.2; E1 p.3]."}
      - {p: E, lt: "Nuotolinis darbas, debesų infrastruktūra, nėra įmonės automobilių [E1 p.5].", en: "Remote work, cloud infrastructure, no company vehicles [E1 p.5]."}
      - {p: S, lt: "Tiekėjai privalo laikytis elgesio kodekso; esami tiekėjai reguliariai peržiūrimi [E2 p.4].", en: "Suppliers must follow the code of conduct; existing suppliers are reviewed regularly [E2 p.4]."}
      - {p: G, lt: "Darbuotojai skatinami pranešti apie įtarimus; mokymai apie šiuolaikinės vergovės riziką [E2 p.3; E2 p.5].", en: "Employees are encouraged to report concerns; training on modern slavery risks [E2 p.3; E2 p.5]."}
    concerns:
      - {lt: "Grupės lygio išmetimų, tikslų ir tvarumo ataskaitos viešai nerasta.", en: "No group-level emissions, targets or sustainability report found publicly."}
