    FY2024: {lt: "27 kg (−50 %) [E2 p.24]", en: "27 kg (−50%) [E2 p.24]"}
    FY2025: {lt: "27 kg (−50 %) [E1 p.122]", en: "27 kg (−50%) [E1 p.122]"}
    status: on_track
  - p: E
    name: {lt: "Scope 3 (5 ir 13 kat.) −55 % vienam m² iki 2030 m. (bazė 81 kg CO2e/m²)", en: "Scope 3 (cat. 5 and 13) −55% per m² by 2030 (base 81 kg CO2e/m²)"}
    FY2024: {lt: "42 kg (−48 %) [E2 p.24]", en: "42 kg (−48%) [E2 p.24]"}
    FY2025: {lt: "42 kg (−52 %) [E1 p.122]", en: "42 kg (−52%) [E1 p.122]"}
    status: on_track
  - p: E
    name: {lt: "Energijos intensyvumas bendrose patalpose 110 kWh/m² iki 2030 m.", en: "Energy intensity in common areas 110 kWh/m² by 2030"}
    FY2024: {lt: "126 kWh/m² [E2 p.24]", en: "126 kWh/m² [E2 p.24]"}
    FY2025: {lt: "114 kWh/m² [E1 p.122]", en: "114 kWh/m² [E1 p.122]"}
    status: on_track
  - p: E
    name: {lt: "„BREEAM In-Use Very Good“ visuose esamuose pastatuose iki 2030 m.", en: "BREEAM In-Use Very Good for all existing buildings by 2030"}
    FY2024: {lt: "Įvairūs lygiai (Good – Very Good) [E1 p.122]", en: "Mixed levels (Good – Very Good) [E1 p.122]"}
    FY2025: {lt: "Įvairūs lygiai; visi centrai sertifikuoti [E1 p.122; E1 p.7]", en: "Mixed levels; all centres certified [E1 p.122; E1 p.7]"}
    status: on_track
