  - {p: E, name: {lt: "Scope 1 išmetimai", en: "Scope 1 emissions"}, unit: "t CO2e", better: down, FY2023: {v: 2106, src: "E2 p.25"}, FY2024: {v: 1819, src: "E1 p.124", note: {lt: "2024 m. ataskaitoje 1 886", en: "1,886 in the 2024 report"}}, FY2025: {v: 1107, src: "E1 p.124"}}
  - {p: E, name: {lt: "Scope 2 (rinkos metodas)", en: "Scope 2 (market-based)"}, unit: "t CO2e", better: down, FY2024: {v: 6831, src: "E1 p.124"}, FY2025: {v: 7991, src: "E1 p.124"}}
  - {p: E, name: {lt: "Scope 3 išmetimai", en: "Scope 3 emissions"}, unit: "t CO2e", better: down, FY2024: {v: 19507, src: "E1 p.124", note: {lt: "2024 m. ataskaitoje 20 414", en: "20,414 in the 2024 report"}}, FY2025: {v: 19798, src: "E1 p.124"}}
