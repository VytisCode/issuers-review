  - p: E
    name: {lt: "Vandens nuostoliai −30 % iki 2030 m. (nuo 2023 m.)", en: "Water losses −30% by 2030 (vs 2023)"}
    FY2024: {lt: "13,6 % (2024 m. tikslas ≤12,5 %) [E2 p.46]", en: "13.6% (2024 target ≤12.5%) [E2 p.46]"}
    FY2025: {lt: "Bazė perskaičiuojama 2026 m. [E1 p.99]", en: "Baseline being recalculated in 2026 [E1 p.99]"}
