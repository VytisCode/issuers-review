  - {p: E, name: {lt: "Scope 1 išmetimai", en: "Scope 1 emissions"}, unit: "t CO2e", better: down, FY2023: {v: 2793.65, src: "E1 p.77"}, FY2024: {v: 3215.91, src: "E1 p.77", note: {lt: "pataisyta; iki pataisos 3 208,96", en: "corrected; 3,208.96 before correction"}}, FY2025: {v: 2923.24, src: "E1 p.77"}}
  - {p: E, name: {lt: "Scope 2 (rinkos metodas)", en: "Scope 2 (market-based)"}, unit: "t CO2e", better: down, FY2023: {v: 20682.87, src: "E1 p.77"}, FY2024: {v: 22681.62, src: "E1 p.77"}, FY2025: {v: 21598.68, src: "E1 p.77"}}
  - {p: E, name: {lt: "Scope 1+2 (vietos metodas)", en: "Scope 1+2 (location-based)"}, unit: "t CO2e", better: down, FY2023: {v: 8409.85, src: "E1 p.77"}, FY2024: {v: 8581.43, src: "E1 p.77"}, FY2025: {v: 8405.22, src: "E1 p.77"}}
