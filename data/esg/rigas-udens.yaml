  - p: E
    name: {lt: "Išvalytų nuotekų dalis ≥98 %", en: "Treated wastewater share ≥98%"}
    FY2024: {lt: "98,46 % [E2 p.44]", en: "98.46% [E2 p.44]"}
    FY2025: {lt: "98,01 % [E1 p.68]", en: "98.01% [E1 p.68]"}
    status: met
  - p: E
    name: {lt: "100 % nuotekų dumblo apdorojama metantankuose 2026 m.", en: "100% of sewage sludge treated in digesters in 2026"}
    FY2024: {lt: "67,77 % (tikslas ≥70 %) [E2 p.44]", en: "67.77% (target ≥70%) [E2 p.44]"}
    FY2025: {lt: "Pradėta metantankų rekonstrukcija [E1 p.73]", en: "Digester reconstruction started [E1 p.73]"}
    status: behind
