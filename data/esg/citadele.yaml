engagement:
  level: watch
  severity: minor
  verdict:
    lt: "Geras emitentas: metiniai tikslai įvykdyti, priimtas pereinamojo laikotarpio planas, paskolų išmetimai stabilūs [E1 p.44; E1 p.37]. Kreiptis nereikia."
    en: "A good issuer: annual targets met, a transition plan adopted, lending emissions stable [E1 p.44; E1 p.37]. No need to write."
  issues:
    - what: {lt: "Bendri finansuojami išmetimai +12 % dėl valdomo turto augimo.", en: "Total financed emissions +12% from growth in assets under management."}
      why: {lt: "Kiekybinių mažinimo tikslų dar nėra – tik stebėsenos tikslai 2026–2027 m. [E1 p.44; E1 p.43].", en: "There are no quantified reduction targets yet, only monitoring targets for 2026–2027 [E1 p.44; E1 p.43]."}
      fix: {lt: "Kitais metais patikrinti, ar nustatyti kiekybiniai tikslai.", en: "Check next year whether quantified targets were set."}
  policies: [investments, financial_general, climate_nature]
  reason:
    lt: "SEB finansų sektoriaus lūkesčiai iš esmės atitinkami: tikslas iki 2050 m., Pereinamojo laikotarpio planas, PCAF finansuojami išmetimai, KPMG ribotas užtikrinimas [E1 p.37; E1 p.44; E1 p.205]. Paskolų portfelio išmetimai stabilūs, todėl kreiptis nebūtina; stebėti, ar po 2026–2027 m. stebėsenos etapo bus nustatyti kiekybiniai mažinimo tikslai (2 etapas) [E1 p.37; E1 p.43]."
    en: "SEB's financial-sector expectations are broadly met: 2050 target, transition plan, PCAF financed emissions, KPMG limited assurance [E1 p.37; E1 p.44; E1 p.205]. Lending emissions are stable, so engagement is not needed; watch whether quantified reduction targets (Phase 2) are set after the 2026–2027 monitoring phase [E1 p.37; E1 p.43]."
  questions: []
# Trumpai paprasta kalba (rodoma ESG puslapio viršuje): kas gerai, kas negerai, ką tai reiškia mums
brief:
  good:
    - {lt: "Visi metiniai tikslai įvykdyti, pvz., naujų žaliųjų paskolų 176 mln. EUR (tikslas 100 mln.) [E1 p.44].", en: "All annual targets met, e.g. EUR 176m of new green loans (target 100m) [E1 p.44]."}
    - {lt: "Priimtas planas, kaip iki 2050 m. visiškai nustoti teršti klimatą [E1 p.37].", en: "Adopted a plan to reach net zero by 2050 [E1 p.37]."}
    - {lt: "Paskolų klientų tarša nedidėja [E1 p.44].", en: "Emissions of its borrowers are not rising [E1 p.44]."}
  bad:
    - {lt: "Bendra su banku susijusi tarša +12 %, bet tik todėl, kad bankas valdo daugiau klientų investicijų [E1 p.44].", en: "Total pollution linked to the bank +12%, but only because the bank manages more client investments [E1 p.44]."}
  means: {lt: "Viskas gerai, rašyti nereikia.", en: "All fine, no need to write."}
  seb: {status: ok, lt: "Skelbia klientų taršą ir turi planą jai mažinti.", en: "Discloses borrowers' pollution and has a plan to cut it."}
