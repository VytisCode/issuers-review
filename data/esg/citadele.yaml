trend: mixed
summary:
  lt: "Tikslas – nulinė finansuojamų išmetimų emisija iki 2050 m.; 2025 m. priimtas Pereinamojo laikotarpio planas (1 versija) su 2030 m. stebėsenos tikslais pagal sektorius (bazė 2024 m.) [E1 p.37; E1 p.38]. Metiniai tikslai įvykdyti: naujas žaliasis finansavimas 176 mln. EUR (tikslas 100 mln.), eNPS 50 % (tikslas >40 %), NPS Latvijoje ir Lietuvoje virš 35 % [E1 p.44; E1 p.93; E1 p.104]. Finansuojami išmetimai +12 % (1,45 → 1,63 mln. t), daugiausia dėl valdomo turto (+48 %); paskolų portfelio išmetimai beveik nepakito (−0,2 %) [E1 p.44]."
  en: "Target of net-zero financed emissions by 2050; a Transition Plan (Version 1) with sector monitoring targets for 2030 (2024 base) was adopted in 2025 [E1 p.37; E1 p.38]. Annual targets met: new green financing EUR 176m (target EUR 100m), eNPS 50% (target >40%), NPS in Latvia and Lithuania above 35% [E1 p.44; E1 p.93; E1 p.104]. Financed emissions +12% (1.45m → 1.63m t), mostly from assets under management (+48%); lending portfolio emissions broadly flat (−0.2%) [E1 p.44]."
years:
  FY2025:
    trend: mixed
    framework:
      lt: "Tvarumo ataskaita pagal ESRS; KPMG Baltics riboto užtikrinimo išvada be išlygų [E1 p.205; E1 p.208]."
      en: "ESRS sustainability statement; unqualified KPMG Baltics limited assurance conclusion [E1 p.205; E1 p.208]."
    assurance: limited
    summary:
      lt: "Žaliasis finansavimas 176 mln. EUR (102 mln. 2024 m.); Scope 1 −5 %, Scope 2 (rinkos metodas) −13 % [E1 p.44]. Finansuojami išmetimai +12 % [E1 p.44]. 2024 m. pažadas parengti išmetimų mažinimo planą iki 2025 m. pabaigos įvykdytas – Pereinamojo laikotarpio planas (1 versija) [E2 p.51; E1 p.37]."
      en: "Green financing EUR 176m (EUR 102m in 2024); Scope 1 −5%, market-based Scope 2 −13% [E1 p.44]. Financed emissions +12% [E1 p.44]. The 2024 promise to prepare an emission reduction roadmap by end-2025 was delivered as Transition Plan (Version 1) [E2 p.51; E1 p.37]."
    evidence:
      - {p: E, lt: "2030 m. stebėsenos tikslai nekilnojamojo turto, energetikos, transporto ir žemės ūkio paskoloms pagal nacionalinius, ES ir SBTi orientyrus [E1 p.37; E1 p.38].", en: "2030 monitoring targets for real estate, energy, transport and agriculture lending, benchmarked to national, EU and SBTi pathways [E1 p.37; E1 p.38]."}
      - {p: E, lt: "Paskolų portfelio išmetimai −0,2 %, valdomo turto +48 %, vertybinių popierių +24 % [E1 p.44].", en: "Lending portfolio emissions −0.2%, assets under management +48%, securities +24% [E1 p.44]."}
      - {p: E, lt: "Trys fondai / pensijų planai pagal SFDR 8 straipsnį (tikslas 3) [E1 p.44].", en: "Three funds / pension plans under SFDR Article 8 (target 3) [E1 p.44]."}
      - {p: S, lt: "NPS: Latvija 39 %, Lietuva 38 % (tikslas >35 %); programėlės NPS 57 % / 48 % (tikslas >50 %) [E1 p.104].", en: "NPS: Latvia 39%, Lithuania 38% (target >35%); mobile app NPS 57% / 48% (target >50%) [E1 p.104]."}
      - {p: S, lt: "Vienas registruotas nelaimingas atsitikimas darbe, mirtinų nėra [E1 p.96].", en: "One recordable work accident, no fatalities [E1 p.96]."}
      - {p: G, lt: "Patvirtintų korupcijos ar kyšininkavimo atvejų 0 (0 – 2024 m.) [E1 p.110].", en: "Zero confirmed corruption or bribery incidents (0 in 2024) [E1 p.110]."}
    concerns:
      - {lt: "Finansuojami išmetimai +12 % dėl valdomo turto augimo [E1 p.44].", en: "Financed emissions +12% from growth in assets under management [E1 p.44]."}
      - {lt: "Programėlės NPS Lietuvoje 48 % – žemiau >50 % tikslo [E1 p.104].", en: "Mobile app NPS in Lithuania 48%, below the >50% target [E1 p.104]."}
  FY2024:
    trend: stable
    framework:
      lt: "Pirmoji tvarumo ataskaita pagal ESRS su ribotu užtikrinimu [E2 p.18]."
      en: "First ESRS sustainability statement with limited assurance [E2 p.18]."
    assurance: limited
    summary:
      lt: "Naujas žaliasis finansavimas 102 mln. EUR (tikslas 100 mln.; 115 mln. 2023 m.) [E2 p.51]. Pereinamojo laikotarpio plano dar nebuvo, įsipareigota jį parengti iki 2025 m. pabaigos [E2 p.51]."
      en: "New green financing EUR 102m (target EUR 100m; EUR 115m in 2023) [E2 p.51]. No transition plan yet; commitment to finalise one by end-2025 [E2 p.51]."
    evidence:
      - {p: E, lt: "Scope 1 79,2 t, Scope 2 (rinkos metodas) 539,4 t [E2 p.52].", en: "Scope 1 79.2 t, market-based Scope 2 539.4 t [E2 p.52]."}
      - {p: S, lt: "eNPS 53 % (tikslas >35 %; 47 % 2023 m.) [E2 p.73].", en: "eNPS 53% (target >35%; 47% in 2023) [E2 p.73]."}
      - {p: G, lt: "Patvirtintų korupcijos atvejų 0 [E2 p.87].", en: "Zero confirmed corruption incidents [E2 p.87]."}
    concerns:
      - {lt: "Pereinamojo laikotarpio plano dar nebuvo [E2 p.51].", en: "No transition plan yet [E2 p.51]."}
