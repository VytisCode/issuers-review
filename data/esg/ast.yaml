  - {p: E, name: {lt: "Grupės Scope 2 (rinkos metodas, su nuostoliais)", en: "Group Scope 2 (market-based, incl. losses)"}, unit: "t CO2e", better: down, FY2024: {v: 106787, src: "E1 p.92", note: {lt: "perskaičiuota 2025 m. ataskaitoje", en: "restated in the 2025 report"}}, FY2025: {v: 105196, src: "E1 p.92"}}
  - {p: E, name: {lt: "Grupės Scope 3", en: "Group Scope 3"}, unit: "t CO2e", better: down, FY2025: {v: 95680, src: "E1 p.93"}}
