engagement:
  level: watch
  severity: minor
  verdict:
    lt: "Geras emitentas: grupės Scope 1 nuo 2020 m. sumažėjo 47 %, ISO 14001/50001, KPMG užtikrinimas [E1 p.92; E1 p.8; E1 p.168]. Kreiptis nereikia – tik patikrinti, ar 2026 m. bus patvirtintas naujas klimato planas."
    en: "A good issuer: Group Scope 1 down 47% since 2020, ISO 14001/50001, KPMG assurance [E1 p.92; E1 p.8; E1 p.168]. No need to write; just check that the new climate plan is approved in 2026."
  issues:
    - what: {lt: "Patronuojančios bendrovės klimato tikslas peržiūrimas, naujas planas – 2026 m. I pusm.", en: "The parent company's climate target is under revision; a new plan is due in H1 2026."}
      why: {lt: "Kol nėra naujo tikslo, negalime vertinti pažangos [E1 p.86].", en: "Until the new target exists we cannot assess progress [E1 p.86]."}
      fix: {lt: "Kitoje peržiūroje patikrinti, ar planas paskelbtas.", en: "Check at the next review whether the plan was published."}
  policies: [investments, electricity_renewables, climate_nature]
  reason:
    lt: "SEB elektros ir AEI politikos lūkesčiai tinklams (nuostolių mažinimas, AEI integravimas), ISO 14001/50001, metinė darnumo ataskaita – įvykdyti [E1 p.84; E1 p.8]. Stebėti: 2026 m. turi būti patvirtintas grupės klimato pereinamasis planas su naujais tikslais [E1 p.86]."
    en: "SEB Electricity & Renewables expectations for grids (loss reduction, renewables integration), ISO 14001/50001 and an annual sustainability report are met [E1 p.84; E1 p.8]. To watch: the Group climate transition plan with new targets is due for approval in 2026 [E1 p.86]."
  questions: []
# Trumpai paprasta kalba (rodoma ESG puslapio viršuje): kas gerai, kas negerai, ką tai reiškia mums
brief:
  good:
    - {lt: "Nauda visuomenei – energetinis saugumas: 2025 m. Baltijos elektros sistema galutinai atsijungė nuo Rusijos ir prisijungė prie Europos tinklo, beveik metais anksčiau nei planuota [E1 p.4].", en: "Benefit to society – energy security: in 2025 the Baltic power system finally disconnected from Russia and joined the European grid, almost a year ahead of plan [E1 p.4]."}
    - {lt: "Grupės tarša nuo 2020 m. sumažėjo 47 % [E1 p.92].", en: "Group emissions are down 47% since 2020 [E1 p.92]."}
    - {lt: "Tvarumo ataskaitą tikrino auditorius KPMG [E1 p.8].", en: "The sustainability report was checked by the auditor KPMG [E1 p.8]."}
  bad:
    - {lt: "Pati AST (be dukterinių įmonių) senojo tikslo nebepasieks: po prisijungimo prie Europos elektros tinklo išaugo elektros nuostoliai. Naujas planas žadamas 2026 m. I pusmetį [E1 p.86].", en: "AST itself (without subsidiaries) will miss its old target: grid losses rose after joining the European grid. A new plan is promised for H1 2026 [E1 p.86]."}
  means: {lt: "Smulkmena. Rašyti nereikia – 2026 m. pažiūrėsime, ar paskelbtas naujas planas.", en: "Minor. No need to write – in 2026 check that the new plan is out."}
  seb: {status: ok, lt: "Skelbia taršą, turi aplinkosaugos vadybos sertifikatus, ataskaitą tikrina auditorius.", en: "Discloses pollution, has environmental management certificates, the report is audited."}
