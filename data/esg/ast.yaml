    name: {lt: "AST (patronuojanti): bendrų GHG mažinimas kasmet nuo 2020 m. bazės", en: "AST (parent): annual reduction of total GHG vs the 2020 base"}
    FY2024: {lt: "Tikslas −2,4 % per metus [E2 p.85]; 2024 m. +0 % per metus, −7 % nuo 2020 m. (be nuostolių) [E2 p.90]", en: "Target −2.4% a year [E2 p.85]; 2024: 0% y/y, −7% vs 2020 (excl. losses) [E2 p.90]"}
    FY2025: {lt: "Tikslas peržiūrimas, naujas planas 2026 m. I pusm. [E1 p.86]", en: "Target under review, new plan in H1 2026 [E1 p.86]"}
    status: changed
  - p: E
    name: {lt: "Conexus: GHG (Scope 1) −30 % iki 2028 m. nuo 2020 m.", en: "Conexus: GHG (Scope 1) −30% by 2028 vs 2020"}
    FY2024: {lt: "−11 % (2024 m. tikslas −6 %) [E1 p.86]", en: "−11% (2024 target −6%) [E1 p.86]"}
    FY2025: {lt: "Priemonės vykdomos; 2025 m. pažanga atskirai nenurodyta [E1 p.86]", en: "Measures under way; 2025 progress not stated separately [E1 p.86]"}
    status: on_track
