  - {p: E, name: {lt: "Scope 2 išmetimai", en: "Scope 2 emissions"}, unit: "t CO2", better: down, FY2023: {v: 904, src: "E1 p.22"}, FY2024: {v: 674, src: "E1 p.22"}, FY2025: {v: 835, src: "E1 p.22"}}
