engagement:
  level: watch
  severity: minor
  verdict:
    lt: "Pirmoji tvarumo ataskaita – geras žingsnis vidutinei žemės ūkio kooperatyvo įmonei [E1 p.3]. Kreiptis dar anksti; kitais metais patikrinti, ar atsiras išmetimų tikslas."
    en: "The first sustainability report is a good step for a mid-sized agricultural cooperative [E1 p.3]. Too early to write; check next year whether an emissions target appears."
  issues:
    - what: {lt: "Nėra išmetimų mažinimo tikslo, Scope 3 neapskaičiuotas, klimato rizika nevertinta.", en: "No emission reduction target, no Scope 3, no climate risk assessment."}
      why: {lt: "Be jų negalime įvertinti pereinamojo laikotarpio rizikos [E1 p.18; E1 p.22].", en: "Without these we cannot assess transition risk [E1 p.18; E1 p.22]."}
      fix: {lt: "Kitoje ataskaitoje patikrinti, ar atsirado.", en: "Check in the next report."}
  policies: [investments, agriculture, climate_nature]
  reason:
    lt: "SEB žemės ūkio politikos apribojimai (miškų naikinimas, nelegalūs pesticidai ir pan.) nepažeisti; skatinamas tikslus augalų apsaugos produktų naudojimas [E1 p.24]. Pirmoji ataskaita – stebėti, ar bus nustatytas išmetimų tikslas, apskaičiuotas Scope 3 ir atliktas klimato rizikos vertinimas [E1 p.18; E1 p.22]."
    en: "SEB Agriculture policy restrictions (deforestation, illegal pesticides, etc.) are not breached; precise use of plant protection products is promoted [E1 p.24]. This is the first report: watch whether an emissions target is set, Scope 3 calculated and a climate risk assessment done [E1 p.18; E1 p.22]."
  questions: []
# Trumpai paprasta kalba (rodoma ESG puslapio viršuje): kas gerai, kas negerai, ką tai reiškia mums
brief:
  good:
    - {lt: "Pirmą kartą paskelbė tvarumo ataskaitą (pagal supaprastintą standartą mažesnėms įmonėms) [E1 p.3].", en: "Published its first sustainability report (under a simplified standard for smaller companies) [E1 p.3]."}
    - {lt: "Planuoja per 5 metus pusantro karto padidinti žaliosios energijos gamybą [E1 p.19].", en: "Plans to raise its own green energy output by half within 5 years [E1 p.19]."}
  bad:
    - {lt: "Nėra tikslo mažinti taršą; tarša svyruoja priklausomai nuo derliaus [E1 p.22].", en: "No emission reduction target; emissions swing with the harvest [E1 p.22]."}
    - {lt: "Klimato rizikos dar neįvertino [E1 p.18].", en: "Climate risk not assessed yet [E1 p.18]."}
  means: {lt: "Smulkmena. Rašyti dar anksti – kitais metais pažiūrėsime, ar atsiras tikslas.", en: "Minor. Too early to write – next year check for a target."}
  seb: {status: mostly, lt: "Gairės tikisi taršos mažinimo tikslo ir klimato rizikos įvertinimo – jų dar nėra.", en: "The guidelines expect a pollution target and a climate risk review – not yet done."}
