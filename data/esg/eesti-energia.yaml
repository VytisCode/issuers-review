engagement:
  level: engage
  policies: [investments, fossil_fuels, electricity_renewables, climate_nature]
  reason:
    lt: "SEB iškastinio kuro politika reikalauja skelbti Scope 1–3 ir trumpo, vidutinio ir ilgo laikotarpio tikslus, tikisi pereinamojo plano; netradicinė nafta (skalūnų alyva) leidžiama pagal Baltijos išimtį iki 2030 m. 2025 m. darnumo duomenų nerasta, tarpiniai tikslai skaičiais neskelbiami [E2 p.94], o 2024 m. nustatyti taršos ribų viršijimai [E2 p.24]."
    en: "The SEB Fossil Fuels policy requires Scope 1–3 disclosure and short-, medium- and long-term targets, and expects a transition plan; unconventional oil (shale oil) is allowed under the Baltic exception until 2030. No 2025 sustainability data was found, interim targets are not published as numbers [E2 p.94], and emission limit exceedances were found in 2024 [E2 p.24]."
  subject: "Eesti Energia: questions from a bondholder on 2025 sustainability reporting and transition targets"
  questions:
    - "Where can we find the audited 2025 sustainability statement (ESRS) with Scope 1, 2 and 3 emissions, and who provided the assurance?"
    - "Your 2024 report describes a five-phase path to carbon neutrality by 2045 with interim targets. Could you share the quantified interim targets and 2025 progress against them?"
    - "What is the planned shale oil production profile after 2030, including Enefit 280-2, and how does it fit the 2045 target?"
    - "Are any measures from the 2024 special audit on emission limits and continuous monitoring still open, and are any proceedings pending?"
