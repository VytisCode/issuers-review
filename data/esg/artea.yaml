engagement:
  level: watch
  severity: minor
  verdict:
    lt: "Bankas juda tinkama kryptimi: SBTi įsipareigojimas, savas veiklos tikslas vykdomas, tvarus finansavimas auga [E1 p.62; E1 p.109]. Finansuojamų išmetimų tikslai dar rengiami (iki 2027 m. vidurio), todėl kreiptis anksti."
    en: "The bank is moving in the right direction: SBTi commitment, its own operations target on track, sustainable finance growing [E1 p.62; E1 p.109]. Financed-emission targets are still being prepared (by mid-2027), so it is too early to write."
  issues:
    - what: {lt: "Finansuojami išmetimai išaugo 30 %, o jų mažinimo tikslų dar nėra.", en: "Financed emissions rose 30%, and there are no reduction targets for them yet."}
      why: {lt: "Tai didžioji banko klimato poveikio dalis [E1 p.115; E1 p.65].", en: "This is most of the bank's climate impact [E1 p.115; E1 p.65]."}
      fix: {lt: "Patikrinti 2026–2027 m. ataskaitose, ar paskelbti SBTi suderinti portfelio tikslai.", en: "Check the 2026–2027 reports for SBTi-aligned portfolio targets."}
    - what: {lt: "2024 m. ataskaitoje buvo klaida (aukštos ASV rizikos paskolos).", en: "The 2024 report contained an error (high ESG-risk loans)."}
      why: {lt: "Bankas pats ją ištaisė, bet tai rodo duomenų kokybės spragas [E1 p.56].", en: "The bank corrected it itself, but it points to data quality gaps [E1 p.56]."}
      fix: {lt: "Kitais metais patikrinti, ar nėra naujų taisymų.", en: "Check next year for further corrections."}
  policies: [investments, financial_general, climate_nature]
  reason:
    lt: "Gera kryptis, bet finansuojamų išmetimų tikslai dar rengiami, o patys išmetimai +30 % [E1 p.65; E1 p.115]."
    en: "Good direction, but financed-emission targets are still being prepared and the emissions rose 30% [E1 p.65; E1 p.115]."
  questions: []
