engagement:
  level: none
  policies: [investments, fossil_fuels, electricity_renewables, climate_nature]
  reason:
    lt: "SEB iškastinio kuro ir atsinaujinančios energetikos politikų reikalavimai įvykdyti: skelbiami Scope 1–3 išmetimai, yra SBTi patvirtinti trumpo, vidutinio ir ilgo laikotarpio tikslai bei pereinamasis planas [E1 p.196; E1 p.198]. 2025 m. intensyvumo augimą emitentas paaiškina laikinomis reguliuojamomis balansavimo paslaugomis [E1 p.29]. Verta stebėti 2026 m., ar intensyvumas grįžta link tikslo."
    en: "SEB Fossil Fuels and Renewable Energy policy requirements are met: Scope 1–3 emissions are disclosed, and there are SBTi-validated short-, medium- and long-term targets and a transition plan [E1 p.196; E1 p.198]. The issuer explains the 2025 rise in intensity by temporary regulated balancing services [E1 p.29]. Worth checking in 2026 whether intensity returns towards the target."
  questions: []
