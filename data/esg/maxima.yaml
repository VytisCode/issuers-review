engagement:
  level: engage
  severity: minor
  verdict:
    lt: "Iš esmės stiprus emitentas: SBTi patvirtinti klimato tikslai, išmetimai mažėja greičiau nei planuota, PwC užtikrinimas [E1 p.72; E1 p.54]. Spragos smulkios ir konkrečios – du paties emitento rodikliai juda ne ta kryptimi. Paklausti verta, nes 2026 m. planuojama nauja obligacijų emisija [E1 p.3]."
    en: "A strong issuer overall: SBTi-validated climate targets, emissions falling faster than planned, PwC assurance [E1 p.72; E1 p.54]. The gaps are small and specific: two of the issuer's own indicators are moving the wrong way. Worth asking because a new bond is planned for 2026 [E1 p.3]."
  issues:
    - what: {lt: "Maisto atliekos Baltijos šalyse auga: 12 412 t (2023 m.) → 14 227 t (2025 m.), +15 %, kai tikslas −30 % iki 2030 m.", en: "Food waste in the Baltics is rising: 12,412 t (2023) → 14,227 t (2025), +15%, while the target is −30% by 2030."}
      why: {lt: "Tai paties emitento tikslas, ir jis du metus iš eilės tolsta [E1 p.81; E2 p.146].", en: "It is the issuer's own target, and it has moved further away two years in a row [E1 p.81; E2 p.146]."}
      fix: {lt: "Emitentas paaiškina priežastis ir pateikia veiksmų planą ar tarpinius tikslus.", en: "The issuer explains the causes and gives an action plan or interim milestones."}
    - what: {lt: "Darbo saugos rodiklis TRIR išaugo 7,01 → 7,88 (+13 %).", en: "The workplace safety rate TRIR rose 7.01 → 7.88 (+13%)."}
      why: {lt: "Didelė darbdavė (registruota 484 nelaimingi atsitikimai); sunkių traumų gi sumažėjo 16 → 4 [E1 p.88].", en: "A large employer (484 recordable accidents); high-consequence injuries did fall 16 → 4 [E1 p.88]."}
      fix: {lt: "Emitentas nurodo priežastis ir 2026 m. saugos tikslus.", en: "The issuer names the causes and its 2026 safety targets."}
  policies: [investments, agriculture, climate_nature, human_rights]
  reason:
    lt: "Stiprus emitentas, bet blogėja maisto atliekų tikslas ir TRIR [E1 p.81; E1 p.88]."
    en: "Strong issuer, but the food-waste target and TRIR are moving the wrong way [E1 p.81; E1 p.88]."
  subject: "Maxima Grupė: a few questions from a bondholder"
  noticed: "We read your 2025 consolidated management report and were pleased to see the progress against your SBTi climate target. We noticed two indicators that moved in the opposite direction and would like to understand them better."
  questions:
    - q: "Food waste in your Baltic operations was 14,227 t in 2025, up from 12,412 t in 2023, while the target is a 30% reduction by 2030. Could you tell us what is driving the increase and which measures are planned to bring it back on track?"
      hint: {lt: "Jei bus aiškus planas ir priežastis (pvz., augimas, nauja apskaita) – tikslą žymime „Atsilieka“, bet engagement baigtas. Jei plano nėra – lieka „Stebėti“ kitais metais.", en: "If there is a clear cause and plan (e.g. growth, new accounting), we mark the target Behind and close the engagement. Without a plan, keep it at Monitor next year."}
    - q: "TRIR rose from 7.01 to 7.88 in 2025. Could you share the main reasons and any safety targets for 2026?"
      hint: {lt: "Jei atsakys su priemonėmis ir tikslu – užtenka. Kitais metais tikrinsime, ar TRIR mažėja.", en: "A reply with measures and a target is enough. Next year we check whether TRIR falls."}
    - q: "Your report mentions that the supplier engagement target (78.3% of suppliers by emissions with science-based targets by 2027) will be reviewed in 2026 after the sale of the Polish and Bulgarian operations. Do you already know whether the target will change?"
      hint: {lt: "Pasikeitus tikslui atnaujinsime tikslų lentelę (būsena „Pakeistas“), kad kitais metais vertintume pagal naują [E1 p.72].", en: "If the target changes we update the target table (status Revised) and assess against the new one next year [E1 p.72]."}
# Trumpai paprasta kalba (rodoma ESG puslapio viršuje): kas gerai, kas negerai, ką tai reiškia mums
brief:
  good:
    - {lt: "Turi tarptautiškai patvirtintą (SBTi) tikslą iki 2030 m. 42 % sumažinti savo CO2 išmetimus (lyginant su 2021 m.) [E2 p.124].", en: "Has an internationally approved (SBTi) target to cut its own CO2 by 42% by 2030 (vs 2021) [E2 p.124]."}
    - {lt: "Jau sumažino 24,5 % – greičiau nei reikia pagal planą [E1 p.72].", en: "Already down 24.5% – ahead of plan [E1 p.72]."}
    - {lt: "Tvarumo ataskaitą abu metus tikrino auditorius PwC [E1 p.54].", en: "The auditor PwC checked the sustainability report in both years [E1 p.54]."}
  bad:
    - {lt: "Išmetamo maisto daugėja: +15 % nuo 2023 m., nors tikslas – sumažinti 30 % [E1 p.81].", en: "Food waste is growing: +15% since 2023, while the target is −30% [E1 p.81]."}
    - {lt: "Nelaimingų atsitikimų darbe padaugėjo 13 % [E1 p.88].", en: "Work accidents rose 13% [E1 p.88]."}
  means: {lt: "Smulkmena, bet verta paklausti: 2026 m. planuojama nauja obligacijų emisija [E1 p.3]. Laiškas su 2 klausimais paruoštas žemiau.", en: "Minor, but worth asking: a new bond issue is planned for 2026 [E1 p.3]. A letter with 2 questions is ready below."}
