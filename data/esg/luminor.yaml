# ESG Engagement: Luminor Bank. Puslapiai - PDF puslapiai.
issuer: luminor
analysis_date: 2026-10-23
sources:
  E1: {title: "Luminor Bank Annual Report 2025", url: "https://luminor.lv/sites/default/files/docs/finansu_parskati/luminor_bank_annual_report_2025-lv.pdf", date: 2026-03}
  E2: {title: "Luminor Bank Annual Report 2024", url: "https://luminor.lv/sites/default/files/docs/finansu_parskati/luminor-bank-annual-report-2024-compressed.pdf", date: 2025-03}
trend: mixed
summary:
  lt: "Bankas skelbia tikslų lentelę ir pats nurodo, kur atsilieka [E1 p.18]. 2025 m. pasiekti: nuosavi išmetimai vienam darbuotojui 0,68 t (tikslas 0,72), A klasės būsto paskolų dalis 32,8 % (tikslas 30 % iki 2027 m.), tvarus finansavimas 305 mln. EUR (tikslas 228 mln. iki 2027 m.) [E1 p.18]. Nepasiekti: pereinamojo laikotarpio planai didelės rizikos skolinime 75,2 % (tikslas 90 %), AEI elektra 76,2 % (tikslas 100 %) [E1 p.18; E1 p.57]. Finansuojami išmetimai mažėja; PwC riboto užtikrinimo išvada [E1 p.52; E1 p.182]."
  en: "The bank publishes a target table and states where it falls short [E1 p.18]. Met in 2025: own emissions per FTE 0.68 t (target 0.72), EPC A share of mortgages 32.8% (target 30% by 2027), sustainable lending EUR 305m (target EUR 228m by 2027) [E1 p.18]. Missed: transition plans in high-risk lending 75.2% (target 90%), renewable electricity 76.2% (target 100%) [E1 p.18; E1 p.57]. Financed emissions are falling; PwC limited assurance [E1 p.52; E1 p.182]."
years:
  FY2025:
    trend: mixed
    framework:
      lt: "Tvarumo ataskaita pagal ESRS metiniame pranešime; PwC riboto užtikrinimo išvada [E1 p.181; E1 p.182]."
      en: "ESRS sustainability statement in the management report; PwC limited assurance [E1 p.181; E1 p.182]."
    assurance: limited
    summary:
      lt: "Nuosavi išmetimai 2 571 → 2 240 t; įmonių paskolų anglies intensyvumas 698 → 580 t/mln. EUR [E1 p.18; E1 p.52]. Du 2025 m. tikslai nepasiekti (pereinamojo laikotarpio planai, 100 % AEI elektra) [E1 p.18; E1 p.57]."
      en: "Own emissions 2,571 → 2,240 t; corporate loan carbon intensity 698 → 580 t/EUR m [E1 p.18; E1 p.52]. Two 2025 targets missed (transition plans, 100% renewable electricity) [E1 p.18; E1 p.57]."
    evidence:
      - {p: E, lt: "Finansuojami išmetimai: būsto paskolos 241 562 → 151 578 t, įmonių paskolos 2 584 683 → 2 320 517 t, lizingas 74 483 → 57 368 t [E1 p.52].", en: "Financed emissions: mortgages 241,562 → 151,578 t, corporate loans 2,584,683 → 2,320,517 t, motor leasing 74,483 → 57,368 t [E1 p.52]."}
      - {p: E, lt: "Naujas tikslas: nuosavos veiklos išmetimai −42 % iki 2030 m., palyginti su 2024 m. [E1 p.52].", en: "New target: own operations emissions −42% by 2030 vs 2024 [E1 p.52]."}
      - {p: E, lt: "Žaliųjų ir su tvarumu susietų obligacijų dalis portfelyje 3,2 → 7,4 % (tikslas 50 % iki 2030 m.) [E1 p.18].", en: "Green and sustainability-linked bonds in the portfolio 3.2 → 7.4% (target 50% by 2030) [E1 p.18]."}
      - {p: E, lt: "2024 m. finansuojami išmetimai perskaičiuoti; visas Scope 3 (investicijos) 3 035 923 → 3 199 507 t [E1 p.21].", en: "2024 financed emissions restated; total Scope 3 (investments) 3,035,923 → 3,199,507 t [E1 p.21]."}
      - {p: S, lt: "Klientų NPS +56 (tikslas +50) [E1 p.18].", en: "Customer NPS +56 (target +50) [E1 p.18]."}
      - {p: G, lt: "2025 m. patvirtinta nauja pranešėjų apsaugos tvarka [E1 p.72].", en: "New whistleblowing procedure adopted in 2025 [E1 p.72]."}
      - {p: G, lt: "Sustainalytics ESG rizikos įvertinimas 18,4 (maža rizika) [E1 p.18].", en: "Sustainalytics ESG risk rating 18.4 (low risk) [E1 p.18]."}
    concerns:
      - {lt: "Pereinamojo laikotarpio planų dalis didelės rizikos skolinime sumažėjo iki 75,2 % (tikslas 90 % iki 2025 m.) [E1 p.18].", en: "Share of high-risk lending with transition plans fell to 75.2% (target 90% by 2025) [E1 p.18]."}
      - {lt: "Moterų dalis stebėtojų taryboje sumažėjo iki 33,3 % (tikslas 40 % iki 2026 m.) [E1 p.28].", en: "Women on the Supervisory Council fell to 33.3% (target 40% by 2026) [E1 p.28]."}
      - {lt: "AEI elektros dalis 76,2 % – 100 % tikslas iki 2025 m. pabaigos nepasiektas [E1 p.18; E1 p.57].", en: "Renewable electricity 76.2%: the 100% target for end-2025 was missed [E1 p.18; E1 p.57]."}
  FY2024:
    trend: improving
    framework:
      lt: "Tvarumo ataskaita pagal ESRS su PwC riboto užtikrinimo išvada [E2 p.28; E2 p.247]."
      en: "ESRS sustainability statement with PwC limited assurance [E2 p.28; E2 p.247]."
    assurance: limited
    summary:
      lt: "Nuosavi išmetimai 2 571 t, 1,0 t vienam darbuotojui (tikslas −50 % nuo 2021 m. 1,44 t) [E2 p.26]. Tvarus finansavimas 182 mln. EUR, A klasės būsto paskolos 28,9 % [E2 p.26]."
      en: "Own emissions 2,571 t, 1.0 t per FTE (target −50% from 1.44 t in 2021) [E2 p.26]. Sustainable lending EUR 182m, EPC A mortgages 28.9% [E2 p.26]."
    evidence:
      - {p: E, lt: "Pereinamojo laikotarpio planai didelės rizikos skolinime 81 % [E2 p.26].", en: "Transition plans in high-risk lending 81% [E2 p.26]."}
      - {p: S, lt: "Klientų NPS +55 (tikslas +40) [E2 p.26].", en: "Customer NPS +55 (target +40) [E2 p.26]."}
      - {p: G, lt: "Moterų dalis stebėtojų taryboje 44 % (tikslas 40 % iki 2026 m.) [E2 p.26].", en: "Women on the Supervisory Council 44% (target 40% by 2026) [E2 p.26]."}
    concerns:
      - {lt: "Darbuotojų eNPS +47 – žemiau 50–55 tikslo [E2 p.26].", en: "Employee eNPS +47, below the 50–55 target [E2 p.26]."}
targets:
