    FY2025: {lt: "76,2 % [E1 p.18; E1 p.57]", en: "76.2% [E1 p.18; E1 p.57]"}
    status: missed
  - p: E
    name: {lt: "A klasės būsto paskolų dalis 30 % iki 2027 m.", en: "EPC A share of mortgages 30% by 2027"}
    FY2024: {lt: "28,9 % [E2 p.26]", en: "28.9% [E2 p.26]"}
    FY2025: {lt: "32,8 % [E1 p.18]", en: "32.8% [E1 p.18]"}
