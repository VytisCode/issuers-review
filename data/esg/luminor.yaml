engagement:
  level: watch
  severity: minor
  verdict:
    lt: "Geras emitentas: aiški tikslų lentelė, PwC užtikrinimas, finansuojami išmetimai mažėja; bankas pats atskleidžia, ko nepasiekė [E1 p.18; E1 p.182]. Kreiptis nereikia."
    en: "A good issuer: a clear target table, PwC assurance, falling financed emissions; the bank itself discloses what it missed [E1 p.18; E1 p.182]. No need to write."
  issues:
    - what: {lt: "Nepasiekti 2025 m. tikslai: pereinamojo laikotarpio planai 75,2 % (tikslas 90 %), AEI elektra 76,2 % (tikslas 100 %).", en: "Missed 2025 targets: transition plans 75.2% (target 90%), renewable electricity 76.2% (target 100%)."}
      why: {lt: "Pereinamojo laikotarpio planų dalis net sumažėjo [E1 p.18; E1 p.57].", en: "The transition-plan share even fell [E1 p.18; E1 p.57]."}
      fix: {lt: "Kitais metais patikrinti, ar rodikliai atsigauna ar tikslai pakeisti.", en: "Check next year whether the indicators recover or the targets are revised."}
  policies: [investments, financial_general, climate_nature]
  reason:
    lt: "SEB finansų sektoriaus lūkesčiai (tikslai, finansuojami išmetimai, užtikrinimas) iš esmės atitinkami: tikslai su terminais, PwC užtikrinimas, finansuojami išmetimai mažėja [E1 p.18; E1 p.52; E1 p.182]. Bankas pats atskleidžia du nepasiektus tikslus, todėl kreiptis nebūtina – stebėti, ar 2026 m. atsigaus pereinamojo laikotarpio planų dalis [E1 p.18]."
    en: "SEB's financial-sector expectations (targets, financed emissions, assurance) are broadly met: dated targets, PwC assurance and falling financed emissions [E1 p.18; E1 p.52; E1 p.182]. The bank itself discloses the two missed targets, so engagement is not needed; watch whether the transition-plan share recovers in 2026 [E1 p.18]."
  questions: []
# Trumpai paprasta kalba (rodoma ESG puslapio viršuje): kas gerai, kas negerai, ką tai reiškia mums
brief:
  good:
    - {lt: "Nauda visuomenei: kartu su Europos investicijų banku teikia mažoms ir vidutinėms įmonėms paskolas mažesnėmis palūkanomis [E1 p.13].", en: "Benefit to society: together with the European Investment Bank it offers small and medium-sized businesses loans at lower interest [E1 p.13]."}
    - {lt: "Bankas pats skelbia tikslų lentelę ir atvirai rodo, ko nepasiekė [E1 p.18].", en: "The bank publishes a target table and openly shows what it missed [E1 p.18]."}
    - {lt: "Pasiekė: mažiau savo taršos, daugiau paskolų taupiems būstams, 305 mln. EUR tvaraus finansavimo [E1 p.18].", en: "Achieved: lower own emissions, more loans for efficient homes, EUR 305m of sustainable finance [E1 p.18]."}
    - {lt: "Klientų tarša mažėja; ataskaitą tikrino auditorius PwC [E1 p.52; E1 p.182].", en: "Borrowers' emissions are falling; the auditor PwC checked the report [E1 p.52; E1 p.182]."}
  bad:
    - {lt: "Nepasiekti du tikslai: tik 75 % taršių klientų turi pertvarkos planus (tikslas 90 %), žalioji elektra 76 % (tikslas 100 %) [E1 p.18].", en: "Two targets missed: only 75% of high-emission borrowers have transition plans (target 90%), green power 76% (target 100%) [E1 p.18]."}
  means: {lt: "Smulkmena, rašyti nereikia.", en: "Minor, no need to write."}
  seb: {status: ok, lt: "Skelbia klientų taršą ir tikslus, ataskaitą tikrina auditorius.", en: "Discloses borrowers' pollution and targets, audited report."}
