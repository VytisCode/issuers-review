    FY2024: {lt: "81,3 % [E1 p.18]", en: "81.3% [E1 p.18]"}
    FY2025: {lt: "75,2 % [E1 p.18]", en: "75.2% [E1 p.18]"}
    status: missed
  - p: E
    name: {lt: "100 % AEI elektra iki 2025 m. pabaigos", en: "100% renewable electricity by end-2025"}
