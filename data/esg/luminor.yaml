  - {p: E, name: {lt: "Scope 1 išmetimai", en: "Scope 1 emissions"}, unit: "t CO2e", better: down, FY2024: {v: 31.3, src: "E1 p.52"}, FY2025: {v: 31.7, src: "E1 p.52"}}
  - {p: E, name: {lt: "Scope 2 išmetimai (rinkos metodas)", en: "Scope 2 emissions (market-based)"}, unit: "t CO2e", better: down, FY2024: {v: 1011.7, src: "E1 p.52"}, FY2025: {v: 927.0, src: "E1 p.52"}}
  - {p: E, name: {lt: "Finansuojami išmetimai – įmonių paskolos", en: "Financed emissions – corporate loans"}, unit: "t CO2e", better: down, FY2024: {v: 2584683, src: "E1 p.52", note: {lt: "perskaičiuota", en: "restated"}}, FY2025: {v: 2320517, src: "E1 p.52"}}
