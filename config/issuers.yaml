# Emitentų sąrašas. Naują emitentą pridėkite čia, o jo vertybinius popierius - config/securities.csv.
# media: kurių šalių žiniasklaidą tikrinti (LT, LV, EE; "all" - visos trys + tarptautinė anglų k.)
# seb_policies: kurios SEB sektorių politikos taikomos (raktai iš config/seb_policies.yaml)
# report_pages: puslapiai, kuriuose ieškoma naujų ataskaitų (PDF) - tikrina tools/check_filings.py
# news_match: žodžiai, kurių turi būti antraštėje (kad nepatektų nesusijusios naujienos)
# news_exclude: žodžiai, dėl kurių naujiena atmetama (pvz. Panerai Luminor laikrodžiai)
# news_queries: papildomos Google News užklausos (be AI, nemokamai)

ignitis:
  name: Ignitis grupė
  legal_name: AB "Ignitis grupė"
  country: LT
  sector: Energy utility (networks, renewables, flexibility, supply)
  owner: Republic of Lithuania (Ministry of Finance) ~75%
  website: https://ignitisgrupe.lt/en
  ir_page: https://ignitisgrupe.lt/en/reports-presentations-and-fact-sheets
  ratings_page: https://ignitisgrupe.lt/en/investors/credit-ratings
  nasdaq_ticker: IGN1L
  media: all
  seb_policies: [investments, fossil_fuels, electricity_renewables, climate_nature, human_rights, anti_corruption]
  report_pages:
    - https://ignitisgrupe.lt/en/reports-presentations-and-fact-sheets
    - https://ignitisgrupe.lt/en/investors/bonds
  report_calendar: "Q3 2026 interim report: 2026-11-11"
  news_match: [ignitis]
  news_queries:
    - '"Ignitis"'
    - '"Ignitis grupė"'

luminor:
  name: Luminor Bank
  legal_name: Luminor Bank AS
  country: EE
  sector: Bank (Baltic universal bank; EE, LV, LT)
  owner: Luminor Holding (Blackstone-led consortium 80.05%, DNB 19.95%); sale of 100% to OTP Bank announced 2026-07-20, pending approvals
  website: https://www.luminor.ee/en
  ir_page: https://luminor.lv/en/financial-reports
  ratings_page: https://luminor.lv/en/financial-reports
  nasdaq_ticker: ""
  media: all
  seb_policies: [investments, financial_general, climate_nature, human_rights, anti_corruption]
  report_pages:
    - https://luminor.lv/en/financial-reports
    - https://luminor.lv/en/placements
  report_calendar: "3Q 2026 interim report: expected ~November 2026"
  news_match: [luminor]
  news_exclude: [panerai, watch, laikrod, pam0, swiss, tourbillon]
  news_queries:
    - '"Luminor"'
    - '"Luminor" OTP'

port-of-tallinn:
  name: Port of Tallinn
  legal_name: AS Tallinna Sadam
  country: EE
  sector: Ports, ferry services (Saaremaa/Hiiumaa), icebreaking, real estate
  owner: Republic of Estonia (Ministry of Climate) 67.03%
  website: https://www.ts.ee/en/
  ir_page: https://www.ts.ee/en/investor/
  ratings_page: ""
  nasdaq_ticker: TSM1T
  media: EE
  seb_policies: [investments, shipping, climate_nature, human_rights, anti_corruption]
  report_pages:
    - https://www.ts.ee/en/investor/interim-reports/
    - https://www.ts.ee/en/investor/presentations/
  report_calendar: "Q3 2026 results: expected ~November 2026"
  news_match: [tallinna sadam, port of tallinn, tallinna sadama]
  news_queries:
    - '"Tallinna Sadam"'
    - '"Port of Tallinn"'
