# Bendri nustatymai.
# languages: kuriomis kalbomis generuoti ataskaitų failus (lt, en, lv, et).
#   Savininko sprendimai 2026-10-22: iš pradžių tik lt; tą pačią dieną pridėta en (pristatymui kolegoms). Tekstai ataskaitose jau yra visomis 4 kalbomis,
#   tad kitas kalbas galima įjungti tiesiog įrašant jas čia, pvz. [lt, en, lv, et].
